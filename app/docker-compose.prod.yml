# Production stack: caddy (TLS, same-origin routing) -> web + api -> postgres.
# Two env files: app/deploy/.env.prod holds the human-owned secrets (see
# docs/deploy.md); app/deploy/.env.deploy is written by app/scripts/deploy.sh
# (image tags, model file and label, deployment sampling) -- never edit it.
# Deploys run through deploy.sh; by hand, from the repo root:
#   docker compose --env-file app/deploy/.env.prod \
#     --env-file app/deploy/.env.deploy -f app/docker-compose.prod.yml up -d
# (relative paths below resolve against this file's directory, app/)
#
# The api and web images are built in CI and pulled from GHCR, tagged by
# content (app/scripts/deploy_tags.sh). To build them locally instead, add
# -f app/docker-compose.build.yml. Never build on the production box.
#
# The api service is intentionally a single container with a single uvicorn
# worker: all live game state is in-process. Do not scale it out.
#
# Third-party images are pinned to exact versions and deploys pull only our
# own images: a floating tag would let an upstream patch release recreate
# caddy (dropping every websocket) or postgres as a side effect of an
# unrelated deploy. Bump a pin in its own commit.

# Docker's json-file logs otherwise grow without bound on the box's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sheepshead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: sheepshead
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sheepshead}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner; invoked by the deploy script:
  #   docker compose ... run --rm migrate
  migrate:
    image: node:22.23.4-alpine
    profiles: ["tools"]
    logging: *logging
    working_dir: /db
    volumes:
      - ./db:/db
      # Every deploy runs this; the cache makes its npm ci local work.
      - npm-cache:/root/.npm
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sheepshead}:${POSTGRES_PASSWORD:?}@postgres:5432/sheepshead
    command: sh -c "npm ci --no-audit --no-fund && npx graphile-migrate migrate"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/adamanthil/sheepshead-api:${API_TAG:?set API_TAG (deploy.sh writes it)}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      SHEEPSHEAD_MODEL_PATH: /models/model.pt
      SHEEPSHEAD_MODEL_LABEL: ${SHEEPSHEAD_MODEL_LABEL:?set SHEEPSHEAD_MODEL_LABEL}
      # Deployment sampling, tuned per checkpoint (0 = argmax; band unset = none).
      SHEEPSHEAD_TEMPERATURE_PICK: ${SHEEPSHEAD_TEMPERATURE_PICK:-0}
      SHEEPSHEAD_TEMPERATURE_PARTNER: ${SHEEPSHEAD_TEMPERATURE_PARTNER:-0}
      SHEEPSHEAD_TEMPERATURE_BURY: ${SHEEPSHEAD_TEMPERATURE_BURY:-0}
      SHEEPSHEAD_TEMPERATURE_PLAY: ${SHEEPSHEAD_TEMPERATURE_PLAY:-0}
      SHEEPSHEAD_LOGIT_BAND: ${SHEEPSHEAD_LOGIT_BAND:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-sheepshead}:${POSTGRES_PASSWORD:?}@postgres:5432/sheepshead
      ENV: production
      LOG_FORMAT: json
      # Same-origin via Caddy, but the allowlist must be non-empty in prod.
      SHEEPSHEAD_CORS_ORIGINS: https://${DOMAIN:?set DOMAIN}
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
    volumes:
      - ${MODEL_FILE:?set MODEL_FILE to the checkpoint path on the host}:/models/model.pt:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/adamanthil/sheepshead-web:${WEB_TAG:?set WEB_TAG (deploy.sh writes it)}
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  db-backup:
    image: prodrigestivill/postgres-backup-local:18-debian-d257e5d
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: sheepshead
      POSTGRES_USER: ${POSTGRES_USER:-sheepshead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
    volumes:
      # Repo-root backups/ (gitignored) — unchanged host location from
      # before the compose files moved into app/.
      - ../backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  npm-cache:
  caddy_data:
  caddy_config:

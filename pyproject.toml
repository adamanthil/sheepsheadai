[project]
name = "sheepshead-ai"
version = "0.1.0"
description = "Reinforcement Learning agent for the trick-taking card game Sheepshead."
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openskill>=6.2.0",
    "pip-tools>=7.6.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[project.scripts]
train-ppo = "sheepshead.training.train_ppo:main"
training-program = "sheepshead.training.run_training_program:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sheepshead", "app/server"]
exclude = ["sheepshead/tests"]

[project.optional-dependencies]
server = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "websockets>=17.4",
    "asyncpg>=0.32.0",
    "slowapi>=0.1.10",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "httpx2>=2.16.0",
]
dev = [
    "ruff>=0.17.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    # Pinned exactly: the pre-commit gate and CI must agree with the editor's
    # language server to the patch level, or a version bump silently reports
    # errors in one place and not the other. Point the editor at
    # .venv/bin/basedpyright (see .zed/settings.json) and bump both together.
    "basedpyright==1.39.10",
]

# Ruff's pre-0.16 default rule set (E4/E7/E9 + F) plus `I` -- isort. `ruff
# format` does not touch import order, so import sorting rides on the lint pass
# instead: `ruff check` flags it (I001) and `ruff check --fix` rewrites it.
# That is what both CI and the prek hooks already run, so neither needed a new
# step.
[tool.ruff.lint]
# Named explicitly: ruff 0.16 grew its default set from 59 rules to 413 and
# dropped some of these. Adopting any of the new defaults is its own change.
select = ["E4", "E7", "E9", "F"]
# BLE: a blanket `except Exception` must say why (noqa) or catch less.
# RUF100: a noqa that no longer suppresses anything is an error, so stale
# suppressions cannot pile up.
extend-select = ["I", "BLE", "RUF100"]

# Since 0.16 `ruff format` also rewrites Python code blocks in Markdown. The
# Markdown here is notes and plans, whose snippets are quoted as written.
[tool.ruff.format]
exclude = ["*.md"]

# `server` is rooted at app/, not at the project root, so ruff cannot infer it
# as first-party the way it does `sheepshead`. Name both explicitly to keep
# server imports out of the third-party block.
[tool.ruff.lint.isort]
known-first-party = ["sheepshead", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that blocks this long dumps every thread's traceback to stderr, so a
# hang names its culprit instead of sitting silent (it does not abort the run).
faulthandler_timeout = 300
testpaths = ["sheepshead/tests", "app/server/tests"]
markers = [
    "slow: long-running training/architecture tests; deselect with -m 'not slow'",
]

# Linux (CI, Docker) gets CPU-only torch wheels: the CUDA distribution is
# several GB and useless on those hosts. macOS wheels are CPU-only already.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

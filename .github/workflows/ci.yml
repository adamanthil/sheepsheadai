name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rollback: build (if needed) and publish the images of an older commit.
  # The test jobs still run first, on the dispatched branch's head.
  workflow_dispatch:
    inputs:
      ref:
        description: "commit to publish (default: the branch head)"
        required: false

jobs:
  # Exactly what `prek install` runs before each commit, over the whole tree:
  # ruff format/check and basedpyright. The server extra is needed too --
  # type-checking app/server means resolving fastapi, pydantic and asyncpg.
  # The frontend half of the prek config skips itself here (no node_modules);
  # the `web` job below covers eslint and prettier.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra server --extra dev
      - uses: j178/prek-action@v1

  server:
    runs-on: ubuntu-latest
    services:
      # Not used by the smoke tests yet; API-flow tests (Phase 4) run against it.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: sheepshead
          POSTGRES_PASSWORD: sheepshead
          POSTGRES_DB: sheepshead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sheepshead"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Python 3.14 comes from requires-python in pyproject.toml; the server
      # code uses PEP 758 syntax, so older interpreters cannot parse it.
      - run: uv sync --extra server --extra dev
      # Lint and formatting live in the `lint` job; this one only proves the
      # sources parse under 3.14 before the suites below import them.
      - run: uv run python -m compileall -q app/server
      # The api image tag hashes only app/deploy/api-paths.txt, so that list
      # must cover everything the server imports or a deploy misses a restart.
      - run: uv run python app/scripts/check_api_paths.py
      # Apply migrations to the service container (exercises graphile-migrate)
      # so the API-flow tests run against the real schema.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: app/db
      - run: npx graphile-migrate migrate
        working-directory: app/db
        env:
          DATABASE_URL: postgres://sheepshead:sheepshead@localhost:5432/sheepshead
      - run: uv run pytest app/server/tests -q
        env:
          TEST_DATABASE_URL: postgres://sheepshead:sheepshead@localhost:5432/sheepshead
      # The committed OpenAPI schema (and the TS types generated from it)
      # must match the live server schemas.
      - run: uv run python app/scripts/export_openapi.py
      - run: git diff --exit-code app/web/openapi.json

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # CPU-only torch wheels on Linux via [tool.uv.sources]; the server
      # extra is not needed for the training suite.
      - run: uv sync --extra dev
      # The model manifest's shape (hashes, the one deploy entry and its
      # sampling, panel membership); no download.
      - run: uv run python -m sheepshead.eval.fetch_models --lint
      - run: uv run pytest sheepshead/tests -q

  # Weight-init, forward-output and ISMCTS bit identity of this push (or PR)
  # against the commit before it, both captured on this runner in this
  # environment -- the fingerprints are BLAS-dependent, so they are never
  # committed. Intentional changes are declared per commit with a
  # `Changes-Network-Outputs:` trailer; see sheepshead/devtools/check_goldens.py.
  # Full history is needed for the baseline worktree and the trailer scan.
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python -m sheepshead.devtools.check_goldens --baseline "$BASELINE"
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git diff --exit-code lib/api.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""

  # Production images, tagged by content (app/scripts/deploy_tags.sh), so a
  # commit that does not touch a service's files reuses its existing image
  # and the deploy leaves that service running. Built here, never on the box.
  # See notebooks/CD_Deployment_Plan_202608.md section 6.2.
  images:
    needs: [lint, server, training, goldens, web]
    if: >-
      (github.event_name == 'push'
         && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
      api: ${{ steps.tags.outputs.api }}
      web: ${{ steps.tags.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: tags
        run: app/scripts/deploy_tags.sh | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Separate cache scopes keep the two builds from evicting each other's
      # layers. The source label links each package to this repository.
      - name: build api if missing
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/sheepshead-api:${{ steps.tags.outputs.api }}
        run: |
          if docker manifest inspect "$IMG" >/dev/null 2>&1; then
            echo "$IMG exists; skipping the build"
          else
            docker buildx build -f app/server/Dockerfile -t "$IMG" \
              --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
              --cache-from type=gha,scope=api --cache-to type=gha,scope=api,mode=max --push .
          fi
      # NEXT_PUBLIC_API_BASE stays at the Dockerfile's empty default:
      # same-origin behind Caddy.
      - name: build web if missing
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/sheepshead-web:${{ steps.tags.outputs.web }}
        run: |
          if docker manifest inspect "$IMG" >/dev/null 2>&1; then
            echo "$IMG exists; skipping the build"
          else
            docker buildx build -t "$IMG" \
              --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
              --cache-from type=gha,scope=web --cache-to type=gha,scope=web,mode=max --push app/web
          fi

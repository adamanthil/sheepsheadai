name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Exactly what `prek install` runs before each commit, over the whole tree:
  # ruff format/check and basedpyright. The server extra is needed too --
  # type-checking app/server means resolving fastapi, pydantic and asyncpg.
  # The frontend half of the prek config skips itself here (no node_modules);
  # the `web` job below covers eslint and prettier.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra server --extra dev
      - uses: j178/prek-action@v1

  server:
    runs-on: ubuntu-latest
    services:
      # Not used by the smoke tests yet; API-flow tests (Phase 4) run against it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sheepshead
          POSTGRES_PASSWORD: sheepshead
          POSTGRES_DB: sheepshead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sheepshead"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Python 3.14 comes from requires-python in pyproject.toml; the server
      # code uses PEP 758 syntax, so older interpreters cannot parse it.
      - run: uv sync --extra server --extra dev
      # Lint and formatting live in the `lint` job; this one only proves the
      # sources parse under 3.14 before the suites below import them.
      - run: uv run python -m compileall -q app/server
      # Apply migrations to the service container (exercises graphile-migrate)
      # so the API-flow tests run against the real schema.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: app/db
      - run: npx graphile-migrate migrate
        working-directory: app/db
        env:
          DATABASE_URL: postgres://sheepshead:sheepshead@localhost:5432/sheepshead
      - run: uv run pytest app/server/tests -q
        env:
          TEST_DATABASE_URL: postgres://sheepshead:sheepshead@localhost:5432/sheepshead
      # The committed OpenAPI schema (and the TS types generated from it)
      # must match the live server schemas.
      - run: uv run python app/scripts/export_openapi.py
      - run: git diff --exit-code app/web/openapi.json

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # CPU-only torch wheels on Linux via [tool.uv.sources]; the server
      # extra is not needed for the training suite.
      - run: uv sync --extra dev
      # The model manifest's shape (hashes, the one deploy entry and its
      # sampling, panel membership); no download.
      - run: uv run python -m sheepshead.eval.fetch_models --lint
      - run: uv run pytest sheepshead/tests -q

  # Weight-init, forward-output and ISMCTS bit identity of this push (or PR)
  # against the commit before it, both captured on this runner in this
  # environment -- the fingerprints are BLAS-dependent, so they are never
  # committed. Intentional changes are declared per commit with a
  # `Changes-Network-Outputs:` trailer; see sheepshead/devtools/check_goldens.py.
  # Full history is needed for the baseline worktree and the trailer scan.
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python -m sheepshead.devtools.check_goldens --baseline "$BASELINE"
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git diff --exit-code lib/api.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""

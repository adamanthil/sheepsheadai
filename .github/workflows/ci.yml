name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rollback: build (if needed) and publish the images of an older commit.
  # The test jobs still run first, on the dispatched branch's head.
  workflow_dispatch:
    inputs:
      ref:
        description: "commit to publish (default: the branch head)"
        required: false

# The repository default hands every job a read-write GITHUB_TOKEN. Only the
# images job needs more (packages: write), and it grants that itself.
permissions:
  contents: read

jobs:
  # Exactly what `prek install` runs before each commit, over the whole tree:
  # ruff format/check and basedpyright. The server extra is needed too --
  # type-checking app/server means resolving fastapi, pydantic and asyncpg.
  # The frontend half of the prek config skips itself here (no node_modules);
  # the `web` job below covers eslint and prettier.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --extra server --extra dev
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  server:
    runs-on: ubuntu-latest
    services:
      # Not used by the smoke tests yet; API-flow tests (Phase 4) run against it.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: sheepshead
          POSTGRES_PASSWORD: sheepshead
          POSTGRES_DB: sheepshead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sheepshead"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # Python 3.14 comes from requires-python in pyproject.toml; the server
      # code uses PEP 758 syntax, so older interpreters cannot parse it.
      - run: uv sync --extra server --extra dev
      # Lint and formatting live in the `lint` job; this one only proves the
      # sources parse under 3.14 before the suites below import them.
      - run: uv run python -m compileall -q app/server
      # The api image tag hashes only app/deploy/api-paths.txt, so that list
      # must cover everything the server imports or a deploy misses a restart.
      - run: uv run python app/scripts/check_api_paths.py
      # Apply migrations to the service container (exercises graphile-migrate)
      # so the API-flow tests run against the real schema.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: app/db
      - run: npx graphile-migrate migrate
        working-directory: app/db
        env:
          DATABASE_URL: postgres://sheepshead:sheepshead@localhost:5432/sheepshead
      - run: uv run pytest app/server/tests -q
        env:
          TEST_DATABASE_URL: postgres://sheepshead:sheepshead@localhost:5432/sheepshead
      # The committed OpenAPI schema (and the TS types generated from it)
      # must match the live server schemas.
      - run: uv run python app/scripts/export_openapi.py
      - run: git diff --exit-code app/web/openapi.json

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # CPU-only torch wheels on Linux via [tool.uv.sources]; the server
      # extra is not needed for the training suite.
      - run: uv sync --extra dev
      # The model manifest's shape (hashes, the one deploy entry and its
      # sampling, panel membership); no download.
      - run: uv run python -m sheepshead.eval.fetch_models --lint
      - run: uv run pytest sheepshead/tests -q

  # Weight-init, forward-output and ISMCTS bit identity of this push (or PR)
  # against the commit before it, both captured on this runner in this
  # environment -- the fingerprints are BLAS-dependent, so they are never
  # committed. Intentional changes are declared per commit with a
  # `Changes-Network-Outputs:` trailer; see sheepshead/devtools/check_goldens.py.
  # Full history is needed for the baseline worktree and the trailer scan.
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python -m sheepshead.devtools.check_goldens --baseline "$BASELINE"
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git diff --exit-code lib/api.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""

  # The Playwright suite against the real server, a production build of the
  # web app and a migrated Postgres, with the e2e model checkpoint.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: sheepshead
          POSTGRES_PASSWORD: sheepshead
          POSTGRES_DB: sheepshead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sheepshead"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --extra server
      - run: uv run python -m sheepshead.eval.fetch_models --key pfsp-swish-30m
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/web/package-lock.json
            app/db/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app/db
      - run: npm ci --no-audit --no-fund
        working-directory: app/web
      - run: npx playwright install --with-deps chromium
        working-directory: app/web
      # e2e/database.mjs finds the service container reachable, so it only
      # migrates it rather than starting a database of its own.
      - run: npm run e2e
        working-directory: app/web
        env:
          E2E_DATABASE_URL: postgres://sheepshead:sheepshead@localhost:5432/sheepshead
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: app/web/test-results/
          retention-days: 7

  # Production images, tagged by content (app/scripts/deploy_tags.sh), so a
  # commit that does not touch a service's files reuses its existing image
  # and the deploy leaves that service running. Built here, never on the box.
  # See notebooks/CD_Deployment_Plan_202608.md section 6.2.
  images:
    needs: [lint, server, training, goldens, web, e2e]
    if: >-
      (github.event_name == 'push'
         && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
      api: ${{ steps.tags.outputs.api }}
      web: ${{ steps.tags.outputs.web }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The ancestry check below needs the default branch's history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
      # The test jobs above ran on the dispatched branch's head, not on
      # `ref`, so only publish (and deploy) a commit that is already on the
      # default branch, i.e. one that passed CI when it was pushed there.
      - name: require a commit from the default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$DEFAULT" ||
            { echo "$(git rev-parse HEAD) is not on $DEFAULT; refusing to publish" >&2; exit 1; }
      - id: tags
        run: app/scripts/deploy_tags.sh | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Separate cache scopes keep the two builds from evicting each other's
      # layers. The source label links each package to this repository.
      - name: build api if missing
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/sheepshead-api:${{ steps.tags.outputs.api }}
        run: |
          if docker manifest inspect "$IMG" >/dev/null 2>&1; then
            echo "$IMG exists; skipping the build"
          else
            docker buildx build -f app/server/Dockerfile -t "$IMG" \
              --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
              --cache-from type=gha,scope=api --cache-to type=gha,scope=api,mode=max --push .
          fi
      # NEXT_PUBLIC_API_BASE stays at the Dockerfile's empty default:
      # same-origin behind Caddy.
      - name: build web if missing
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/sheepshead-web:${{ steps.tags.outputs.web }}
        run: |
          if docker manifest inspect "$IMG" >/dev/null 2>&1; then
            echo "$IMG exists; skipping the build"
          else
            docker buildx build -t "$IMG" \
              --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
              --cache-from type=gha,scope=web --cache-to type=gha,scope=web,mode=max --push app/web
          fi

  # Ssh to the box, whose deploy key can run only app/scripts/deploy.sh.
  # Inert until the repository variable DEPLOY_ENABLED is "true", which the
  # operator sets once the box is provisioned and the production
  # environment holds DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS.
  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: deploy over ssh
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ARGS: ${{ needs.images.outputs.sha }} ${{ needs.images.outputs.api }} ${{ needs.images.outputs.web }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          # Keepalives: the runner's NAT drops a connection idle for ~4
          # minutes, and a fresh api image pull is silent for longer.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "deploy@$HOST" "$ARGS"

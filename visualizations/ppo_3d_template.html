      const rSpan = NETWORK_MODE === 1 ? 0.42 : 0.62;
      const r = active ? rBase + clamp(mag / Math.max(maxNorm, 1e-6), 0, 1) * rSpan : 0.14;
      const sph = new THREE.Mesh(
        new THREE.SphereGeometry(r, 18, 14),
        new THREE.MeshStandardMaterial({
          color: active ? tokenColor(i) : C.dim,
          emissive: active ? tokenColor(i) : C.dim,
          emissiveIntensity: active ? 0.45 : 0.05,
          metalness: 0.3, roughness: 0.4,
          transparent: !active, opacity: active ? 1 : 0.15,
        }),
      );
      sph.position.copy(pos[i]);
      gl.add(sph);
      nodeObjs.push({ mesh: sph, r });

      const code = tokenCardCode(i);
      const isTrump = code && trumpCardCodes.includes(code);
      // Labels on the first and last rings only — inner rings stay clean.
      if ((l === 0 || l === N_LAYERS - 1)
          && (code || info.type === "context" || info.type === "memory")) {
        const labText = code || info.type;
        const labColor = code ? (isTrump ? "#ffe89c" : "#cfe9ff") : "#ffd9a0";
        const labScale = NETWORK_MODE === 1 ? (code ? 0.4 : 0.36) : (code ? 0.55 : 0.48);
        const tlab = makeLabel(labText, labColor, labScale);
        const outward = pos[i].clone().sub(center).normalize();
        tlab.position.copy(pos[i]).addScaledVector(outward, r + 1.3);
        gl.add(tlab);
      }

      registerPickable(sph, {
        title: code
          ? `L${l + 1} · token ${i} · ${code}${isTrump ? " (trump)" : ""}`
          : `L${l + 1} · token ${i} · ${info.type}`,
        badge: "enc",
        kv: {
          "type": info.type,
          "card": code || (active ? "—" : "PAD"),
          [`‖after L${l + 1}‖`]: mag.toFixed(2),
        },
        body: `<p>This token's ${DATA.dims.d_token}-d state after layer ${l + 1}'s attention + FFN. <b>Sphere size</b> = its L2 norm at this depth — watch it change ring to ring as the layers rewrite the representation.</p>`,
      });
    }

    // Per-head attention chords: symmetrized weight per (i, j, head),
    // normalized within the layer, strongest kept. Additive tubes; hue =
    // head. Both modes flow through layerTriples() — dense policy maps and
    // the oracle's sparse top-K serialization (a missing direction of a
    // pair counts as 0).
    const MAX_CHORDS_PER_LAYER = NETWORK_MODE === 1 ? 60 : 36;
    const CHORD_FLOOR = NETWORK_MODE === 1 ? 0.10 : 0.07;
    const directed = layerTriples(l);
    let maxW = 0;
    for (const t of directed) maxW = Math.max(maxW, t.w);
    const wmap = new Map();
    for (const t of directed) wmap.set((t.h * N_TOK + t.i) * N_TOK + t.j, t.w);
    const seenPairs = new Set();
    const triples = [];
    for (const t of directed) {
      const i = Math.min(t.i, t.j), j = Math.max(t.i, t.j);
      const key = (t.h * N_TOK + i) * N_TOK + j;
      if (seenPairs.has(key)) continue;
      seenPairs.add(key);
      const wij = wmap.get((t.h * N_TOK + i) * N_TOK + j) || 0;
      const wji = wmap.get((t.h * N_TOK + j) * N_TOK + i) || 0;
      const norm = ((wij + wji) / 2) / Math.max(maxW, 1e-6);
      if (norm >= CHORD_FLOOR) triples.push({ h: t.h, i, j, norm });
    }
    triples.sort((a, b) => b.norm - a.norm);
    for (const { h, i, j, norm } of triples.slice(0, MAX_CHORDS_PER_LAYER)) {
      const start = pos[i];
      const end = pos[j];
      const mid = start.clone().add(end).multiplyScalar(0.5).lerp(center, 0.6);
      // Nudge each head's chords onto its own shallow x-offset plane so
      // overlapping pairs from different heads stay distinguishable.
      mid.x += (h - (N_HEADS - 1) / 2) * 0.55;
      const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
      addChord(gl, curve, norm, HEAD_COLORS[h], `xf${l}`, h);
    }

    // FFN lens: a slim luminous disc + per-token gems on the rails right
    // behind the ring — the 64→128→64 SiLU expansion, gem glow = hidden norm.
    const lensX = xfX(l) + XSA.xfSpacing * 0.45;
    const ffnMax = Math.max(...L.ffn_hidden_norms.filter((_, i) => tokenMask(i)));
    const lens = new THREE.Mesh(
      new THREE.CylinderGeometry(RING_R * 0.99, RING_R * 0.99, 0.10, 48, 1, true),
      new THREE.MeshBasicMaterial({
        color: 0x2a6fae, transparent: true, opacity: 0.15,
        blending: THREE.AdditiveBlending, depthWrite: false,
        side: THREE.DoubleSide,
      }),
    );
    lens.position.set(lensX, RING_CY, 0);
    lens.rotation.z = Math.PI / 2;
    gl.add(lens);
    const ffnLab = makeLabel(
      `FFN ${DATA.dims.d_token}→${DATA.dims.d_token * 2}→${DATA.dims.d_token} · SiLU`,
      "#9fd8ff", 0.42);
    ffnLab.position.set(lensX, RING_CY - RING_R - 1.7, 0);
    gl.add(ffnLab);
    for (let i = 0; i < N_TOK; i++) {
      if (!tokenMask(i)) continue;
      const hNorm = L.ffn_hidden_norms[i] / Math.max(ffnMax, 1e-6);
      const gem = new THREE.Mesh(
        new THREE.OctahedronGeometry((NETWORK_MODE === 1 ? 0.17 : 0.24) + hNorm * 0.22),
        new THREE.MeshStandardMaterial({
          color: C.enc, emissive: C.enc,
          emissiveIntensity: 0.15 + hNorm * 0.75,
          metalness: 0.5, roughness: 0.3,
        }),
      );
      const p = ringPoint(l, i);
      gem.position.set(lensX, p.y, p.z);
      gl.add(gem);
      registerPickable(gem, {
        title: `L${l + 1} FFN · ${tokName(i)}`,
        badge: "enc",
        kv: { "‖hidden (128d)‖": L.ffn_hidden_norms[i].toFixed(2) },
        body: `<p>The position-wise FFN expands this token to ${DATA.dims.d_token * 2}d (SiLU), then projects back to ${DATA.dims.d_token}d. Gem glow = how strongly the hidden layer fired for this token.</p>`,
      });
    }

    layerObjs.push({ disc, nodeObjs });
  }

  // Exit plane: the final layer's FFN lens sits behind ring N, so the rails
  // continue THROUGH it and every downstream tap (readout chords, GRU wire,
  // pointer tethers) originates past it — the final FFN's output IS the
  // all_tokens tensor everything downstream reads.
  const exitPos = ringPosByLayer[N_LAYERS - 1].map(
    p => p.clone().add(new THREE.Vector3(XSA.xfSpacing * 0.75, 0, 0)));

  // Output tokens: the transformer's product, re-materialized as spheres on
  // the exit plane — no ring disc, no layer label; this is what LEAVES the
  // tunnel — so the readout / GRU / pointer taps attach to tokens, not to
  // bare rail ends. Grouped with the final layer so they stay lit in the
  // gru / readout / pointer stages.
  {
    const gOut = group(`xf${N_LAYERS - 1}`);
    const outNorms = layers[N_LAYERS - 1].token_norms_ffn;
    const outMax = Math.max(...outNorms.filter((_, i) => tokenMask(i)));
    const driverIdx = curMemory().driver === "memory" ? 1 : 0;
    for (let i = 0; i < N_TOK; i++) {
      if (!tokenMask(i)) continue;
      const rBase = NETWORK_MODE === 1 ? 0.26 : 0.38;
      const rSpan = NETWORK_MODE === 1 ? 0.36 : 0.52;
      const r = rBase + clamp(outNorms[i] / Math.max(outMax, 1e-6), 0, 1) * rSpan;
      const sph = new THREE.Mesh(
        new THREE.SphereGeometry(r, 18, 14),
        new THREE.MeshStandardMaterial({
          color: tokenColor(i), emissive: tokenColor(i), emissiveIntensity: 0.5,
          metalness: 0.3, roughness: 0.4,
        }),
      );
      sph.position.copy(exitPos[i]);
      gOut.add(sph);
      registerPickable(sph, {
        title: `output token · ${tokName(i)}`,
        badge: "enc",
        kv: { "‖vec‖": outNorms[i].toFixed(2), "dim": `${curDims().d_token} (post final FFN + LN)` },
        body: `<p>The transformer's output for this token — projected back to ${curDims().d_token}d by the final FFN, residual-added and LayerNormed. This exact vector is what the readout queries read${i === driverIdx ? ", and it drives the GRU memory write" : ""}${NETWORK_MODE === 0 && TOKEN_INFO[i].type === "hand" ? " — and the pointer scorer reads it directly" : ""}.</p>`,
      });
    }
  }

  // Residual-stream rails: each active token rides a straight rail through
  // every ring (same angle on each) — the transformer only nudges it —
  // and on out through the final FFN lens to the exit plane.
  for (let i = 0; i < N_TOK; i++) {
    if (!tokenMask(i)) continue;
    const p0 = ringPosByLayer[0][i];
    const p1 = exitPos[i];
    const rail = registerConn(
      makeFatLine([p0, p1], tokenColor(i), 0.16, 1.1), 0.16);
    rail.userData.flowCurve = new THREE.LineCurve3(p0.clone(), p1.clone());
    rail.userData.flowColor = tokenColor(i);
    rail.userData.flowIntensity = 0.3;
    g.add(rail);
  }

  // Entry lines: token bank column → first ring.
  for (let i = 0; i < N_TOK; i++) {
    if (!tokenMask(i)) continue;
    const start = tokensInfo.tokenObjs[i].pos.clone().add(new THREE.Vector3(2.3, 0, 0));
    g.add(makeGlowLine(start, ringPosByLayer[0][i].clone(), C.enc, NETWORK_MODE === 1 ? 0.10 : 0.16));
  }

  return { ringPosByLayer, exitPos, layerObjs };
}

// Strongest attention pairs of one layer (head-tagged), for the stage text.
function topPairsHtml(l, k = 5) {
  const triples = layerTriples(l).slice().sort((a, b) => b.w - a.w);
  const seen = new Set();
  const rows = [];
  for (const t of triples) {
    const key = `${Math.min(t.i, t.j)}-${Math.max(t.i, t.j)}-${t.h}`;
    if (seen.has(key)) continue;
    seen.add(key);
    const hue = "#" + HEAD_COLORS[t.h].toString(16).padStart(6, "0");
    rows.push(
      `<span style="color:${hue}">●</span> <b>${tokName(t.i)}</b> → <b>${tokName(t.j)}</b> ${(t.w * 100).toFixed(0)}%`);
    if (rows.length >= k) break;
  }
  return rows.join("<br>");
}

// ============================================================
// STAGE 5: GRU + MEMORY FEEDBACK (reads the CONTEXT token in v2)
// ============================================================
function buildMemory() {
  const g = group("gru");
  const lab = makeStageLabel("5 · GRU MEMORY UPDATE", "#f4a261");
  lab.position.set(XSA.gru, -9.7, 0);
  g.add(lab);

  const GRU_Y = RING_CY + RING_R + 6;
  const gruGeom = new THREE.CylinderGeometry(1.8, 1.8, 3, 6);
  const gruMat = new THREE.MeshStandardMaterial({
    color: 0xf4a261, emissive: 0xf4a261, emissiveIntensity: 0.4,
    metalness: 0.4, roughness: 0.3,
  });
  const gru = new THREE.Mesh(gruGeom, gruMat);
  gru.position.set(XSA.gru, GRU_Y, 0);
  g.add(gru);
  const gruLab = makeLabel(`GRUCell · ${DATA.dims.d_token} → ${DATA.dims.d_model}`, "#ffd99c", 0.55);
  gruLab.position.set(XSA.gru, GRU_Y + 3, 0);
  g.add(gruLab);

  const mem = curMemory();
  const memInMag = vecMag(mem.memory_in);
  const memOutMag = vecMag(mem.memory_out);
  const driverIsMemory = mem.driver === "memory";
  const driverName = driverIsMemory ? "memory token" : "context token";
  const netName = NETWORK_MODE === 1 ? "oracle" : "policy";
  registerPickable(gru, {
    title: "memory_gru (GRUCell)",
    badge: "share",
    kv: { "‖memory_in‖": memInMag.toFixed(2), "‖memory_out‖": memOutMag.toFixed(2), "driver": driverName },
    body: `<p>The only true recurrence in the network. memory_out = GRU(<b>${driverName}</b> after reasoning, memory_in) — ${driverIsMemory
      ? `the transformer's own "what to remember" slot drives the write (the ${netName} network's wiring), leaving the context token as the current-situation summary`
      : "the context token drives the write"}.</p>
      <p>Stored per-player and read back on the next decision step — the curved arc going back to the left is exactly that feedback.</p>`,
  });

  // Driver token on the final ring → GRU (context @ index 0 in v2).
  const memTokPos = xfInfo.exitPos[driverIsMemory ? 1 : 0];
  g.add(makeGlowLine(memTokPos.clone(), gru.position.clone(), C.share, 0.6));
  const wireLab = makeLabel(`post-reasoning ${driverName}`, "#ffd99c", 0.45);
  wireLab.position.copy(memTokPos).lerp(gru.position, 0.5).add(new THREE.Vector3(0, 1.2, 0));
  g.add(wireLab);

  // Feedback arc: from gru position back to the memory chip at input
  const start = new THREE.Vector3(XSA.gru - 1.5, GRU_Y, 0);
  const end = inputInfo.memAnchor.clone();
  const curve = new THREE.CubicBezierCurve3(
    start,
    new THREE.Vector3(start.x - 5, GRU_Y + 12, 0),
    new THREE.Vector3(end.x + 5, GRU_Y + 12, end.z),
    end,
  );
  const arc = registerConn(makeFatLine(curve.getPoints(80), 0xf4a261, 0.55, 2.2), 0.55);
  // The recurrence loop gets a denser particle stream — the one piece of
  // state that literally flows back in time deserves a comet.
  arc.userData.flowCurve = curve;
  arc.userData.flowColor = 0xffc98a;
  arc.userData.flowIntensity = 0.55;
  arc.userData.flowBoost = 3;
  g.add(arc);

  const arrowGeom = new THREE.ConeGeometry(0.4, 1.0, 12);
  const arrowMat = new THREE.MeshStandardMaterial({
    color: 0xf4a261, emissive: 0xf4a261, emissiveIntensity: 0.6,
  });
  const arrow = new THREE.Mesh(arrowGeom, arrowMat);
  arrow.position.copy(end);
  arrow.rotation.z = Math.PI / 2;
  g.add(arrow);

  const arcLab = makeLabel("memory_out → next-step memory_in (via memory_in_proj)", "#ffd99c", 0.5);
  arcLab.position.set((XSA.input + XSA.gru) / 2, GRU_Y + 10.5, 0);
  g.add(arcLab);

  return { gru, curve };
}

// ============================================================
// STAGE 6: SHARED READOUT — ONE set of 16 learned queries (4×4 grid)
// cross-attends over the 15 post-reasoning tokens and produces the
// single 256-d `features` vector that BOTH actor and critic consume.
// Default view: each gem shows only its top-3 attended tokens (averaged
// over the heads enabled via the H1–H4 chips). Clicking a gem reveals its
// full per-head fan.
// ============================================================
function buildSharedReadout() {
  const g = group("readout");
  const nQ = curDims().n_readout_queries;
  const attn = curReadout().attn; // (H, M, N_TOK)
  const lab = makeStageLabel(
    NETWORK_MODE === 1
      ? `6 · ORACLE READOUT · ${nQ} queries × ${N_TOK} tokens`
      : `6 · SHARED READOUT · ${nQ} queries × ${N_TOK} tokens`,
    NETWORK_MODE === 1 ? "#c9b8ff" : "#ffc65c");
  lab.position.set(XSA.readout + 2, -9.7, 14);
  g.add(lab);

  // Head-averaged weight per (query, token), normalized across the readout.
  const w = [];
  let maxW = 0;
  for (let q = 0; q < nQ; q++) {
    w.push([]);
    for (let i = 0; i < N_TOK; i++) {
      let s = 0;
      for (let h = 0; h < N_HEADS; h++) s += attn[h][q][i];
      s /= N_HEADS;
      w[q].push(s);
      if (tokenMask(i)) maxW = Math.max(maxW, s);
    }
  }
  let maxWHead = 0; // separate scale for the per-head fans
  for (let h = 0; h < N_HEADS; h++) {
    for (let q = 0; q < nQ; q++) {
      for (let i = 0; i < N_TOK; i++) {
        if (tokenMask(i)) maxWHead = Math.max(maxWHead, attn[h][q][i]);
      }
    }
  }

  const hubPos = new THREE.Vector3(XSA.hub, RING_CY, 0);
  const GRID = Math.ceil(Math.sqrt(nQ)); // 4×4 for 16 queries
  const SPACING = 3.3;
  const gemPositions = [];
  const gems = [];
  for (let q = 0; q < nQ; q++) {
    const row = Math.floor(q / GRID), col = q % GRID;
    const gp = new THREE.Vector3(
      XSA.readout,
      RING_CY + ((GRID - 1) / 2 - row) * SPACING,
      (col - (GRID - 1) / 2) * SPACING,
    );
    gemPositions.push(gp);
    const gcolor = readoutGemColor(q);
    const gem = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.85),
      new THREE.MeshStandardMaterial({
        color: gcolor, emissive: gcolor, emissiveIntensity: 0.5,
        metalness: 0.6, roughness: 0.22,
      }),
    );
    gem.position.copy(gp);
    gem.userData.pulsePhase = q * 0.9;
    g.add(gem);
    gems.push(gem);

    // Ranked attended tokens for the tooltip / info panel.
    const ranked = w[q]
      .map((v, i) => ({ v, i }))
      .filter(t => tokenMask(t.i))
      .sort((a, b) => b.v - a.v);
    const top = ranked.slice(0, 3)
      .map(t => `${tokName(t.i)} ${(t.v * 100).toFixed(0)}%`)
      .join(" · ");
    registerPickable(gem, {
      title: `${NETWORK_MODE === 1 ? "oracle" : "shared"} readout query ${q + 1} / ${nQ}`,
      badge: "share",
      kv: { "attends most to": top },
      body: `<p>A learned ${DATA.dims.d_token}-d query. It cross-attends (${N_HEADS} heads) over all ${N_TOK} post-reasoning tokens. Only its <b>top-3</b> links are drawn by default, averaged over the heads enabled in the ⋯ menu — <b>click to expand the full per-head fan</b> (colored by head, the head toggles filter it too). Click again to collapse.</p>`,
      onPick: () => selectQuery(q),
    });

    // Full per-head fan (hidden until the gem is selected): top-4 per head.
    for (let h = 0; h < N_HEADS; h++) {
      const rankedH = attn[h][q]
        .map((v, i) => ({ v, i }))
        .filter(t => tokenMask(t.i) && t.v / Math.max(maxWHead, 1e-6) >= 0.08)
        .sort((a, b) => b.v - a.v)
        .slice(0, 4);
      for (const t of rankedH) {
        const norm = t.v / Math.max(maxWHead, 1e-6);
        const start = xfInfo.exitPos[t.i].clone();
        const mid = start.clone().add(gp).multiplyScalar(0.5);
        mid.z += gp.z * 0.25;
        mid.y += (h - (N_HEADS - 1) / 2) * 0.5; // per-head plane offset
        const curve = new THREE.QuadraticBezierCurve3(start, mid, gp.clone());
        const c = addChord(g, curve, norm, HEAD_COLORS[h], "readout", h);
        c.qSel = q;
      }
    }
  }

  // Default chords: each gem's top-3 attended tokens, averaged over the
  // ENABLED heads (H1–H4 chips) — rebuilt whenever a chip flips, so with a
  // single head on they show that head's own top-3 (matching its gem fan).
  function rebuildTopChords() {
    for (let i = allChords.length - 1; i >= 0; i--) {
      const c = allChords[i];
      if (c.qTop === undefined) continue;
      g.remove(c.mesh);
      c.mesh.geometry.dispose();
      c.mesh.material.dispose();
      allChords.splice(i, 1);
    }
    const on = [];
    for (let h = 0; h < N_HEADS; h++) if (headOn[h]) on.push(h);
    if (!on.length) return; // no heads enabled → no default chords
    const wOn = [];
    let maxOn = 0;
    for (let q = 0; q < nQ; q++) {
      wOn.push([]);
      for (let i = 0; i < N_TOK; i++) {
        let s = 0;
        for (const h of on) s += attn[h][q][i];
        s /= on.length;
        wOn[q].push(s);
        if (tokenMask(i)) maxOn = Math.max(maxOn, s);
      }
    }
    for (let q = 0; q < nQ; q++) {
      const gp = gemPositions[q];
      const gcolor = readoutGemColor(q);
      const ranked = wOn[q]
        .map((v, i) => ({ v, i }))
        .filter(t => tokenMask(t.i))
        .sort((a, b) => b.v - a.v);
      for (const t of ranked.slice(0, 3)) {
        const norm = t.v / Math.max(maxOn, 1e-6);
        const start = xfInfo.exitPos[t.i].clone();
        const mid = start.clone().add(gp).multiplyScalar(0.5);
        mid.z += gp.z * 0.25; // fan gently toward the gem's grid column
        const curve = new THREE.QuadraticBezierCurve3(start, mid, gp.clone());
        const c = addChord(g, curve, Math.max(norm, 0.12), gcolor.getHex(), "readout", undefined);
        c.qTop = q;
      }
    }
  }
  rebuildTopChords();

  // Features hub: policy = concat(16 × 64) → Linear+LN → 256 `features`;
  // oracle = concat(4 × 64) → Linear (no LN) → 256, read only by the trunk.
  const hubColor = NETWORK_MODE === 1 ? ORACLE_VIOLET : READOUT_GOLD;
  const featVec = curReadout().features;
  const hub = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 4.0, 1.7),
    new THREE.MeshStandardMaterial({
      color: hubColor, emissive: hubColor, emissiveIntensity: 0.4,
      metalness: 0.4, roughness: 0.35,
    }),
  );
  hub.position.copy(hubPos);
  g.add(hub);
  const hubLab = makeLabel(
    NETWORK_MODE === 1
      ? `concat ${nQ}×${curDims().d_token} → Linear → readout (${curDims().d_model}) · no LN`
      : `concat ${nQ}×${curDims().d_token} → Linear+LN → features (${curDims().d_model})`,
    NETWORK_MODE === 1 ? "#e6dcff" : "#ffe9c4", 0.5);
  hubLab.position.copy(hubPos).add(new THREE.Vector3(0, 3.0, 0));
  g.add(hubLab);
  registerPickable(hub, {
    title: NETWORK_MODE === 1 ? "oracle readout_proj" : "shared readout_proj → features",
    badge: "share",
    kv: {
      "in": `${nQ} × ${curDims().d_token} = ${nQ * curDims().d_token}`,
      "out": NETWORK_MODE === 1 ? `${curDims().d_model} (bare Linear)` : `${curDims().d_model} (LayerNorm-pinned)`,
      "‖vec‖": vecMag(featVec).toFixed(2),
    },
    body: NETWORK_MODE === 1
      ? `<p>The ${nQ} query answers are flattened and linearly projected to ${curDims().d_model}d — the only thing the value trunk sees. No LayerNorm here (the trunk's own input LayerNorm pins the scale), and no other consumer: the oracle is a pure value network.</p>`
      : `<p>The ${nQ} query answers are flattened and projected to ${curDims().d_model}d, then LayerNorm pins the scale (v2's correction — v1's bare Linear left it floating). This one vector is <b>everything</b> both networks see: the actor's heads and the critic's value + aux stack all read it. Decision-time attention runs once, here in the encoder.</p>`,
  });
  for (const gp of gemPositions) {
    g.add(makeGlowLine(gp.clone(), hubPos.clone(), hubColor, 0.22));
  }
  return { gemPositions, hubPos: hubPos.clone(), gems, rebuildTopChords };
}

// ============================================================
// STAGE 7: ACTOR heads, laid out by DECISION GROUP on the actor side
// of the scene (+z; the critic owns −z). Each lane holds exactly the heads
// whose logits compete in one masked softmax:
//   pick lane      pick_head → PICK / PASS
//   partner lane   partner_basic_head (ALONE / JD PARTNER) + two-tower CALL
//   cards lane     pointer over hand slots (BURY / UNDER / PLAY) + PLAY UNDER
// Every legal-action element records where it sits in actionSources, so
// the output stage draws each action's flow from the head that scored it.
// ============================================================
// All actor lanes share one depth plane (ACTOR_PLANE_Z) and read as rows
// from the front: the top row holds the pre-play decisions in game order
// (pick, then partner call), the bottom row the cards lane.
const ACTOR_PLANE_Z = 12;
const TOP_ROW_Y = 24;  // pick + partner lanes
const HEAD_Y = 14;     // adapter height, and the softmax's
const OUT_Z = ACTOR_PLANE_Z;
let actionSources = {}; // action name → { pos: Vector3, color }

// Live-vs-idle styling: the head that actually decides this scenario is shown
// at full strength; the others stay visible but dimmed.
function headStyle(isLive) {
  return {
    opacity: isLive ? 1.0 : 0.3,
    emissiveBoost: isLive ? 1.0 : 0.25,
    labelColor: isLive ? "#dffbe6" : "#5d6790",
    suffix: isLive ? "" : " · idle",
  };
}
function laneCaption(g, text, pos, live) {
  const lab = makeLabel(live ? `${text} · live` : text, live ? "#b8f0a2" : "#7f8bb8", 0.55);
  lab.position.copy(pos);
  g.add(lab);
}
// Big title over each side of the network: ACTOR (+z) / CRITIC (−z).
function sideTitle(g, text, pos, color) {
  const t = makeLabel(text, color, 0.95);
  t.position.copy(pos);
  g.add(t);
}

function buildActor() {
  actionSources = {};
  const g = group("actor");
  const lab = makeStageLabel("7 · ACTOR · policy heads", "#80ed99");
  lab.position.set(XS.heads + 6, -9.7, ACTOR_PLANE_Z + 6);
  g.add(lab);

  const live = liveHead();

  // adapter cube, at the mouth of the actor side
  const adapter = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 3.2, 1.6),
    new THREE.MeshStandardMaterial({
      color: 0x80ed99, emissive: 0x80ed99, emissiveIntensity: 0.35,
      metalness: 0.35, roughness: 0.4,
    }),
  );
  adapter.position.set(XS.actor, HEAD_Y, ACTOR_PLANE_Z);
  g.add(adapter);
  const adapterLab = makeLabel("actor_adapter (256→256)", "#cdf5d8", 0.5);
  adapterLab.position.set(XS.actor, HEAD_Y + 2.6, ACTOR_PLANE_Z);
  g.add(adapterLab);
  sideTitle(g, "ACTOR", new THREE.Vector3(XS.actor, HEAD_Y + 5, ACTOR_PLANE_Z), "#80ed99");
  registerPickable(adapter, {
    title: "actor_adapter",
    badge: "actor",
    body: `<p>LayerNorm → Linear(256→256) → SiLU → Linear(256→256) → SiLU. Its input is the encoder's shared 256-d <code>features</code> vector — the same one the critic reads. Everything the policy knows arrives through it, and it fans out to the three decision lanes to its right.</p>`,
  });
  g.add(makeGlowLine(readoutInfo.hubPos.clone(), adapter.position.clone(), C.actor, 0.5));

  // ----- (a) pick lane: PICK vs PASS -----
  const zP = ACTOR_PLANE_Z;
  const pickStyle = headStyle(live === "pick");
  const pickProbs = softmax(S.actor.pick_logits);
  laneCaption(g, "pick", new THREE.Vector3(XS.heads + 1, TOP_ROW_Y + 5.5, zP), live === "pick");
  const pickDefs = [
    { name: "PICK", y: TOP_ROW_Y + 2, prob: pickProbs[0], logit: S.actor.pick_logits[0], dir: 1 },
    { name: "PASS", y: TOP_ROW_Y - 2, prob: pickProbs[1], logit: S.actor.pick_logits[1], dir: -1 },
  ];
  for (const p of pickDefs) {
    // Idle probabilities can still be extreme (e.g. PASS ≈ 1 mid-hand);
    // keep the idle balls modest so they don't dominate the live head.
    const r = 0.45 + p.prob * (live === "pick" ? 1.4 : 0.5);
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(r, 22, 16),
      new THREE.MeshStandardMaterial({
        color: 0x80ed99, emissive: 0x80ed99,
        emissiveIntensity: (0.3 + p.prob * 0.7) * pickStyle.emissiveBoost,
        metalness: 0.4, roughness: 0.35,
        transparent: pickStyle.opacity < 1, opacity: pickStyle.opacity,
      }),
    );
    ball.position.set(XS.heads + 1, p.y, zP);
    g.add(ball);
    const pl = makeLabel(`${p.name} · logit ${p.logit.toFixed(1)}${pickStyle.suffix}`, pickStyle.labelColor, 0.48);
    pl.position.set(XS.heads + 1, p.y + p.dir * (r + 0.7), zP);
    g.add(pl);
    registerPickable(ball, {
      title: `pick_head · ${p.name}`,
      badge: "actor",
      kv: { "logit": p.logit.toFixed(3), "live here": live === "pick" ? "yes" : "no" },
      body: `<p>pick_head is a Linear(256→2). Its two logits are divided by <code>temperature_pick</code>, masked to the legal actions and softmaxed — the output stage shows the result.${live === "pick" ? "" : " Not the deciding head for this scenario."}</p>`,
    });
    g.add(makeGlowLine(adapter.position.clone(), ball.position.clone(), 0x80ed99, live === "pick" ? 0.5 : 0.15));
    actionSources[p.name] = { pos: ball.position.clone(), color: 0x80ed99 };
  }

  // ----- (b) partner lane: ALONE / JD PARTNER + two-tower CALL -----
  const zC = ACTOR_PLANE_Z;
  const PX = XS.heads + 6; // partner lane starts right of the pick lane
  const callStyle = headStyle(live === "call");
  laneCaption(g, "partner call", new THREE.Vector3(PX + 5, TOP_ROW_Y + 5.5, zC), live === "call");
  const callable = S.sample.callable_cards.length
    ? S.sample.callable_cards.map(c => c.code)
    : ["AC", "AS", "AH", "10C", "10S", "10H"]; // illustrative when no call is legal
  const callableIds = callable.map(c => deckIds[c]);
  const cardScores = S.actor.card_scores_all;
  const fadeOpts = (color, intensity) => ({
    color, emissive: color, emissiveIntensity: intensity * callStyle.emissiveBoost,
    metalness: 0.4, roughness: 0.4,
    transparent: callStyle.opacity < 1, opacity: callStyle.opacity,
  });

  // Tower 1 (query from the features) and tower 2 (the card table).
  const qNode = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12),
    new THREE.MeshStandardMaterial(fadeOpts(0x80ed99, 0.6)));
  qNode.position.set(PX, TOP_ROW_Y + 0.5, zC);
  g.add(qNode);
  const qLab = makeLabel("q = tw_Wg(feat)", callStyle.labelColor, 0.4);
  qLab.position.set(PX, TOP_ROW_Y - 0.6, zC);
  g.add(qLab);
  registerPickable(qNode, {
    title: "two-tower query q = tw_Wg(feat)",
    badge: "actor",
    body: `<p>${DATA.dims.tw_latent}-d query produced from the ${DATA.dims.d_model}-d actor features (tower 1). Dot-producted against tw_We's projection of every card embedding to score the CALL actions.</p>`,
  });
  g.add(makeGlowLine(adapter.position.clone(), qNode.position.clone(), 0x80ed99, live === "call" ? 0.5 : 0.15));
  const tableNode = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.8, 0.5),
    new THREE.MeshStandardMaterial(fadeOpts(0xb58bff, 0.35)));
  tableNode.position.set(PX, TOP_ROW_Y + 3.3, zC);
  g.add(tableNode);
  const tableLab = makeLabel(`tw_We(card table 34×${DATA.dims.d_card})`, callStyle.labelColor, 0.38);
  tableLab.position.set(PX, TOP_ROW_Y + 4.6, zC);
  g.add(tableLab);
  registerPickable(tableNode, {
    title: "two-tower keys K = tw_We(card_emb)",
    badge: "actor",
    kv: { "keys": `34 × ${DATA.dims.tw_latent}` },
    body: `<p>Tower 2: every row of the shared 34×${DATA.dims.d_card} card embedding table (far left) projected to ${DATA.dims.tw_latent}d. Score for a card = q · K[card]ᵀ, so the CALL head inherits everything the embedding learned elsewhere in the network.</p>`,
  });
  g.add(makeGlowLine(tableNode.position.clone(), qNode.position.clone(), 0xb58bff, live === "call" ? 0.35 : 0.12));

  const minCS = Math.min(...callableIds.map(cid => cardScores[cid]));
  const maxCS = Math.max(...callableIds.map(cid => cardScores[cid]));
  for (let i = 0; i < callable.length; i++) {
    const cid = callableIds[i];
    const sc = cardScores[cid];
    const norm = (sc - minCS) / Math.max(1e-6, maxCS - minCS);
    const pos = new THREE.Vector3(PX + 2.8 + i * 1.5, TOP_ROW_Y + 0.5, zC);
    const card = makeCardMesh(callable[i], 0.95, { withVec: false });
    card.position.copy(pos);
    g.add(card);
    if (callStyle.opacity < 1) {
      card.traverse(o => {
        if (o.material) { o.material.transparent = true; o.material.opacity = callStyle.opacity; }
      });
    }
    const halo = new THREE.Mesh(
      new THREE.PlaneGeometry(1.3, 1.9),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(0.33, 0.6, 0.3 + norm * 0.4), transparent: true,
        opacity: (0.2 + norm * 0.5) * callStyle.opacity,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }),
    );
    halo.position.copy(pos).add(new THREE.Vector3(0, 0, -0.1));
    g.add(halo);
    const sl = makeLabel(sc.toFixed(1), callStyle.labelColor, 0.36);
    sl.position.copy(pos).add(new THREE.Vector3(0, 1.3, 0));
    g.add(sl);
    g.add(makeGlowLine(qNode.position.clone(), pos.clone(), 0x80ed99,
      (0.15 + norm * 0.55) * (live === "call" ? 1 : 0.35)));
    registerCardPickable(card, {
      title: `CALL ${callable[i]}`,
      badge: "actor",
      kv: { "score": sc.toFixed(2), "live here": live === "call" ? "yes" : "no (illustrative)" },
      body: `<p>Score = q · tw_We(card_emb[${cid}])ᵀ. Reusing the shared card embedding means the actor inherits everything the embedding has learned elsewhere.</p>`,
    });
    const top = pos.clone().add(new THREE.Vector3(0, 0.8, 0));
    actionSources[`CALL ${callable[i]}`] = { pos: top, color: 0x80ed99 };
    actionSources[`CALL ${callable[i]} UNDER`] = { pos: top.clone(), color: 0x80ed99 };
  }

  // partner_basic_head: the two non-card partner options, in the same lane
  // (and the same softmax) as the CALL scores.
  const pbNames = ["ALONE", "JD PARTNER"];
  for (let i = 0; i < 2; i++) {
    const chip = new THREE.Mesh(
      new RoundedBoxGeometry(1.8, 0.8, 0.2, 2, 0.08),
      new THREE.MeshStandardMaterial({
        ...fadeOpts(0x5fd9a4, 0.25), roughness: 0.45, metalness: 0,
      }),
    );
    chip.position.set(PX + 3.2 + i * 3.4, TOP_ROW_Y - 3, zC);
    g.add(chip);
    const cl = makeLabel(`${pbNames[i]} · ${S.actor.partner_basic_logits[i].toFixed(1)}`, callStyle.labelColor, 0.36);
    cl.position.copy(chip.position).add(new THREE.Vector3(0, -0.95, 0));
    g.add(cl);
    registerPickable(chip, {
      title: `partner_basic_head · ${pbNames[i]}`,
      badge: "actor",
      kv: { "logit": S.actor.partner_basic_logits[i].toFixed(3) },
      body: `<p>Linear(256→2): the two non-card partner options. They share one softmax with the two-tower CALL scores above them — which is why they sit in the same lane.</p>`,
    });
    g.add(makeGlowLine(adapter.position.clone(), chip.position.clone(), 0x5fd9a4, live === "call" ? 0.4 : 0.12));
    actionSources[pbNames[i]] = { pos: chip.position.clone(), color: 0x5fd9a4 };
  }

  return { adapter };
}

// ============================================================
// STAGE 8: POINTER — the cards lane. The 8 post-reasoning hand tokens
// re-materialize as a ghost row (tethered to the final ring), left to
// right. Per slot, an additive node mixes g = Wg·f with Wt·token through
// tanh (read out by pointer_v), and a bilinear ring dots u = U·f with
// V·token; the bar is their sum. PLAY UNDER — the one play action that
// is not a hand slot — closes the row, in the same softmax.
// ============================================================
const BILINEAR_COLOR = 0xe6f59a;
function buildPointer() {
  const g = group("pointer");
  const live = liveHead();
  const st = headStyle(live === "pointer");
  const zc = ACTOR_PLANE_Z;
  const lab = makeStageLabel(`8 · POINTER · additive + bilinear${st.suffix}`, "#b8f0a2");
  lab.position.set(XS.pointer + 8, -9.7, zc + 3);
  g.add(lab);

  const PY = 3.5;              // ghost row height
  const ADD_Y = PY + 2.6;      // additive (tanh) node row
  const BIL_Y = PY + 4.4;      // bilinear (dot) node row
  const BAR_Y = PY + 6.2;      // score bars start here
  const SLOT_DX = 2.4;
  const slotX = (i) => XS.pointer + i * SLOT_DX;
  const ptr = S.actor.pointer;
  const hP = DATA.dims.pointer_hidden;
  const slotScores = ptr.slot_scores;
  const realSlots = handCardIds.map((cid, i) => ({ cid, i })).filter(s => s.cid !== 0);
  const minSlot = Math.min(...realSlots.map(s => slotScores[s.i]));
  const maxSlot = Math.max(...realSlots.map(s => slotScores[s.i]));
  const maxHid = Math.max(...realSlots.map(s => ptr.hidden_norms[s.i]));
  const maxBil = Math.max(1e-6, ...realSlots.map(s => Math.abs(ptr.bilinear_scores[s.i])));
  const on = live === "pointer";

  laneCaption(g, "bury · under · play", new THREE.Vector3(slotX(4), BAR_Y + 7.4, zc), on);
  const fLab = makeLabel(`score = v·tanh(g + Wt·t) + (u · V·t)/√${hP}`, st.labelColor, 0.4);
  fLab.position.set(slotX(4), BAR_Y + 6.2, zc);
  g.add(fLab);

  const matOpts = (color, intensity) => ({
    color, emissive: color,
    emissiveIntensity: intensity * st.emissiveBoost,
    metalness: 0.4, roughness: 0.3,
    transparent: st.opacity < 1, opacity: st.opacity,
  });

  // The two situation queries, broadcast to every slot.
  const gNode = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14),
    new THREE.MeshStandardMaterial(matOpts(0xb8f0a2, 0.6)));
  gNode.position.set(XS.pointer - 4.5, ADD_Y, zc);
  g.add(gNode);
  const gLab = makeLabel(`g = Wg·f  (${DATA.dims.d_model}→${hP})`, st.labelColor, 0.4);
  gLab.position.set(XS.pointer - 4.5, ADD_Y - 1.3, zc);
  g.add(gLab);
  registerPickable(gNode, {
    title: "pointer_Wg · additive query",
    badge: "actor",
    kv: { "‖g‖": ptr.g_norm.toFixed(2) },
    body: `<p>The actor-adapted features projected to ${hP}d — the situation half of the additive (Bahdanau) term, broadcast identically to all 8 hand slots. Added to each card's projection and squashed by tanh, it can move every card's score together, but can only make a card attribute matter <i>differently</i> in this state through tanh saturation.</p>`,
  });
  const uNode = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14),
    new THREE.MeshStandardMaterial(matOpts(BILINEAR_COLOR, 0.6)));
  uNode.position.set(XS.pointer - 4.5, BIL_Y + 1.4, zc);
  g.add(uNode);
  const uLab = makeLabel(`u = U·f  (${DATA.dims.d_model}→${hP})`, st.labelColor, 0.4);
  uLab.position.set(XS.pointer - 4.5, BIL_Y + 2.7, zc);
  g.add(uLab);
  registerPickable(uNode, {
    title: "pointer_U · bilinear query",
    badge: "actor",
    kv: { "‖u‖": ptr.u_norm.toFixed(2) },
    body: `<p>A second ${hP}-d projection of the features, dotted (not added) with each card's V projection. A product can re-weight individual card attributes per situation — "in this state, trump strength matters; in that one, points do" — which the additive term expresses only indirectly. U starts at zero, so the term grows only as far as training finds it useful.</p>`,
  });
  for (const node of [gNode, uNode]) {
    g.add(makeGlowLine(actorInfo.adapter.position.clone(), node.position.clone(),
      node === gNode ? 0xb8f0a2 : BILINEAR_COLOR, on ? 0.5 : 0.15));
  }

  const scoreBar = (x, score, lo, hi, color) => {
    const norm = clamp((score - lo) / Math.max(1e-6, hi - lo), 0, 1);
    const barH = 0.4 + norm * 3.4;
    const bcolor = color ?? new THREE.Color().setHSL(0.32, 0.7, 0.28 + norm * 0.42);
    const bar = new THREE.Mesh(
      new RoundedBoxGeometry(0.85, barH, 0.85, 2, 0.08),
      new THREE.MeshStandardMaterial({
        color: bcolor, emissive: bcolor,
        emissiveIntensity: (0.2 + norm * 0.65) * st.emissiveBoost,
        transparent: st.opacity < 1, opacity: st.opacity,
        roughness: 0.4,
      }),
    );
    bar.position.set(x, BAR_Y + barH / 2, zc);
    g.add(bar);
    const blab = makeLabel(score.toFixed(1), st.labelColor, 0.36);
    blab.position.set(x, BAR_Y + 0.7 + barH, zc);
    g.add(blab);
    return { bar, norm, bcolor, top: new THREE.Vector3(x, BAR_Y + barH, zc) };
  };

  const combines = [];
  for (let i = 0; i < 8; i++) {
    const cid = handCardIds[i];
    const isPad = cid === 0;
    const code = isPad ? "PAD" : (idToCode[cid] || `id${cid}`);
    const gp = new THREE.Vector3(slotX(i), PY, zc);

    // Ghost hand token (tethered to its final-ring position).
    const ghost = new THREE.Mesh(
      new THREE.SphereGeometry(isPad ? 0.3 : 0.55, 18, 14),
      new THREE.MeshStandardMaterial({
        color: isPad ? C.dim : 0x4cc9f0,
        emissive: isPad ? C.dim : 0x4cc9f0,
        emissiveIntensity: isPad ? 0.05 : 0.4 * st.emissiveBoost,
        metalness: 0.3, roughness: 0.4,
        transparent: true, opacity: isPad ? 0.15 : Math.min(0.85, st.opacity),
      }),
    );
    ghost.position.copy(gp);
    g.add(ghost);
    const isTrump = !isPad && trumpCardCodes.includes(code);
    if (isPad) {
      const glab = makeLabel(code, "#5d6790", 0.4);
      glab.position.set(slotX(i), PY - 1.3, zc);
      g.add(glab);
      continue;
    }
    // The slot's actual card, as a mini face under its ghost token.
    const mini = makeCardMesh(code, 1.0, { withVec: false });
    mini.position.set(slotX(i), PY - 1.8, zc);
    g.add(mini);

    // Tether back to the final transformer ring — same token, same state.
    const src = xfInfo.exitPos[2 + i].clone();
    const mid = src.clone().add(gp).multiplyScalar(0.5);
    mid.y -= 4; // duck under the readout grid on the way over
    const tether = registerConn(
      makeFatLine(new THREE.QuadraticBezierCurve3(src, mid, gp).getPoints(24),
        0x4cc9f0, 0.10, 1.0), 0.10);
    g.add(tether);
    registerPickable(ghost, {
      title: `hand token · ${code}${isTrump ? " (trump)" : ""}`,
      badge: "actor",
      kv: { "‖Wt·tok‖": ptr.t_norms[i].toFixed(2), "‖V·tok‖": ptr.v_norms[i].toFixed(2) },
      body: `<p>The same post-reasoning ${DATA.dims.d_token}-d hand token from the final transformer ring (the faint tether), re-materialized here. Wt and V each project it to ${hP}d — the "what is this card" half of the two terms.</p>`,
    });

    const addS = ptr.additive_scores[i], bilS = ptr.bilinear_scores[i];
    const termKv = {
      "additive": addS.toFixed(2), "bilinear": bilS.toFixed(2), "score": slotScores[i].toFixed(2),
    };

    // Additive node: tanh(g + Wt·t), read out by pointer_v.
    const hidNorm = ptr.hidden_norms[i] / Math.max(maxHid, 1e-6);
    const comb = new THREE.Mesh(new THREE.OctahedronGeometry(0.5),
      new THREE.MeshStandardMaterial({ ...matOpts(0xb8f0a2, 0.15 + hidNorm * 0.7), metalness: 0.5, roughness: 0.25 }));
    comb.position.set(slotX(i) - 0.45, ADD_Y, zc);
    comb.userData.pulsePhase = i * 0.8;
    g.add(comb);
    combines.push(comb);
    registerPickable(comb, {
      title: `additive term · slot ${i} (${code})`,
      badge: "actor",
      kv: { "‖tanh(g + Wt·t)‖": ptr.hidden_norms[i].toFixed(2), ...termKv },
      body: `<p>v · tanh(g + Wt·token): the situation query and this card's projection added and squashed; pointer_v reads the blend out as one scalar.</p>`,
    });

    // Bilinear node: (u · V·t) / √h — a ring, sized and lit by |term|.
    const bilNorm = Math.abs(bilS) / maxBil;
    const bil = new THREE.Mesh(new THREE.TorusGeometry(0.34 + bilNorm * 0.22, 0.12, 10, 28),
      new THREE.MeshStandardMaterial(matOpts(BILINEAR_COLOR, 0.12 + bilNorm * 0.75)));
    bil.position.set(slotX(i) + 0.45, BIL_Y, zc);
    g.add(bil);
    registerPickable(bil, {
      title: `bilinear term · slot ${i} (${code})`,
      badge: "actor",
      kv: termKv,
      body: `<p>(U·f) · (V·token) / √${hP}: a dot product between the bilinear situation query and this card. ${bilS >= 0 ? "Positive — this state favors this card's attributes." : "Negative — this state disfavors this card's attributes."}</p>`,
    });

    g.add(makeGlowLine(gNode.position.clone(), comb.position.clone(), 0xb8f0a2, on ? 0.26 : 0.10));
    g.add(makeGlowLine(uNode.position.clone(), bil.position.clone(), BILINEAR_COLOR, on ? 0.26 : 0.10));
    g.add(makeGlowLine(gp.clone(), comb.position.clone(), 0x4cc9f0, on ? 0.4 : 0.14));
    g.add(makeGlowLine(gp.clone(), bil.position.clone(), 0x4cc9f0, on ? 0.3 : 0.10));

    // Score bar: the sum, height/heat by within-hand normalized score.
    const sb = scoreBar(slotX(i), slotScores[i], minSlot, maxSlot);
    registerPickable(sb.bar, {
      title: `pointer score · ${code}`,
      badge: "actor",
      kv: termKv,
      body: `<p>Additive + bilinear. This slot's scalar becomes the BURY ${code} / UNDER ${code} / PLAY ${code} logit (whichever the phase allows) via precomputed card-id maps — one scorer serves all three phases.</p>`,
    });
    const barBase = new THREE.Vector3(slotX(i), BAR_Y, zc);
    const barOp = (0.15 + sb.norm * 0.5) * (on ? 1 : 0.35);
    g.add(makeGlowLine(comb.position.clone(), barBase, sb.bcolor.getHex(), barOp));
    g.add(makeGlowLine(bil.position.clone(), barBase.clone(), BILINEAR_COLOR, barOp));
    for (const verb of ["PLAY", "BURY", "UNDER"]) {
      actionSources[`${verb} ${code}`] = { pos: sb.top.clone(), color: 0xb8f0a2 };
    }
  }

  // PLAY UNDER: play_under_head, a plain Linear(256→1) — not a hand slot,
  // but it competes in the same play softmax, so it closes the row.
  const xU = slotX(8) + 0.6;
  const puChip = new THREE.Mesh(
    new RoundedBoxGeometry(1.2, 0.8, 0.5, 2, 0.08),
    new THREE.MeshStandardMaterial({ ...matOpts(0xb8f0a2, 0.3), metalness: 0, roughness: 0.45 }),
  );
  puChip.position.set(xU, ADD_Y, zc);
  g.add(puChip);
  const puLab = makeLabel("PLAY UNDER", st.labelColor, 0.36);
  puLab.position.set(xU, PY - 0.2, zc);
  g.add(puLab);
  const puLogit = S.actor.play_under_logit;
  const pu = scoreBar(xU, puLogit, minSlot, maxSlot, new THREE.Color(0xb8f0a2));
  registerPickable(puChip, {
    title: "play_under_head",
    badge: "actor",
    kv: { "logit": puLogit.toFixed(3) },
    body: `<p>Linear(256→1): the one play action that isn't a hand slot — playing the face-down UNDER card. Its logit joins the pointer's slot scores in the same play softmax (the bar uses the slots' scale; legal only when this seat holds the under).</p>`,
  });
  g.add(makeGlowLine(actorInfo.adapter.position.clone(), puChip.position.clone(), 0xb8f0a2, on ? 0.3 : 0.1));
  g.add(makeGlowLine(puChip.position.clone(), new THREE.Vector3(xU, BAR_Y, zc), 0xb8f0a2, on ? 0.3 : 0.1));
  actionSources["PLAY UNDER"] = { pos: pu.top.clone(), color: 0xb8f0a2 };

  return { gNode, uNode, combines };
}

// ============================================================
// STAGE 9: OUTPUT · π(a | s). Every legal action's logit — wherever its
// head sits — flows into ONE softmax node (the heads share a single masked
// softmax), and the node feeds a ranked list of horizontal probability
// bars: a summary of the whole actor, deliberately unlike the heads' own
// vertical logit bars.
// ============================================================
function buildOutput() {
  const g = group("output");
  const lab = makeStageLabel("9 · OUTPUT · π(a | s)", "#ff6b6b");
  lab.position.set(XS.output + 4, -9.7, OUT_Z + 4);
  g.add(lab);

  const probs = S.actor.full_probs;
  const entries = S.actor.valid_action_indices
    .map(idx => ({ idx, name: ACTIONS[idx], prob: probs[idx] }))
    .sort((a, b) => b.prob - a.prob);
  const shown = entries.slice(0, 8);
  const hidden = entries.length - shown.length;

  // The softmax: one ring, fed by every legal action's head output.
  const node = new THREE.Mesh(
    new THREE.TorusGeometry(1.0, 0.22, 12, 40),
    new THREE.MeshStandardMaterial({
      color: C.output, emissive: C.output, emissiveIntensity: 0.5,
      metalness: 0.4, roughness: 0.3,
    }),
  );
  node.position.set(XS.softmax, HEAD_Y, OUT_Z);
  g.add(node);
  const nodeLab = makeLabel(`softmax · ${entries.length} legal action${entries.length > 1 ? "s" : ""}`, "#ffc2c2", 0.45);
  nodeLab.position.copy(node.position).add(new THREE.Vector3(0, 1.9, 0));
  g.add(nodeLab);
  registerPickable(node, {
    title: "masked softmax",
    badge: "output",
    kv: { "legal actions": String(entries.length) },
    body: `<p>All heads write into one action vector; illegal actions are masked out and a single softmax runs over what is left. Only one decision lane ever has legal actions at a time — the lines feeding this ring come from exactly those elements.</p>`,
  });
  for (const e of entries) {
    const src = actionSources[e.name];
    if (!src) continue;
    g.add(makeGlowLine(src.pos.clone(), node.position.clone(), src.color, 0.12 + e.prob * 0.6));
  }

  // The ranked list: rows top-down, bars growing along +x.
  const LIST_X = XS.output;
  const ROW_TOP = HEAD_Y + 6.5;
  const ROW_DY = 1.6;
  const barObjs = [];
  for (let i = 0; i < shown.length; i++) {
    const e = shown[i];
    const chosen = e.name === S.sample.chosen_action;
    const y = ROW_TOP - i * ROW_DY;
    const L = 0.3 + e.prob * 9;
    const color = chosen ? 0x80ed99 : 0x8aa0e0;
    const m = new THREE.Mesh(
      new RoundedBoxGeometry(L, 0.95, 0.95, 2, 0.12),
      new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: 0.25 + e.prob * 0.5,
        metalness: 0.3, roughness: 0.4,
      }),
    );
    m.position.set(LIST_X + L / 2, y, OUT_Z);
    g.add(m);
    barObjs.push({ mesh: m, entry: e, L, x0: LIST_X });
    const labOut = makeLabel(
      `${e.name}  ${(e.prob * 100).toFixed(1)}%${chosen ? " ✓" : ""}`,
      chosen ? "#dffbe6" : "#cdd9ff", 0.5);
    labOut.position.set(LIST_X + L + 0.6 + labOut.scale.x / 2, y, OUT_Z);
    g.add(labOut);
    // Card actions wear their card at the head of the row.
    const cm = e.name.match(/^(?:PLAY|BURY|UNDER|CALL)\s+(\S+)/);
    if (cm && (deckIds[cm[1]] !== undefined || cm[1] === "UNDER")) {
      const mini = makeCardMesh(cm[1], 0.62, { withVec: false });
      mini.position.set(LIST_X - 0.9, y, OUT_Z);
      g.add(mini);
      registerCardPickable(mini, {
        title: `π(${e.name})`,
        badge: "output",
        kv: { "prob": e.prob.toFixed(4), "chosen": chosen ? "yes (argmax)" : "no" },
        body: `<p>The card this action ${e.name.startsWith("BURY") ? "buries" : e.name.startsWith("CALL") ? "calls" : "plays"}.</p>`,
      });
    }
    registerPickable(m, {
      title: `π(${e.name})`,
      badge: "output",
      kv: {
        "prob": e.prob.toFixed(4),
        "logit": S.actor.full_logits[e.idx].toFixed(3),
        "chosen": chosen ? "yes (argmax)" : "no",
      },
      body: `<p>Final action probability after masking illegal actions and one softmax across all ${entries.length} legal actions of this decision. The bars in the head lanes are raw logits; these are the probabilities they turn into.</p>`,
    });
    g.add(makeGlowLine(node.position.clone(), new THREE.Vector3(LIST_X - 1.5, y, OUT_Z), C.output, 0.12 + e.prob * 0.5));
  }
  const title = makeLabel("π(a | s)", "#ffc2c2", 0.6);
  title.position.set(LIST_X + 2.5, ROW_TOP + 1.9, OUT_Z);
  g.add(title);
  if (hidden > 0) {
    const moreLab = makeLabel(`+ ${hidden} more legal actions`, "#8e9bd1", 0.42);
    moreLab.position.set(LIST_X + 3, ROW_TOP - shown.length * ROW_DY, OUT_Z);
    g.add(moreLab);
  }

  return { barObjs, entries, node };
}

// ============================================================
// STAGE 10: CRITIC VALUE — shared features → deep trunk → V(s)
// ============================================================
// Low, below the actor's plane, so from the front the two sides separate
// vertically on screen as well as in depth (still above the floor at y=-10).
const CRITIC_Y = -6;
const CRITIC_VZ = -16; // value lane
const CRITIC_AZ = -30; // aux lane

function buildCriticValue() {
  const g = group("criticV");
  const lab = makeStageLabel("10 · CRITIC · features → value", "#ff9ec7");
  lab.position.set(XS.criticTrunk + 4, -9.7, CRITIC_VZ - 6);
  g.add(lab);

  // value_trunk box
  const trunk = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 3.2, 1.6),
    new THREE.MeshStandardMaterial({
      color: 0xff9ec7, emissive: 0xff9ec7, emissiveIntensity: 0.35,
      metalness: 0.35, roughness: 0.4,
    }),
  );
  trunk.position.set(XS.criticTrunk, CRITIC_Y, CRITIC_VZ);
  g.add(trunk);
  sideTitle(g, "CRITIC", new THREE.Vector3(XS.criticTrunk, CRITIC_Y + 5.2, CRITIC_VZ), "#ff9ec7");
  const trunkLab = makeLabel("value_trunk (256→256→256)", "#ffd6e8", 0.5);
  trunkLab.position.set(XS.criticTrunk, CRITIC_Y + 2.6, CRITIC_VZ);
  g.add(trunkLab);
  registerPickable(trunk, {
    title: "value_trunk",
    badge: "critic",
    kv: { "‖trunk out‖": S.critic.value_trunk_norm.toFixed(2) },
    body: `<p>LayerNorm → Linear(256→256) → SiLU → Linear(256→256) → SiLU, fed by the <b>same</b> shared features the actor reads. Deep and dedicated so the value head can fit the spread of returns; the aux heads (next stage) branch off a separate shallow adapter.</p>`,
  });
  g.add(makeGlowLine(readoutInfo.hubPos.clone(), trunk.position.clone(), C.critic, 0.5));

  // V(s): one signed crystal — green above water, red below.
  const v = S.critic.value;
  const vMagNorm = clamp(Math.abs(v) / 1.5, 0, 1);
  const vColor = v >= 0 ? 0x62e88a : 0xff6b6b;
  const crystal = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.1 + vMagNorm * 1.2, 0),
    new THREE.MeshStandardMaterial({
      color: vColor, emissive: vColor,
      emissiveIntensity: 0.4 + vMagNorm * 0.5,
      metalness: 0.55, roughness: 0.2,
      flatShading: true,
    }),
  );
  crystal.position.set(XS.criticV, CRITIC_Y, CRITIC_VZ);
  g.add(crystal);
  const vLab = makeLabel(`V(s) = ${v.toFixed(3)}`, v >= 0 ? "#dffbe6" : "#ffd0d0", 0.65);
  vLab.position.set(XS.criticV, CRITIC_Y + 3.1, CRITIC_VZ);
  g.add(vLab);
  registerPickable(crystal, {
    title: "value_head · V(s)",
    badge: "critic",
    kv: { "V(s)": v.toFixed(4) },
    body: `<p>State value from the critic's ${DATA.dims.d_model}-d trunk — used to compute advantages via GAE. Green = positive expected return for this seat, red = negative; size and glow scale with |V|.</p>`,
  });
  g.add(makeGlowLine(trunk.position.clone(), crystal.position.clone(), vColor, 0.55));

  return { trunk, crystal };
}

// ============================================================
// STAGE 11: CRITIC AUX — the training-only prediction stack that
// shapes the shared features: win / return / secret-partner gauges,
// per-seat points, and the trump tracker.
// ============================================================
function buildCriticAux() {
  const g = group("criticAux");
  const aux = S.critic.aux;
  const lab = makeStageLabel("11 · CRITIC AUX · training-only heads", "#e08cff");
  lab.position.set(XS.aux + 10, -9.7, CRITIC_AZ - 8);
  g.add(lab);

  // Shallow critic adapter feeding every aux head.
  const adapter = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 2.8, 1.5),
    new THREE.MeshStandardMaterial({
      color: 0xe08cff, emissive: 0xe08cff, emissiveIntensity: 0.35,
      metalness: 0.35, roughness: 0.4,
    }),
  );
  adapter.position.set(XS.aux, CRITIC_Y, CRITIC_AZ);
  g.add(adapter);
  const adLab = makeLabel("critic_adapter (LN→256→SiLU)", "#f3d9ff", 0.46);
  adLab.position.set(XS.aux, CRITIC_Y + 2.4, CRITIC_AZ);
  g.add(adLab);
  registerPickable(adapter, {
    title: "critic_adapter",
    badge: "critic",
    body: `<p>Shallow shared adapter for the auxiliary tasks. These heads only exist at training time — their gradients flow back through the shared features and readout, forcing the encoder to represent who is winning, where the points sit, and which trump are gone. At play time only V(s) is used.</p>`,
  });
  g.add(makeGlowLine(readoutInfo.hubPos.clone(), adapter.position.clone(), 0xe08cff, 0.4));

  // --- three scalar gauges: win / expected return / secret partner ---
  const gaugeDefs = [
    { name: "P(win)", val: aux.win_prob, fmt: `${(aux.win_prob * 100).toFixed(0)}%`,
      color: 0x62e88a, strength: aux.win_prob,
      title: "win_head", body: `<p>Sigmoid head: probability this seat's side takes the hand. Glow tracks the probability.</p>` },
    { name: "E[return]", val: aux.expected_return, fmt: aux.expected_return.toFixed(2),
      color: aux.expected_return >= 0 ? 0x62e88a : 0xff6b6b,
      strength: clamp(Math.abs(aux.expected_return) / 1.5, 0.1, 1),
      title: "return_head", body: `<p>Linear head: expected final chip return for this seat.</p>` },
    { name: "P(secret partner)", val: aux.secret_partner_prob, fmt: `${(aux.secret_partner_prob * 100).toFixed(0)}%`,
      color: 0xffc65c, strength: aux.secret_partner_prob,
      title: "secret_partner_head", body: `<p>Sigmoid head: is there a still-unrevealed partner at the table? Tracks the called card's owner staying hidden.</p>` },
  ];
  for (let i = 0; i < gaugeDefs.length; i++) {
    const gd = gaugeDefs[i];
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.55 + gd.strength * 0.5, 20, 16),
      new THREE.MeshStandardMaterial({
        color: gd.color, emissive: gd.color,
        emissiveIntensity: 0.2 + gd.strength * 0.6,
        metalness: 0.4, roughness: 0.3,
      }),
    );
    orb.position.set(XS.aux + 7, CRITIC_Y + 3.2 - i * 3.2, CRITIC_AZ);
    g.add(orb);
    const ol = makeLabel(`${gd.name} = ${gd.fmt}`, "#f3d9ff", 0.44);
    ol.position.set(XS.aux + 7, CRITIC_Y + 4.5 - i * 3.2, CRITIC_AZ);
    g.add(ol);
    registerPickable(orb, { title: gd.title, badge: "critic", kv: { [gd.name]: gd.fmt }, body: gd.body });
    g.add(makeGlowLine(adapter.position.clone(), orb.position.clone(), 0xe08cff, 0.18));
  }

  // --- per-seat points bars (relative seat order: me, +1 … +4) ---
  const seatNames = ["me", "+1", "+2", "+3", "+4"];
  const ptsLab = makeLabel("points_head · predicted points per seat", "#f3d9ff", 0.44);
  ptsLab.position.set(XS.aux + 14, CRITIC_Y + 6.2, CRITIC_AZ + 1);
  g.add(ptsLab);
  for (let i = 0; i < 5; i++) {
    const pts = aux.points[i];
    const norm = clamp(pts / 120, 0, 1);
    const h = 0.3 + norm * 5.2;
    const pcolor = new THREE.Color().setHSL(0.85, 0.55, 0.35 + norm * 0.3);
    const bar = new THREE.Mesh(
      new RoundedBoxGeometry(1.0, h, 1.0, 2, 0.08),
      new THREE.MeshStandardMaterial({
        color: pcolor, emissive: pcolor,
        emissiveIntensity: 0.2 + norm * 0.5,
        roughness: 0.4,
      }),
    );
    bar.position.set(XS.aux + 14, CRITIC_Y - 1.6 + h / 2, CRITIC_AZ + 5 - i * 2.4);
    g.add(bar);
    const bl = makeLabel(`${seatNames[i]} · ${pts.toFixed(0)}`, "#f3d9ff", 0.4);
    bl.position.set(XS.aux + 14, CRITIC_Y - 0.9 + h, CRITIC_AZ + 5 - i * 2.4);
    g.add(bl);
    registerPickable(bar, {
      title: `points_head · seat ${seatNames[i]}`,
      badge: "critic",
      kv: { "predicted points": pts.toFixed(1) },
      body: `<p>Predicted final card points (0–120) for the seat ${i === 0 ? "making this decision" : `${i} to the left`}. Five bars must implicitly sum to ~120 — a full accounting of where the points will land.</p>`,
    });
    g.add(makeGlowLine(adapter.position.clone(), new THREE.Vector3(XS.aux + 14, CRITIC_Y - 1.6, CRITIC_AZ + 5 - i * 2.4), 0xe08cff, 0.12));
  }

  // --- trump tracker: 14 chips (2×7) + unseen-higher lamp ---
  const trumpX = XS.aux + 22;
  const ttLab = makeLabel("trump tracker · P(seen) per trump", "#ffe9c4", 0.46);
  ttLab.position.set(trumpX, CRITIC_Y + 7.0, CRITIC_AZ + 0.5);
  g.add(ttLab);
  const ttNode = new THREE.Mesh(
    new THREE.BoxGeometry(1.1, 1.1, 1.1),
    new THREE.MeshStandardMaterial({
      color: 0xffc65c, emissive: 0xffc65c, emissiveIntensity: 0.35,
      metalness: 0.4, roughness: 0.4,
    }),
  );
  ttNode.position.set(trumpX - 4, CRITIC_Y + 2, CRITIC_AZ);
  g.add(ttNode);
  registerPickable(ttNode, {
    title: "trump_aux (LN→128→SiLU)",
    badge: "critic",
    body: `<p>Dedicated 128-d tower for card counting. Its query is dotted against tw-style keys built from the <b>shared card embedding table</b> (plus a learned per-trump offset) — one logit per trump card.</p>`,
  });
  g.add(makeGlowLine(adapter.position.clone(), ttNode.position.clone(), 0xffc65c, 0.25));
  for (let i = 0; i < trumpCardCodes.length; i++) {
    const code = trumpCardCodes[i];
    const p = aux.seen_trump_probs[i];
    const row = Math.floor(i / 7), col = i % 7;
    const inHand = handCardCodes.includes(code);
    const ccolor = new THREE.Color().setHSL(0.11, 0.75, 0.18 + p * 0.45);
    const chip = new THREE.Mesh(
      new RoundedBoxGeometry(1.05, 1.5, 0.16, 2, 0.07),
      new THREE.MeshStandardMaterial({
        color: ccolor, emissive: ccolor,
        emissiveIntensity: 0.08 + p * 0.75,
        roughness: 0.45,
      }),
    );
    chip.position.set(trumpX + col * 1.4, CRITIC_Y + 4.4 - row * 2.1, CRITIC_AZ + 0.5);
    g.add(chip);
    const cl = makeLabel(code, p > 0.5 ? "#ffe9c4" : "#5d6790", 0.32);
    cl.position.set(trumpX + col * 1.4, CRITIC_Y + 5.3 - row * 2.1, CRITIC_AZ + 0.5);
    g.add(cl);
    registerPickable(chip, {
      title: `seen-trump · ${code}`,
      badge: "critic",
      kv: { "P(seen/known)": `${(p * 100).toFixed(0)}%`, "in this hand": inHand ? "yes" : "no" },
      body: `<p>Predicted probability that ${code} is accounted for from this seat's view (in hand, on the table, or already played). Bright = counted, dark = still out there.</p>`,
    });
  }
  g.add(makeGlowLine(ttNode.position.clone(), new THREE.Vector3(trumpX, CRITIC_Y + 3.4, CRITIC_AZ + 0.5), 0xffc65c, 0.3));

  // Unseen-higher lamp: is there a live trump above my best?
  const uh = aux.unseen_higher_prob;
  const lampColor = uh > 0.5 ? 0xff6b6b : 0x62e88a;
  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(0.5 + uh * 0.4, 18, 14),
    new THREE.MeshStandardMaterial({
      color: lampColor, emissive: lampColor,
      emissiveIntensity: 0.25 + uh * 0.55,
      metalness: 0.4, roughness: 0.3,
    }),
  );
  lamp.position.set(trumpX + 4.2, CRITIC_Y + 0.4, CRITIC_AZ + 0.5);
  g.add(lamp);
  const lampLab = makeLabel(
    `P(unseen higher trump) = ${(uh * 100).toFixed(0)}%`, "#f3d9ff", 0.42);
  lampLab.position.set(trumpX + 4.2, CRITIC_Y - 0.9, CRITIC_AZ + 0.5);
  g.add(lampLab);
  registerPickable(lamp, {
    title: "unseen_trump_higher_than_hand_head",
    badge: "critic",
    kv: { "P": `${(uh * 100).toFixed(1)}%` },
    body: `<p>Probability that a trump higher than this seat's best is still unaccounted for. Red = boss trump may be out against you; green = your best trump is the boss.</p>`,
  });
  g.add(makeGlowLine(ttNode.position.clone(), lamp.position.clone(), 0xffc65c, 0.2));

  return { adapter };
}

// ============================================================
// ORACLE STAGE 1: FULL-INFORMATION OBSERVATION — every hand face
// up, the true blind/bury/under, per-seat points, partner halo.
// ============================================================
function buildOracleObservation() {
  const g = group("input");
  const lab = makeStageLabel("1 · FULL-INFORMATION OBSERVATION", "#c9b8ff");
  lab.position.set(XSA.input, -9.7, 0);
  g.add(lab);

  const so = SO.sample;
  const cardObjs = [];
  const fanAnchors = [];

  const makeFan = ({ codes, z, big, label, labelColor, holder }) => {
    const spacing = big ? (codes.length <= 6 ? 1.9 : 1.6) : 1.35;
    const topY = big ? 8 : 7;
    const w = big ? 3.2 : 2.3;
    const fl = makeLabel(label, labelColor, 0.5);
    fl.position.set(XSA.input, topY + 2.4, z);
    g.add(fl);
    for (let i = 0; i < codes.length; i++) {
      const code = codes[i];
      const isTrump = trumpCardCodes.includes(code);
      const card = makeCardMesh(code, w);
      // Cascade the column so each card's top-left rank corner stays
      // visible above the next card.
      card.position.set(XSA.input, topY - i * spacing, z + i * 0.24);
      card.rotation.y = 0.45;
      card.userData.baseY = card.position.y;
      g.add(card);
      cardObjs.push(card);
      registerCardPickable(card, {
        title: `${code}${holder ? " · " + holder : ""}${isTrump ? " · trump" : ""}`,
        badge: "input",
        kv: { "points": String(cardPoints(code)) },
        body: `<p>${isTrump ? "<b>Trump.</b> " : ""}${holder
          ? `In ${holder}'s hand — hidden from the acting player, visible only to the oracle.`
          : "The acting seat's own card (also in the policy observation)."}</p>` + embRowHtml(code),
      });
    }
    fanAnchors.push(new THREE.Vector3(
      XSA.input + 2, topY - (codes.length - 1) * spacing * 0.5, z));
  };

  // Own hand center; the four hidden hands flank it.
  makeFan({
    codes: handCardCodes, z: 0, big: true,
    label: `seat ${S.sample.seat} · me`, labelColor: "#cdd9ff",
  });
  const oppZ = [-16, -8, 8, 16];
  for (let s = 0; s < 4; s++) {
    const isPartner = so.secret_partner_rel >= 2 && s === so.secret_partner_rel - 2;
    const isPicker = so.picker_rel >= 2 && s === so.picker_rel - 2;
    makeFan({
      codes: so.opp_hand_codes[s], z: oppZ[s], big: false,
      label: `+${s + 1}${isPartner ? " ★ partner" : ""}${isPicker ? " · picker" : ""}`,
      labelColor: isPartner ? "#ffe1a3" : "#d9ccff",
      holder: `seat +${s + 1}`,
    });
    if (isPartner) {
      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(3.4, 0.09, 10, 48),
        new THREE.MeshBasicMaterial({
          color: PARTNER_GOLD, transparent: true, opacity: 0.55,
          blending: THREE.AdditiveBlending, depthWrite: false,
        }),
      );
      halo.position.set(XSA.input - 0.8, 4.2, oppZ[s] + 0.6);
      halo.rotation.y = Math.PI / 2 - 0.45;
      g.add(halo);
      registerPickable(halo, {
        title: "secret partner",
        badge: "input",
        body: `<p>This seat holds the called card — the still-hidden partner. The oracle is told outright (<code>secret_partner_rel</code>); the acting player has to infer it from play.</p>`,
      });
    }
  }

  // True blind / bury / under — the cards nobody at the table can see.
  const priv = [
    ...so.blind_cards.map(c => ({ code: c, tag: "blind (true)" })),
    ...so.bury_cards.map(c => ({ code: c, tag: "bury (true)" })),
    ...(so.under_card ? [{ code: so.under_card, tag: "under" }] : []),
  ];
  if (priv.length) {
    const pl = makeLabel("true blind · bury · under", "#e6dcff", 0.45);
    pl.position.set(XSA.input, -2.2, -9);
    g.add(pl);
    for (let i = 0; i < priv.length; i++) {
      const { code, tag } = priv[i];
      const isTrump = trumpCardCodes.includes(code);
      const chip = makeCardMesh(code, 1.9);
      chip.position.set(XSA.input, -4.4, -12.5 + i * 2.3);
      chip.rotation.y = 0.45;
      g.add(chip);
      const cl = makeLabel(tag, "#b9a8e8", 0.34);
      cl.position.set(XSA.input + 0.3, -6.3, -12.4 + i * 2.3);
      g.add(cl);
      registerCardPickable(chip, {
        title: `${code} · ${tag}${isTrump ? " · trump" : ""}`,
        badge: "input",
        kv: { "points": String(cardPoints(code)) },
        body: `<p>${tag === "under" ? "The face-down under card." : `In the ${tag.split(" ")[0]} — face down on the table.`} Only the oracle's observation carries it — the policy never observes the blind or bury (the picker sees the blind once, in its hand, and must remember it).</p>` + embRowHtml(code),
      });
    }
  }

  // Per-seat points taken so far.
  const seatNames = ["me", "+1", "+2", "+3", "+4"];
  const ptsLab = makeLabel("points taken", "#e6dcff", 0.45);
  ptsLab.position.set(XSA.input, -2.2, 9);
  g.add(ptsLab);
  for (let i = 0; i < 5; i++) {
    const pts = so.points_taken_rel[i];
    const norm = clamp(pts / 120, 0, 1);
    const chip = new THREE.Mesh(
      new RoundedBoxGeometry(1.7, 1.1, 0.22, 2, 0.1),
      new THREE.MeshStandardMaterial({
        color: 0xc17bea, emissive: 0xc17bea,
        emissiveIntensity: 0.1 + norm * 0.6, roughness: 0.4,
      }),
    );
    chip.position.set(XSA.input, -4.2, 6 + i * 2.1);
    chip.rotation.y = 0.45;
    g.add(chip);
    const cl = makeLabel(`${seatNames[i]} ${pts}`, "#e6dcff", 0.38);
    cl.position.set(XSA.input + 1.4, -4.2, 6.2 + i * 2.1);
    g.add(cl);
    registerPickable(chip, {
      title: `points_taken · ${seatNames[i]}`,
      badge: "input",
      kv: { "points": pts },
      body: `<p>Card points this seat has taken so far — fed to the oracle's context token (the acting player only ever sees the tricks it watched).</p>`,
    });
  }

  // Header + memory chips (same anchor convention as the policy input, so
  // the token-bank lines and the GRU feedback arc land unchanged).
  const chipY = -5.4;
  const headerChip = new THREE.Mesh(
    new RoundedBoxGeometry(3.6, 1.4, 0.3, 3, 0.14),
    new THREE.MeshStandardMaterial({
      color: 0x9d7bff, emissive: 0x9d7bff, emissiveIntensity: 0.2, roughness: 0.4,
    }),
  );
  headerChip.position.set(XSA.input, chipY, 0);
  headerChip.rotation.y = 0.45;
  g.add(headerChip);
  const headerLab = makeLabel("header (10) + priv scalars", "#e6ddff", 0.55);
  headerLab.position.set(XSA.input + 3.2, chipY, 0.5);
  g.add(headerLab);
  registerPickable(headerChip, {
    title: "Context inputs",
    badge: "input",
    kv: {
      ...(headerKv() || {}),
      "points_taken": so.points_taken_rel.join(" / "),
      "secret_partner": relSeatStr(so.secret_partner_rel),
    },
    body: `<p>The policy's 10 header scalars PLUS the privileged extras: per-seat points (5), the secret partner's seat, and the under-card embedding — all fused into the oracle's context token.</p>`,
  });

  const mem = curMemory();
  const memMag = vecMag(mem.memory_in);
  const memChip = new THREE.Mesh(
    new RoundedBoxGeometry(3.6, 1.4, 0.3, 3, 0.14),
    new THREE.MeshStandardMaterial({
      color: 0xf4a261, emissive: 0xf4a261,
      emissiveIntensity: 0.15 + clamp(memMag / 10, 0, 1) * 0.5, roughness: 0.4,
    }),
  );
  memChip.position.set(XSA.input, chipY - 2.2, 0);
  memChip.rotation.y = 0.45;
  g.add(memChip);
  const memLab = makeLabel(`oracle memory hₜ₋₁ (256) · ‖${memMag.toFixed(1)}‖`, "#ffd99c", 0.55);
  memLab.position.set(XSA.input + 3.2, chipY - 2.2, 0.5);
  g.add(memLab);
  registerPickable(memChip, {
    title: "Oracle memory hₜ₋₁",
    badge: "input",
    kv: { "‖memory_in‖": memMag.toFixed(2) },
    body: `<p>The oracle's OWN 256-d recurrent state — threaded over the same per-seat event stream the agent's memory sees (decisions + end-of-trick observations), but through the oracle's separate GRU. It estimates U(h, s), not V(s): history in, state in.</p>`,
  });

  return {
    cardObjs, fanAnchors,
    headerAnchor: new THREE.Vector3(XSA.input + 2, chipY, 0),
    memAnchor: new THREE.Vector3(XSA.input + 2, chipY - 2.2, 0),
  };
}

// ============================================================
// ORACLE STAGE 7: VALUE — trunk + U(h,s) crystal on the spine.
// ============================================================
function buildOracleValue() {
  const g = group("oValue");
  const lab = makeStageLabel("7 · VALUE · U(h,s)", "#ff9ec7");
  lab.position.set(XSA.trunk, -9.7, 10);
  g.add(lab);
  const y = RING_CY;

  const trunk = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 3.2, 1.6),
    new THREE.MeshStandardMaterial({
      color: 0xd88fdd, emissive: 0xd88fdd, emissiveIntensity: 0.35,
      metalness: 0.35, roughness: 0.4,
    }),
  );
  trunk.position.set(XSA.trunk, y, 0);
  g.add(trunk);
  const trunkLab = makeLabel("value_trunk (LN→256→256)", "#ffd6e8", 0.5);
  trunkLab.position.set(XSA.trunk, y + 2.6, 0);
  g.add(trunkLab);
  registerPickable(trunk, {
    title: "oracle value_trunk",
    badge: "critic",
    kv: { "‖trunk out‖": SO.value.value_trunk_norm.toFixed(2) },
    body: `<p>LayerNorm → Linear(256→256) → SiLU → Linear(256→256) → SiLU — the same trunk shape as the limited critic's, fed by the oracle readout. No actor hangs off it${ORACLE_AUX ? "; its output feeds the value head and the two deterministic team aux heads, nothing more" : " and nothing else reads it"}. This whole network exists to be the GAE baseline at training time.</p>`,
  });
  g.add(makeGlowLine(readoutInfo.hubPos.clone(), trunk.position.clone(), 0xd88fdd, 0.5));

  const v = SO.value.value;
  const vMagNorm = clamp(Math.abs(v) / 1.5, 0, 1);
  const vColor = v >= 0 ? 0x62e88a : 0xff6b6b;
  const crystal = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.1 + vMagNorm * 1.2, 0),
    new THREE.MeshStandardMaterial({
      color: vColor, emissive: vColor,
      emissiveIntensity: 0.4 + vMagNorm * 0.5,
      metalness: 0.55, roughness: 0.2,
      flatShading: true,
    }),
  );
  crystal.position.set(XSA.value, y, 0);
  g.add(crystal);
  const untrainedNote = DATA.oracle.untrained ? " · untrained" : "";
  const vLab = makeLabel(`U(h,s) = ${v.toFixed(3)}${untrainedNote}`,
    v >= 0 ? "#dffbe6" : "#ffd0d0", 0.65);
  vLab.position.set(XSA.value, y + 3.1, 0);
  g.add(vLab);
  registerPickable(crystal, {
    title: "value_head · U(h,s)",
    badge: "critic",
    kv: { "U(h,s)": v.toFixed(4), "trained": DATA.oracle.untrained ? "NO — random init" : "yes" },
    body: `<p>The history-state value: what this seat should expect given <i>everything</i> — every hand, the true blind/bury, the secret partner — plus the history so far.${DATA.oracle.untrained
      ? " <b>This checkpoint is a random init</b>: the number is meaningless; the wiring and shapes are what this walkthrough verifies."
      : ""} At training time it replaces the limited critic's V(s) in GAE, removing hidden-card variance from advantages.</p>`,
  });
  g.add(makeGlowLine(trunk.position.clone(), crystal.position.clone(), vColor, 0.55));

  return { trunk, crystal };
}

// ============================================================
// ORACLE STAGE 8: AUX HEADS — the two deterministic team readouts
// hanging off the same trunk output the value head reads. Unlike the
// policy's aux stack, these sculpt only the oracle's own
// representation: no gradient here can reach the actor.
// ============================================================
// The aux lane sits in FRONT of the value spine (+z). The policy critic
// lanes went to −z, which leaves their ground stage labels mirrored under
// their own cameras; on this side the labels read the right way round.
const OAUX_Z = 26;
const OAUX_MEM_Y = 7;  // membership orb row
const OAUX_PTS_Y = -8; // team-points bar base (bars grow up toward the orbs)
const AUX_VIOLET = 0xe0b8ff;
const SEAT_NAMES = ["me", "+1", "+2", "+3", "+4"];

function buildOracleAux() {
  const g = group("oAux");
  const aux = SO.aux;
  const so = SO.sample;
  // Leaster and pre-pick rows have no picker/defender partition, so the
  // training loss drops them — the heads still fire, untrained on this row.
  const live = aux.team_defined;
  const lab = makeStageLabel("8 · ORACLE AUX · team heads", "#e0b8ff");
  lab.position.set(XSA.trunk + 2, -9.7, OAUX_Z - 1);
  g.add(lab);

  const headMat = () => new THREE.MeshStandardMaterial({
    color: AUX_VIOLET, emissive: AUX_VIOLET,
    emissiveIntensity: live ? 0.35 : 0.12,
    metalness: 0.35, roughness: 0.4,
  });
  const trunkPos = oracleValueInfo.trunk.position.clone();

  // --- team_membership (256 → 5, multi-label BCE) -------------------
  const memHead = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 1.5), headMat());
  memHead.position.set(XSA.trunk - 2, OAUX_MEM_Y, OAUX_Z);
  g.add(memHead);
  const memLab = makeLabel("team_membership (256→5)", "#f0dcff", 0.46);
  memLab.position.set(XSA.trunk - 2, OAUX_MEM_Y - 2.6, OAUX_Z);
  g.add(memLab);
  registerPickable(memHead, {
    title: "team_membership",
    badge: "critic",
    kv: { "shape": "Linear(256 → 5)", "loss": "BCE-with-logits × 0.1" },
    body: `<p>One logit per <b>relative seat</b>: is that seat on the picker's team? Multi-label, so the picker and the partner light independently.</p>
      <p>The label is exact rather than bootstrapped — <code>team_aux_labels</code> reads it straight off the privileged observation, which is only possible because this network already sees every hand.</p>`,
  });
  g.add(makeGlowLine(trunkPos.clone(), memHead.position.clone(), AUX_VIOLET, live ? 0.4 : 0.15));

  for (let i = 0; i < 5; i++) {
    const p = aux.membership_prob[i];
    const isTrue = aux.membership_true[i] === 1;
    const x = XSA.trunk + 4 + i * 3.4;
    const hue = live ? 0.12 : 0.65;
    const ocolor = new THREE.Color().setHSL(hue, live ? 0.2 + p * 0.6 : 0.12, 0.22 + p * 0.38);
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.6 + p * 0.55, 20, 16),
      new THREE.MeshStandardMaterial({
        color: ocolor, emissive: ocolor,
        emissiveIntensity: (live ? 0.18 : 0.08) + p * (live ? 0.7 : 0.2),
        metalness: 0.4, roughness: 0.3,
      }),
    );
    orb.position.set(x, OAUX_MEM_Y, OAUX_Z);
    g.add(orb);

    // Ring = the label (gold when this seat really is on the picker team),
    // fill = the prediction. Agreement reads as a filled gold ring.
    const ringColor = live && isTrue ? PARTNER_GOLD : 0x3d4470;
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.5, 0.075, 8, 36),
      new THREE.MeshStandardMaterial({
        color: ringColor, emissive: ringColor,
        emissiveIntensity: live && isTrue ? 0.7 : 0.15,
        roughness: 0.4,
      }),
    );
    ring.position.set(x, OAUX_MEM_Y, OAUX_Z);
    g.add(ring);

    const role = i + 1 === so.picker_rel
      ? "picker"
      : i + 1 === so.secret_partner_rel ? "secret partner" : "";
    const ol = makeLabel(`${SEAT_NAMES[i]} · ${(p * 100).toFixed(0)}%`,
      p > 0.5 ? "#ffe9c4" : "#8e9bd1", 0.5);
    ol.position.set(x, OAUX_MEM_Y + 2.6, OAUX_Z);
    g.add(ol);
    if (role) {
      const rl = makeLabel(role, "#ffd166", 0.46);
      rl.position.set(x, OAUX_MEM_Y - 2.5, OAUX_Z);
      g.add(rl);
    }
    registerPickable(orb, {
      title: `team_membership · seat ${SEAT_NAMES[i]}`,
      badge: "critic",
      kv: {
        "P(picker team)": `${(p * 100).toFixed(1)}%`,
        "label": live ? (isTrue ? "1 — on the picker team" : "0 — defender") : "masked",
        "role": role || "—",
      },
      body: `<p>${i === 0 ? "The acting seat itself" : `The seat ${i} to the left`}${role ? ` — the <b>${role}</b> this hand` : ""}.</p>
        ${live
          ? `<p>Ring = the exact label, fill = the head's belief. ${
              (p > 0.5) === isTrue
                ? "They agree here."
                : "<b>They disagree here</b> — worth noting on a head this well-fit."}</p>`
          : `<p>No team partition exists on this row, so it is masked out of the aux loss entirely. The head still produces a number; nothing trains it here.</p>`}`,
    });
    g.add(makeGlowLine(memHead.position.clone(), orb.position.clone(), AUX_VIOLET, live ? 0.16 : 0.07));
  }

  // --- team_points (256 → 2, smooth-L1 on /120 units) ---------------
  const ptsHead = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 1.5), headMat());
  ptsHead.position.set(XSA.trunk - 2, OAUX_PTS_Y + 3, OAUX_Z);
  g.add(ptsHead);
  const ptsHeadLab = makeLabel("team_points (256→2)", "#f0dcff", 0.46);
  ptsHeadLab.position.set(XSA.trunk - 2, OAUX_PTS_Y + 5.4, OAUX_Z);
  g.add(ptsHeadLab);
  registerPickable(ptsHead, {
    title: "team_points",
    badge: "critic",
    kv: { "shape": "Linear(256 → 2)", "loss": "smooth-L1 × 0.2", "units": "points / 120" },
    body: `<p>Points taken <i>so far</i> by each side: picker team (the bury included, as it stands at this timestamp) and defenders. Regressed in /120 units so the scale matches the value head's.</p>
      <p>Card points are the currency the terminal reward is made of — forcing the trunk to keep a running count is the cheapest way to make U(h,s) sensitive to it.</p>`,
  });
  g.add(makeGlowLine(trunkPos.clone(), ptsHead.position.clone(), AUX_VIOLET, live ? 0.4 : 0.15));

  const teamDefs = [
    { name: "picker team", color: PARTNER_GOLD, x: XSA.trunk + 7 },
    { name: "defenders", color: 0x6f8dff, x: XSA.trunk + 14 },
  ];
  const BAR_MAX = 7.0; // full 120 points
  for (let j = 0; j < 2; j++) {
    const td = teamDefs[j];
    const pred = aux.team_points_pred[j] * 120;
    const truth = aux.team_points_true[j] * 120;
    const h = 0.3 + clamp(pred / 120, 0, 1) * BAR_MAX;
    const bcolor = new THREE.Color(live ? td.color : 0x4a4f78);
    const bar = new THREE.Mesh(
      new RoundedBoxGeometry(2.2, h, 2.2, 2, 0.1),
      new THREE.MeshStandardMaterial({
        color: bcolor, emissive: bcolor,
        emissiveIntensity: live ? 0.22 + clamp(pred / 120, 0, 1) * 0.5 : 0.1,
        roughness: 0.4,
      }),
    );
    bar.position.set(td.x, OAUX_PTS_Y + h / 2, OAUX_Z);
    g.add(bar);

    // Tick beside the column at the exact label height — offset in z so it
    // marks the target without hiding a short bar. The gap is the residual.
    if (live) {
      const th = 0.3 + clamp(truth / 120, 0, 1) * BAR_MAX;
      const plate = new THREE.Mesh(
        new THREE.BoxGeometry(3.4, 0.16, 0.6),
        new THREE.MeshStandardMaterial({
          color: 0xf0dcff, emissive: 0xf0dcff, emissiveIntensity: 0.35,
          roughness: 0.35,
        }),
      );
      plate.position.set(td.x, OAUX_PTS_Y + th, OAUX_Z + 1.9);
      g.add(plate);
      const tl = makeLabel(`label ${truth.toFixed(0)}`, "#e6ecff", 0.46);
      tl.position.set(td.x, OAUX_PTS_Y + th + 1.0, OAUX_Z + 1.9);
      g.add(tl);
      registerPickable(plate, {
        title: `team_points label · ${td.name}`,
        badge: "critic",
        kv: { "label": `${truth.toFixed(1)} pts`, "predicted": `${pred.toFixed(1)} pts` },
        body: `<p>The exact points-so-far for the ${td.name} at this timestamp. The bar below is the head's estimate; the gap is the residual the smooth-L1 term is paying for.</p>`,
      });
    }

    const bl = makeLabel(`${td.name} · ${pred.toFixed(0)} pts`,
      live ? "#f0dcff" : "#7c85ad", 0.46);
    bl.position.set(td.x, OAUX_PTS_Y - 1.7, OAUX_Z);
    g.add(bl);
    registerPickable(bar, {
      title: `team_points · ${td.name}`,
      badge: "critic",
      kv: {
        "predicted": `${pred.toFixed(1)} pts (${aux.team_points_pred[j].toFixed(3)})`,
        "label": live ? `${truth.toFixed(1)} pts` : "masked",
      },
      body: live
        ? `<p>Predicted points already taken by the ${td.name}${j === 0 ? " — the bury counts toward this side from the moment it is buried" : ""}. The white plate marks the exact label.</p>`
        : `<p>No team partition on this row, so this output is untrained here and the loss skips it. Predictions outside [0, 120] are the giveaway.</p>`,
    });
    g.add(makeGlowLine(
      ptsHead.position.clone(),
      new THREE.Vector3(td.x, OAUX_PTS_Y, OAUX_Z),
      AUX_VIOLET, live ? 0.18 : 0.07));
  }

  if (!live) {
    const note = makeLabel("row masked · no picker/defender partition yet", "#8e9bd1", 0.5);
    note.position.set(XSA.trunk + 8, OAUX_MEM_Y + 6.5, OAUX_Z);
    g.add(note);
  }

  return { memHead, ptsHead, live };
}

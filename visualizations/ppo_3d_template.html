// Scene build / rebuild
// ============================================================
function buildScene() {
  sceneRoot = new THREE.Group();
  sceneRoot.name = "sceneRoot";
  scene.add(sceneRoot);
  if (NETWORK_MODE === 0) {
    inputInfo = buildInputCards();
    embedInfo = buildEmbeddingTable();
    tokensInfo = buildTokens();
    xfInfo = buildTransformerTunnel();
    memInfo = buildMemory();
    readoutInfo = buildSharedReadout();
    actorInfo = buildActor();
    pointerInfo = buildPointer();
    outputInfo = buildOutput();
    criticVInfo = buildCriticValue();
    criticAuxInfo = buildCriticAux();
    oracleValueInfo = oracleAuxInfo = null;
  } else {
    inputInfo = buildOracleObservation();
    embedInfo = buildEmbeddingTable();
    tokensInfo = buildTokens();
    xfInfo = buildTransformerTunnel();
    memInfo = buildMemory();
    readoutInfo = buildSharedReadout();
    oracleValueInfo = buildOracleValue();
    // Historical no-head oracle checkpoints (and the random init) simply
    // have no aux lane — the stage list drops with it.
    oracleAuxInfo = ORACLE_AUX ? buildOracleAux() : null;
    actorInfo = pointerInfo = outputInfo = criticVInfo = criticAuxInfo = null;
    outputAnim = null;
  }
  // Reflections read best as an accent, not a mirror finish.
  sceneRoot.traverse((o) => {
    if (o.material && o.material.isMeshStandardMaterial) {
      o.material.envMapIntensity = 0.45;
    }
  });
  applyThemeToScene(sceneRoot);
  buildFlowSystem();
  styleChords();
  styleConn();
  applyStageDim();
}

// Light theme: pull every glowing scene material down to matte ink. Cards,
// the instanced embedding table (its per-cell colors carry the data), PAD
// ghosts (already the theme's dim color) and anything a builder themed
// itself are left alone.
function applyThemeToScene(root) {
  if (TH.dark) return;
  root.traverse((o) => {
    // Solid meshes cast onto the floor; lines, chords and sprites don't.
    if (o.isMesh && o.material && o.material.isMeshStandardMaterial) o.userData.casts = true;
    if (!o.material || o.isSprite || o.isInstancedMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (m.map || m.userData.keepColor || m.userData.themed) continue;
      m.userData.themed = true;
      if (m.isLineMaterial) m.color.copy(lineInk(m.color.getHex()));
      else if (m.color && m.color.getHex() !== TH.dim) m.color.copy(paperColor(m.color.getHex()));
      if (m.emissive) {
        m.emissive.copy(m.color);
        m.emissiveIntensity *= 0.2;
      }
      if (m.isMeshStandardMaterial) {
        m.metalness = Math.min(m.metalness, 0.1);
        m.roughness = clamp(m.roughness + 0.1, 0.4, 0.6);
        // Keep reflections faint: the room environment's light panels
        // show up as white stripes on flat faces.
        m.envMapIntensity = 0.35;
      }
      if (m.blending === THREE.AdditiveBlending) m.blending = THREE.NormalBlending;
    }
  });
}

// ============================================================
// Data-flow particles: every connection edge registered a curve;
// one Points cloud rides them all. Particle count and brightness
// scale with the edge's intensity, stage dimming carries over, and
// advancing the tour fires a burst along the newly active stage.
// ============================================================
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let flowEnabled = !reducedMotion;
let flowState = null;
let flowBurst = null;
const groupDimMap = {};

function makeFlowTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const ctx = c.getContext("2d");
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.35, "rgba(255,255,255,0.6)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function buildFlowSystem() {
  const edges = [];
  for (const [name, grp] of Object.entries(stageGroups)) {
    grp.traverse((o) => {
      if (!o.userData.flowCurve) return;
      edges.push({
        curve: o.userData.flowCurve,
        group: name,
        colorObj: paperColor(o.userData.flowColor),
        intensity: o.userData.flowIntensity,
        boost: o.userData.flowBoost || 1,
        length: o.userData.flowCurve.getLength(),
      });
    });
  }
  const particles = [];
  for (const e of edges) {
    const n = Math.min(8, Math.max(1, Math.round(e.intensity * 8))) * e.boost;
    for (let k = 0; k < n; k++) {
      particles.push({
        edge: e,
        t: Math.random(),
        speed: (6 + Math.random() * 4) / Math.max(e.length, 4), // ~6-10 units/s
      });
    }
  }
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(particles.length * 3);
  // Dark: RGB brightness under additive blending. Light: RGBA — ink color
  // with the brightness in alpha, so dim particles fade instead of greying.
  const cw = TH.dark ? 3 : 4;
  const colors = new Float32Array(particles.length * cw);
  geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geom.setAttribute("color", new THREE.BufferAttribute(colors, cw));
  const mat = new THREE.PointsMaterial({
    size: TH.dark ? 0.7 : 0.8, map: makeFlowTexture(), vertexColors: true,
    transparent: true, depthWrite: false,
    blending: flowBlending(), sizeAttenuation: true,
  });
  mat.userData.themed = true;
  const points = new THREE.Points(geom, mat);
  points.frustumCulled = false;
  sceneRoot.add(points);
  flowState = { particles, points, geom };
}

const _flowVec = new THREE.Vector3();
function updateFlow(nowMs, dt) {
  if (!flowState) return;
  flowState.points.visible = flowEnabled;
  if (!flowEnabled) return;
  const pos = flowState.geom.attributes.position.array;
  const col = flowState.geom.attributes.color.array;
  const burstAge = flowBurst ? (nowMs - flowBurst.t0) / 1000 : Infinity;
  const burstK = burstAge < 1.6 ? Math.exp(-burstAge * 2.2) : 0;
  for (let i = 0; i < flowState.particles.length; i++) {
    const p = flowState.particles[i];
    const e = p.edge;
    const inBurst = burstK > 0 && flowBurst.groups.has(e.group);
    const speedMul = inBurst ? 1 + 1.8 * burstK : 1;
    p.t = (p.t + dt * p.speed * speedMul) % 1;
    e.curve.getPoint(p.t, _flowVec);
    pos[i * 3] = _flowVec.x;
    pos[i * 3 + 1] = _flowVec.y;
    pos[i * 3 + 2] = _flowVec.z;
    const dim = groupDimMap[e.group] ?? 1;
    const wave = 0.7 + 0.3 * Math.sin((p.t * 5 + pulseT * 0.4) * Math.PI * 2);
    const b = clamp(e.intensity * 1.7, 0.3, 0.95) * dim * wave
      * (inBurst ? 1 + 2.2 * burstK : 1) * (e.boost > 1 ? 1.25 : 1);
    if (TH.dark) {
      col[i * 3] = e.colorObj.r * b;
      col[i * 3 + 1] = e.colorObj.g * b;
      col[i * 3 + 2] = e.colorObj.b * b;
    } else {
      col[i * 4] = e.colorObj.r * 0.8;
      col[i * 4 + 1] = e.colorObj.g * 0.8;
      col[i * 4 + 2] = e.colorObj.b * 0.8;
      col[i * 4 + 3] = Math.min(1, b * 1.25);
    }
  }
  flowState.geom.attributes.position.needsUpdate = true;
  flowState.geom.attributes.color.needsUpdate = true;
}

  oObs: ["input"],

  oReadout: [`xf${N_LAYERS - 1}`, "readout"],
  oValue: ["readout", "oValue"],
  oAux: ["oValue", "oAux"],
};
const chordDimMap = {}; // per-group chord dim factors, read by animate()
// How far out-of-focus stages recede. On black, faint strokes still glow;
// on white they vanish, so the light theme dims less and desaturates
// instead — inactive reads as "grey", not "gone".
const STAGE_DIM = {
  dark: { chord: 0.12, flow: 0.15, obj: 0.3, emissive: 0.25, sprite: 0.22, desat: 0 },
  light: { chord: 0.32, flow: 0.3, obj: 0.5, emissive: 0.25, sprite: 0.45, desat: 0.55 },
};
const _grey = new THREE.Color();
// Which side of the network a stage (or scene group) belongs to. Focusing
// either side pushes the OTHER side much further back than an ordinary
// inactive stage: from any front-facing actor view the critic lines up
// right behind the cards lane, and vice versa.
const NET_SIDE = {
  actor: "actor", pointer: "actor", output: "actor",
  criticV: "critic", criticAux: "critic",
};
// × the inactive levels. Dark needs more: on near-black even 9% glows.
const FAR_SIDE_DIM = { dark: 0.16, light: 0.35 };
function applyStageDim() {
  const D0 = STAGE_DIM[TH.dark ? "dark" : "light"];
  const far = FAR_SIDE_DIM[TH.dark ? "dark" : "light"];
  const focusSide = STAGES[curStage] ? NET_SIDE[STAGES[curStage].label] : undefined;
  const s = STAGES[curStage];
  const active = s ? STAGE_GROUPS[s.label] ?? null : null;
  for (const [name, grp] of Object.entries(stageGroups)) {
    const on = !active || active.includes(name);
    const isFar = !on && focusSide && NET_SIDE[name] && NET_SIDE[name] !== focusSide;
    const D = isFar
      ? {
        ...D0, chord: D0.chord * far, flow: D0.flow * far, obj: D0.obj * far,
        emissive: D0.emissive * far, sprite: D0.sprite * far,
      }
      : D0;
    // Additive chords stay hot even at 0.3 — push inactive bundles way down
    // so the focused stage's attention actually owns the frame.
    chordDimMap[name] = on ? 1 : D.chord;
    groupDimMap[name] = on ? 1 : D.flow; // flow particles follow stage focus
    const om = on ? 1 : D.obj;
    const em = on ? 1 : D.emissive;
    grp.traverse((o) => {
      if (o.isSprite) { o.userData.dimFactor = on ? 1 : D.sprite; return; }
      // Only the stage in focus casts shadows (light theme).
      if (o.userData.casts) o.castShadow = on;
      const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      for (const m of mats) {
        if (m.userData.baseOpacity === undefined) {
          m.userData.baseOpacity = m.opacity;
          m.userData.baseTransparent = m.transparent;
          if (typeof m.emissiveIntensity === "number") {
            m.userData.baseEmissive = m.emissiveIntensity;
          }
        }
        if (m.userData.baseDepthWrite === undefined) m.userData.baseDepthWrite = m.depthWrite;
        m.transparent = m.userData.baseTransparent || !on;
        m.opacity = m.userData.baseOpacity * om;
        // A receded object must not occlude: faint as it is, writing depth
        // would still cut dark holes in whatever glows behind it.
        m.depthWrite = on ? m.userData.baseDepthWrite : false;
        // Desaturate toward the color's own grey (textured card faces and
        // chords, whose color styleChords owns, keep theirs).
        if (D.desat && m.color && !m.map && !o.userData.chord) {
          if (!m.userData.baseColor) m.userData.baseColor = m.color.clone();
          const b = m.userData.baseColor;
          const lum = 0.3 * b.r + 0.59 * b.g + 0.11 * b.b;
          m.color.copy(b);
          if (!on) m.color.lerp(_grey.setRGB(lum, lum, lum), D.desat);
        }
        if (m.userData.baseEmissive !== undefined) {
          m.emissiveIntensity = m.userData.baseEmissive * em;
        }
      }
    });
  }
  renderer.shadowMap.needsUpdate = true;
}

let STAGES = buildPolicyStages();

// ============================================================
// Chapters: the reader's path. Each chapter groups one or more stages;
// Prev/Next and the tour step chapter to chapter, landing on the chapter's
// lead stage, and the chips under the title drill into the rest.
// ============================================================
const xfSubs = (prefix) => [
  [prefix, "All layers"],
  ...Array.from({ length: N_LAYERS }, (_, l) => [`${prefix}L${l + 1}`, `Layer ${l + 1}`]),
];
const CHAPTER_DEFS = [
  [
    { title: "Overview", stages: [["intro", ""]] },
    { title: "Observation", stages: [["input", ""]] },
    { title: "Tokens", stages: [["embed", "Embedding table"], ["tokens", "Tokens"]] },
    { title: "Transformer", stages: xfSubs("xf") },
    { title: "Memory", stages: [["gru", ""]] },
    { title: "Readout", stages: [["readout", ""]] },
    {
      title: "Policy", stages: [["actor", "Heads"], ["pointer", "Pointer"], ["output", "Output"]],
      // Land on the head that actually decides this scenario.
      lead: () => (liveHead() === "pointer" ? "pointer" : "actor"),
    },
    { title: "Critic", stages: [["criticV", "Value"], ["criticAux", "Aux heads"]] },
  ],
  [
    { title: "Overview", stages: [["ointro", ""]] },
    { title: "Observation", stages: [["oObs", ""]] },
    { title: "Tokens", stages: [["oEmbed", "Embedding table"], ["oTokens", "Tokens"]] },
    { title: "Transformer", stages: xfSubs("oXf") },
    { title: "Memory", stages: [["oGru", ""]] },
    { title: "Readout", stages: [["oReadout", ""]] },
    { title: "Value", stages: [["oValue", "Value"], ["oAux", "Aux heads"]] },
  ],
];
const stageIndex = (label) => STAGES.findIndex(s => s.label === label);
// The current network's chapters, restricted to stages that exist (the
// oracle's aux stage is absent for checkpoints trained without it).
function chapters() {
  return CHAPTER_DEFS[NETWORK_MODE]
    .map(ch => ({ ...ch, stages: ch.stages.filter(([label]) => stageIndex(label) >= 0) }))
    .filter(ch => ch.stages.length);
}
function chapterOf(i) {
  const label = STAGES[i].label;
  return chapters().findIndex(ch => ch.stages.some(([l]) => l === label));
}
function chapterLead(ci) {
  const ch = chapters()[ci];
  return stageIndex(ch.lead ? ch.lead() : ch.stages[0][0]);
}

// ============================================================
// Camera tween
// ============================================================
const camState = {
  curPos: camera.position.clone(),
  curTarget: controls.target.clone(),
  tgtPos: camera.position.clone(),
  tgtTarget: controls.target.clone(),
  t: 1, // interpolation (>=1 means done)
  duration: 1500,
};
function tweenTo(pos, target, duration = 1500) {
  camState.curPos = camera.position.clone();
  camState.curTarget = controls.target.clone();
  camState.tgtPos = new THREE.Vector3(...pos);
  camState.tgtTarget = new THREE.Vector3(...target);
  camState.t = reducedMotion ? 0.999 : 0;
  camState.duration = duration;
  camState.startTime = performance.now() - (reducedMotion ? duration : 0);
  controls.autoRotate = false; // don't fight the tween; restored when done
}
function updateCameraTween() {
  if (camState.t >= 1) return;
  const elapsed = performance.now() - camState.startTime;
  const t = clamp(elapsed / camState.duration, 0, 1);
  // ease in-out cubic
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  camera.position.lerpVectors(camState.curPos, camState.tgtPos, e);
  controls.target.lerpVectors(camState.curTarget, camState.tgtTarget, e);
  camState.t = t;
  if (t >= 1) controls.autoRotate = chkRotate.checked;
}
const ZOOM_OUT = 1.6; // >1 frames more of each stage; 1 = original distances
// Stage cameras were framed for a ~16:10 view; narrower views pull back so
// the same content still fits across.
function frameFactor() {
  const a = camera.aspect;
  return a < 1.55 ? Math.pow(1.55 / a, 0.55) : 1;
}
function frameStage(s) {
  const tgt = new THREE.Vector3(...s.cam.target);
  const pos = new THREE.Vector3(...s.cam.pos).sub(tgt)
    .multiplyScalar(ZOOM_OUT * frameFactor()).add(tgt);
  tweenTo([pos.x, pos.y, pos.z], s.cam.target);
}

function renderChapters() {
  const chs = chapters();
  els.chapters.innerHTML = "";
  chs.forEach((ch, ci) => {

function showStage(i, moveCamera = true) {
  curStage = clamp(i, 0, STAGES.length - 1);
  const s = STAGES[curStage];
  const chs = chapters();
  const ci = chapterOf(curStage);
  const ch = chs[ci];

  els.kicker.textContent = ci === 0
    ? `${NETWORK_MODE === 1 ? "Oracle critic" : "Policy network"} · ${S.label}`
    : `${ci} / ${chs.length - 1} · ${ch.title}`;
  els.title.textContent = stripNum(s.title);
  els.back.hidden = true;
  els.subs.innerHTML = "";
  if (ch.stages.length > 1) {
    for (const [label, name] of ch.stages) {
      const b = document.createElement("button");
      b.textContent = name;
      b.classList.toggle("on", label === s.label);
      b.addEventListener("click", () => { stopTour(); showStage(stageIndex(label)); });
      els.subs.appendChild(b);
    }
  }
  setBody(s.body());
  [...els.chapters.children].forEach((b, k) => {
    b.classList.toggle("on", k === ci);
    b.classList.toggle("done", k < ci);
  });
  els.prev.disabled = ci === 0;
  els.next.disabled = ci === chs.length - 1;

  applyStageDim();
  // Fire a particle burst along the newly active stage's edges, and grow
  // the output bars in when that stage arrives.
  const activeGroups = STAGE_GROUPS[s.label];
  flowBurst = activeGroups
    ? { t0: performance.now(), groups: new Set(activeGroups) }
    : null;
  if (s.label === "output" && !reducedMotion) {
    outputAnim = { t0: performance.now() };
  }
  if (moveCamera) frameStage(s);
}
function stepChapter(d) {
  const ci = chapterOf(curStage) + d;
  if (ci < 0 || ci >= chapters().length) return false;
  showStage(chapterLead(ci));
  return true;
}

// Picking (click + hover tooltip)
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById("tooltip");
let hovered = null;
let downAt = null;

function pickAt(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(PICKABLES, false);
  return hits.length ? hits[0].object : null;
}
function setHovered(obj) {
  if (hovered === obj) return;
  hovered = obj;
  if (obj && obj.userData.pickInfo) {
    const info = obj.userData.pickInfo;
    let txt = info.title;
    if (info.kv) for (const [k, v] of Object.entries(info.kv)) txt += `\n${k}: ${v}`;
    tooltip.textContent = txt;
    tooltip.style.display = "block";
  } else {
    tooltip.style.display = "none";
  }
}
renderer.domElement.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  const r = stageEl.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  setHovered(pickAt(e));
  if (tooltip.style.display === "block") {
    // Keep the tooltip inside the figure.
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    tooltip.style.left = `${Math.min(x + 12, r.width - tw - 6)}px`;
    tooltip.style.top = `${y + 14 + th > r.height ? y - th - 8 : y + 14}px`;
  }
});
renderer.domElement.addEventListener("pointerleave", () => setHovered(null));
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  // A drag (orbit) is not a click.
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  downAt = null;
  if (!active) {
    setActive(true);
    flashHint(e.pointerType === "mouse"
      ? "Drag to orbit · scroll to zoom · click anything for details"
      : "Drag to orbit · pinch to zoom · tap outside to release");
  }
  const obj = pickAt(e);
  if (!obj || !obj.userData.pickInfo) return;
  const info = obj.userData.pickInfo;
  stopTour();
  if (info.onPick) info.onPick(); // e.g. readout gems toggle their full fan
  showSelection(info);
});

// ============================================================
// Resize (the figure, not the window, sets the size), iframe height
// reporting, and pausing while scrolled out of view.
// ============================================================
function onResize() {
  const { w, h } = stageSize();
  camera.aspect = w / h;
  applyViewOffset(); // also refreshes the projection matrix
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  for (const c of connLines) {
    if (c.obj.material.isLineMaterial) c.obj.material.resolution.set(w, h);
  }
}
new ResizeObserver(onResize).observe(stageEl);
if (inFrame) {
  // Let an embedding page size its iframe to the figure + caption.
  new ResizeObserver(() => {
    if (expanded) return;
    window.parent.postMessage(
      { type: "sheepshead-viz:height", height: Math.ceil(document.documentElement.scrollHeight) }, "*");
  }).observe(vizEl);
}
let onScreen = true;
new IntersectionObserver((entries) => {
  onScreen = entries[0].isIntersecting;
}).observe(stageEl);

// ============================================================
// Render loop: chord breathing, flow particles, output grow-in, idle motion.
// ============================================================
let pulseT = 0;
let frameCount = 0;
let lastNow = 0;
let outputAnim = null;
function animate(now) {
  requestAnimationFrame(animate);
  if (!onScreen && !expanded) return;
  controls.update();
  updateCameraTween();
  now = now || 0;
  const dt = Math.min((now - lastNow) / 1000 || 0.016, 0.05);
  lastNow = now;
  pulseT = now * 0.001;

  // Gentle pulse on attention chords proportional to weight
  const breath = reducedMotion ? 1 : 0.6 + Math.sin(pulseT * 1.3) * 0.4;
  for (const c of allChords) {
    if (!c.mesh.visible) continue;
    c.mesh.material.opacity =
      Math.min(1, c.baseOpacity * (0.7 + breath * 0.4)) * (chordDimMap[c.group] ?? 1);
  }
  // Query gems (and the pointer's combine nodes) slowly spin and pulse in
  // sync with the chord breathing; the selected gem pulses harder.
  if (!reducedMotion) {
    const gems = readoutInfo ? readoutInfo.gems : null;
    if (gems) {
      for (let q = 0; q < gems.length; q++) {
        const gem = gems[q];
        gem.rotation.y += dt * (q === selectedQuery ? 1.4 : 0.5);
        const ph = gem.userData.pulsePhase || 0;
        const amp = q === selectedQuery ? 0.16 : 0.07;
        gem.scale.setScalar(1 + amp * Math.sin(pulseT * 1.3 + ph));
      }
    }
    if (pointerInfo && pointerInfo.combines) {
      for (const node of pointerInfo.combines) {
        node.rotation.y += dt * 0.5;
        const ph = node.userData.pulsePhase || 0;
        node.scale.setScalar(1 + 0.07 * Math.sin(pulseT * 1.3 + ph));
      }
    }
  }

  updateFlow(now, dt);

  // Output bars grow in when the output stage arrives.
  if (outputAnim && outputInfo) {
    const t = Math.min((now - outputAnim.t0) / 800, 1);
    const e = 1 - Math.pow(1 - t, 3);
    for (const b of outputInfo.barObjs) {
      b.mesh.scale.x = Math.max(e, 0.02);
      b.mesh.position.x = b.x0 + (b.L * b.mesh.scale.x) / 2;
    }
    if (t >= 1) outputAnim = null;
  }

  // Idle micro-motion: the GRU prism slowly turns. (Cards stay still —
  // any motion makes their fine print shimmer.)
  if (flowEnabled && !reducedMotion && memInfo) memInfo.gru.rotation.y += dt * 0.3;

  // Light theme: shadows are cheap to keep a few frames stale.
  if (!TH.dark && frameCount % 3 === 0) renderer.shadowMap.needsUpdate = true;

  if (frameCount++ % 5 === 0) updateLabelFade();
  composer.render();
}

// ============================================================
// Boot
// ============================================================
buildScene();
renderChapters();
renderLegend();
onResize();
showStage(0);
requestAnimationFrame(animate);
</script>

</body>
</html>

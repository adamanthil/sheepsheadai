<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sheepshead Network Architecture</title>
<style>
  /* Two themes: the original dark "glow" look and a light "paper diagram"
     look that matches the blog (white card, grey ink, Transat type). The
     scene reads the same choice from <html data-theme> (see THEMES). */
  :root {
    --sans: TransatStandard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bold: TransatBold, var(--sans);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --b-input: #b58bff; --b-enc: #4cc9f0; --b-share: #f4a261;
    --b-actor: #80ed99; --b-critic: #ff9ec7; --b-output: #ff6b6b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #05070f; --stage: #070b1c; --panel: #0d1330; --panel-2: rgba(20, 26, 54, 0.9);
    --line: #1f2854; --line-2: #34407c;
    --ink: #c9d1f0; --heading: #eef2ff; --muted: #8e9bd1;
    --accent: #7cc4ff; --accent-soft: rgba(124, 196, 255, 0.14);
    --tip: rgba(10, 14, 32, 0.95); --tip-ink: #e6ecff;
    --tool: rgba(13, 19, 48, 0.72);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #fff; --stage: #fff; --panel: #fff; --panel-2: #f4f4f2;
    --line: #ececec; --line-2: #d6d6d2;
    --ink: #555; --heading: #4a4a4a; --muted: #8a8a85;
    --accent: #2f63b0; --accent-soft: #e5edf8;
    --tip: #3d3d3d; --tip-ink: #fff;
    --tool: rgba(255, 255, 255, 0.86);
    --b-input: #6b4fb0; --b-enc: #2f7fa8; --b-share: #a8651a;
    --b-actor: #1e7a60; --b-critic: #a83d62; --b-output: #b0443c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page); }
  body { padding: 16px; }
  body.embedded { padding: 0; } /* the host page supplies the margins */

  .viz {
    container-type: inline-size;
    max-width: 960px; margin: 0 auto;
    font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .viz *, .viz *::before, .viz *::after { min-width: 0; }
  :where(.viz) button { font: inherit; color: inherit; }

  /* ---------- the figure ---------- */
  .viz-stage {
    position: relative; aspect-ratio: 16 / 10;
    background: var(--stage); border: 1px solid var(--line);
    overflow: hidden;
  }
  @container (max-width: 560px) { .viz-stage { aspect-ratio: 1 / 1; } }
  /* A dark scene on a light page (the "Dark scene" theme): soften the hard
     black edge with a thin pale mat, a hairline outer edge and a low shadow —
     square corners, like the blog's. */
  :root[data-theme="light"][data-scene="dark"] .viz-stage {
    border: 1px solid #1a1b1e;
    box-shadow: 0 0 0 5px #f4f4f2, 0 0 0 6px #dcdcd7, 0 10px 26px -6px rgba(0, 0, 0, 0.28);
    margin: 6px;
  }
  :root[data-theme="light"][data-scene="dark"] .viz.expanded .viz-stage { box-shadow: none; margin: 0; }
  .viz-stage canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .viz-stage.inactive canvas { touch-action: pan-y !important; }

  .viz-tools { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; gap: 6px; }
  .tool {
    width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: 8px; border: 1px solid var(--line-2); background: var(--tool);
    backdrop-filter: blur(6px); cursor: pointer; color: var(--heading);
  }
  .tool:hover { border-color: var(--accent); }
  .tool svg { width: 16px; height: 16px; }

  .viz-hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4;
    font-size: 12px; color: var(--muted); background: var(--tool); border: 1px solid var(--line);
    padding: 3px 10px; border-radius: 999px; pointer-events: none; white-space: nowrap;
    opacity: 0; transition: opacity .2s;
  }
  .viz-hint.show { opacity: 1; }

  #tooltip {
    position: absolute; pointer-events: none; z-index: 6; display: none;
    background: var(--tip); color: var(--tip-ink);
    font: 11px/1.45 var(--mono); padding: 6px 9px; border-radius: 6px;
    white-space: pre; max-width: 280px; overflow: hidden;
  }

  /* ---------- options menu ---------- */
  .viz-menu {
    position: absolute; top: 46px; right: 8px; z-index: 7; width: min(290px, calc(100% - 16px));
    max-height: calc(100% - 56px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18); padding: 12px 14px; font-size: 13px;
  }
  .viz-menu[hidden] { display: none; }
  .viz-menu h4 {
    margin: 12px 0 6px; font: 600 10.5px/1 var(--mono); letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .viz-menu h4:first-child { margin-top: 0; }
  .viz-menu label { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  .viz-menu input[type=range] { accent-color: var(--accent); flex: 1; }
  .heads { display: flex; gap: 6px; }
  .heads button {
    width: 34px; padding: 3px 0; font-size: 11px; font-weight: 700; cursor: pointer;
    border-radius: 7px; border: 1.5px solid var(--hc); color: var(--hc); background: none;
  }
  .heads button.off { opacity: .35; border-color: var(--line-2); color: var(--muted); }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
  .legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  /* ---------- caption panel ---------- */
  .viz-panel { padding: 12px 2px 0; }
  .viz-pickers { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
  .viz-pickers label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .viz-pickers select {
    font: inherit; font-size: 13px; color: var(--heading); background: var(--panel-2);
    border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 6px;
  }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--accent-soft); color: var(--heading); font-weight: 600; }
  .seg .mini-badge { margin-left: 5px; font-size: 9px; font-weight: 700; text-transform: uppercase; color: #c98a1a; }

  .viz-chapters { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin: 14px 0 10px; }
  .viz-chapters button {
    border: 0; background: none; padding: 7px 0 0; cursor: pointer; position: relative;
    font-size: 11px; color: var(--muted); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .viz-chapters button::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: 2px; background: var(--line-2);
  }
  .viz-chapters button.done::before { background: color-mix(in srgb, var(--accent) 40%, var(--line-2)); }
  .viz-chapters button.on::before { background: var(--accent); }
  .viz-chapters button.on { color: var(--heading); }
  .viz-chapters button:first-child { max-width: 100%; }
  @container (max-width: 640px) { .viz-chapters button { font-size: 0; padding-top: 10px; } }

  .kicker { font: 600 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .viz h2 { margin: 3px 0 6px; font-family: var(--bold); font-weight: 600; font-size: 18px; line-height: 1.3; color: var(--heading); }
  .subs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .subs:empty { display: none; }
  .subs button {
    border: 1px solid var(--line-2); background: none; border-radius: 999px;
    padding: 1px 10px; font-size: 12px; cursor: pointer; color: var(--muted);
  }
  .subs button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--heading); }
  .back { border: 0; background: none; padding: 0; font-size: 13px; color: var(--accent); cursor: pointer; margin-bottom: 6px; }

  .viz-body { font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .viz-body p { margin: 0 0 8px; }
  .viz-body ul { margin: 0 0 8px; padding-left: 18px; }
  .viz-body code { font: 12px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .viz-body b { color: var(--heading); }

  .viz-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .viz-nav button {
    border: 1px solid var(--line-2); background: var(--panel); border-radius: 7px;
    padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--heading);
  }
  .viz-nav button:disabled { opacity: .35; cursor: default; }
  .viz-nav .play { display: inline-flex; align-items: center; gap: 6px; }

  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font: 12px/1.5 var(--mono); margin: 4px 0 10px; }
  .kv .k { color: var(--muted); }
  .kv .v { color: var(--heading); overflow-wrap: anywhere; }
  .badge {
    display: inline-block; font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 999px; border: 1px solid currentColor; vertical-align: 2px; margin-right: 6px;
  }
  .b-input { color: var(--b-input); } .b-enc { color: var(--b-enc); } .b-share { color: var(--b-share); }
  .b-actor { color: var(--b-actor); } .b-critic { color: var(--b-critic); } .b-output { color: var(--b-output); }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }

  /* ---------- expanded: the scene fills the window, the caption floats ---------- */
  .viz-side-legend { display: none; }
  body.viz-open { overflow: hidden; }
  .viz.expanded { position: fixed; inset: 0; z-index: 1000; max-width: none; margin: 0; background: var(--page); }
  .viz.expanded .viz-stage { position: absolute; inset: 0; aspect-ratio: auto; border: 0; border-radius: 0; }
  .viz.expanded .viz-tools { right: auto; left: 12px; top: 12px; }
  .viz.expanded .viz-menu { right: auto; left: 12px; top: 52px; }
  .viz.expanded .viz-panel {
    position: absolute; top: 12px; right: 12px; bottom: 12px; width: 360px; overflow: auto;
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px;
    /* Near-opaque: over the dark scene ("Dark scene" theme) a see-through
       light panel turns muddy grey. */
    background: color-mix(in srgb, var(--panel) 97%, transparent); backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
  }
  .viz.expanded .viz-side-legend { display: block; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  .viz.expanded .viz-chapters { grid-auto-flow: row; grid-auto-columns: auto; gap: 0; }
  .viz.expanded .viz-chapters button { padding: 5px 0 5px 12px; font-size: 13px; }
  .viz.expanded .viz-chapters button::before { top: 6px; bottom: 6px; left: 0; right: auto; width: 3px; height: auto; }
  @media (max-width: 760px) {
    .viz.expanded .viz-panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 45%; padding: 12px 14px; }
    .viz.expanded .viz-side-legend { display: none; }
    .viz.expanded .viz-chapters { grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
    .viz.expanded .viz-chapters button { font-size: 0; padding: 10px 0 0; }
    .viz.expanded .viz-chapters button::before { left: 0; right: 0; top: 0; bottom: auto; width: auto; height: 3px; }
  }
  @media (prefers-reduced-motion: reduce) { .viz-hint { transition: none; } }
</style>
</head>
<body>

<figure class="viz" id="viz">
  <div class="viz-stage inactive" id="viz-stage">
    <div class="viz-tools">
      <button class="tool" id="btn-menu" aria-label="Options" aria-expanded="false" aria-controls="viz-menu">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="13" cy="8" r="1.6"/></svg>
      </button>
      <button class="tool" id="btn-expand" aria-label="Expand">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path id="expand-icon" d="M10 2h4v4M6 14H2v-4M14 2 9.5 6.5M2 14l4.5-4.5"/></svg>
      </button>
    </div>
    <div class="viz-menu" id="viz-menu" hidden>
      <h4>Attention heads</h4>
      <div class="heads" id="head-chips"></div>
      <h4>View</h4>
      <label><input type="checkbox" id="chk-flow" checked /> Data-flow particles</label>
      <label><input type="checkbox" id="chk-rotate" /> Auto-rotate</label>
      <label><input type="checkbox" id="chk-floor" /> Stage names on the floor</label>
      <label><input type="checkbox" id="chk-stars" checked /> Background stars (dark scene)</label>
      <label>Tour speed <input type="range" id="speed" min="1200" max="6000" step="200" value="3500" /></label>
      <h4>Theme</h4>
      <div class="seg" id="theme-seg"><button data-theme="dark">Dark</button><button data-theme="light">Light</button><button data-theme="mixed">Dark scene</button></div>
      <h4>Key</h4>
      <div class="legend" id="legend"></div>
    </div>
    <div class="viz-hint" id="viz-hint"></div>
    <div id="tooltip"></div>
  </div>

  <div class="viz-panel">
    <div class="viz-pickers">
      <label>Decision <select id="sel-scenario"></select></label>
      <div class="seg" id="net-seg">
        <button data-net="0" class="on">Policy</button>
        <button data-net="1">Oracle critic<span class="mini-badge" id="oracle-badge">untrained</span></button>
      </div>
    </div>
    <nav class="viz-chapters" id="chapters" aria-label="Chapters"></nav>
    <div class="kicker" id="i-stage"></div>
    <h2 id="i-title">Loading…</h2>
    <button class="back" id="btn-back" hidden></button>
    <div class="subs" id="subs"></div>
    <div class="viz-body" id="i-body"></div>
    <div class="viz-nav">
      <button id="btn-prev">‹ Prev</button>
      <button id="btn-play" class="play">▶ Tour</button>
      <button id="btn-next">Next ›</button>
    </div>
    <div class="viz-side-legend legend" id="side-legend"></div>
  </div>
</figure>

<script type="module">
// three.js is inlined by build_3d_html.py (vendor/three.module.min.js +
// vendor/OrbitControls.js) and loaded through blob URLs, so the built
// single-file HTML works with no network access.
const THREE_SRC = __THREE_SRC_JSON__;
const ORBIT_SRC = __ORBIT_SRC_JSON__;
const ADDONS_SRC = __ADDONS_SRC_JSON__;
const threeUrl = URL.createObjectURL(new Blob([THREE_SRC], { type: "text/javascript" }));
const THREE = await import(threeUrl);
const importAddon = (src) => import(URL.createObjectURL(new Blob(
  [src.replace(/from\s*['"]three['"]/g, () => `from "${threeUrl}"`)],
  { type: "text/javascript" },
)));
const { OrbitControls } = await importAddon(ORBIT_SRC);
const {
  EffectComposer, RenderPass, UnrealBloomPass, OutputPass,
  Line2, LineMaterial, LineGeometry,
  RoundedBoxGeometry, RoomEnvironment,
} = await importAddon(ADDONS_SRC);

const DATA = __DATA_JSON__;

// ============================================================
// Themes. The dark theme is the original glow look (additive blending,
// emissive materials, bloom). The light theme is a matte "paper diagram"
// for white pages: normal blending, the same hues pulled down to ink
// strength (paperColor / inkColor), no bloom. <html data-theme> holds the
// choice; ?theme=light|dark picks it at load.
// ============================================================
const THEMES = {
  dark: {
    dark: true, bg: 0x05070f, dim: 0x223060, grid: [0x27336b, 0x151c3d],
    labelStrip: "rgba(8,11,28,0.5)", memBg: "#1a2142",
  },
  light: {
    dark: false, bg: 0xffffff, dim: 0xd9dbe3, grid: [0xe4e4e0, 0xf0f0ee],
    labelStrip: "rgba(255,255,255,0.75)", memBg: "#eef0f4",
  },
};
// A theme name picks two things independently: the scene (THEMES) and the
// page chrome (CSS on <html data-theme>). "mixed" = the dark glowing scene
// framed by the light page and caption, for a white blog post.
const THEME_PARTS = {
  dark: { scene: "dark", chrome: "dark", backdrop: "navy" },
  light: { scene: "light", chrome: "light", backdrop: "paper" },
  mixed: { scene: "dark", chrome: "light", backdrop: "grey" },
};
// Backdrop of a dark scene: the original navy, or a neutral near-black grey
// that sits more quietly inside a white page.
const BACKDROPS = {
  navy: { stops: ["#0d1330", "#070b1c", "#05070f"], fog: 0x05070f, grid: [0x27336b, 0x151c3d] },
  grey: { stops: ["#232427", "#1a1b1e", "#131416"], fog: 0x131416, grid: [0x3b3d43, 0x26282c] },
};
const themeParam = new URLSearchParams(location.search).get("theme");
let themeName = THEME_PARTS[themeParam] ? themeParam : "dark";
let TH = THEMES[THEME_PARTS[themeName].scene];
function applyThemeAttrs() {
  const { chrome, scene } = THEME_PARTS[themeName];
  document.documentElement.dataset.theme = chrome;
  document.documentElement.dataset.scene = scene; // lets CSS frame a dark scene on a light page
}
applyThemeAttrs();
// Scene hue → a mesh color that holds up under white-ground lighting.
function paperColor(hex) {
  const c = new THREE.Color(hex);
  if (TH.dark) return c;
  const hsl = {};
  c.getHSL(hsl);
  return c.setHSL(hsl.h, Math.min(0.72, hsl.s), 0.24 + hsl.l * 0.26);
}
// Unlit ink (lines, labels): lightness in display sRGB, not three's linear
// working space — there 0.3 would display as a washed-out ~0.6.
const SRGB = THREE.SRGBColorSpace;
function lineInk(hex) {
  const c = new THREE.Color(hex);
  const hsl = {};
  c.getHSL(hsl, SRGB);
  return c.setHSL(hsl.h, Math.min(hsl.s, 0.75), 0.3 + hsl.l * 0.18, SRGB);
}
// Label ink: same hue, dark enough to read on white.
function inkColor(css) {
  const c = new THREE.Color(css);
  if (TH.dark) return css;
  const hsl = {};
  c.getHSL(hsl, SRGB);
  c.setHSL(hsl.h, Math.min(hsl.s, 0.6), hsl.s < 0.2 ? 0.3 : 0.36, SRGB);
  return "#" + c.getHexString(SRGB);
}
const flowBlending = () => (TH.dark ? THREE.AdditiveBlending : THREE.NormalBlending);

// ============================================================
// Color palette
// ============================================================
const C = {
  bgTop: 0x0b1020,
  bgBot: 0x05070f,
  input: 0xb58bff,
  enc: 0x4cc9f0,
  share: 0xf4a261,
  actor: 0x80ed99,
  critic: 0xff9ec7,
  output: 0xff6b6b,
  pulse: 0xfffa9e,
  dim: TH.dim,
  text: 0xe6ecff,
};
// One hue per attention head — used by the transformer chords, the shared
// readout fans, and the H1–H4 toggle chips (keep in sync with the legend /
// chip CSS colors).
const HEAD_COLORS = [0x4cc9f0, 0x3ee6b0, 0x6f8dff, 0xc77bff];
// The SHARED encoder readout renders in an amber/gold family (it is trunk
// infrastructure, feeding actor and critic alike). Per-gem hue varies
// slightly by grid position so neighboring gems stay distinguishable.
const READOUT_GOLD = 0xffc65c;
// The ORACLE CRITIC renders in a violet/indigo "privileged information"
// family — instantly distinct from the policy's cyan/amber/green/pink.
const ORACLE_VIOLET = 0x8b6cff;
const ORACLE_LIGHT = 0xc9b8ff;
// One tint per opponent seat (rel +1..+4) for the 32 opp-hand tokens.
const OPP_SEAT_COLORS = [0x8f7bff, 0xa86ef5, 0xc17bea, 0xd88fdd];
// The secret partner's seat block pops in warm gold.
const PARTNER_GOLD = 0xffd166;
function readoutGemColor(q) {
  const row = Math.floor(q / 4), col = q % 4;
  if (NETWORK_MODE === 1) {
    // Oracle: 4 gems in a violet family.
    return new THREE.Color().setHSL(0.72 + q * 0.012, 0.75, 0.58 + row * 0.03);
  }
  return new THREE.Color().setHSL(0.085 + col * 0.010, 0.82, 0.50 + row * 0.035);
}

// ============================================================
// Scene setup
// ============================================================
const scene = new THREE.Scene();
const stageEl = document.getElementById("viz-stage");
const vizEl = document.getElementById("viz");
const stageSize = () => ({
  w: Math.max(1, stageEl.clientWidth), h: Math.max(1, stageEl.clientHeight),
});

// near = 0.5 (not 0.1): depth precision near the far stages is what keeps
// each card's face from z-fighting its body.
const camera = new THREE.PerspectiveCamera(45, stageSize().w / stageSize().h, 0.5, 1200);
camera.position.set(35, 38, 70);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
// updateStyle=false: CSS stretches the canvas to the figure. An inline
// pixel size here would pin it at its first size when the figure grows.
renderer.setSize(stageSize().w, stageSize().h, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stageEl.prepend(renderer.domElement);

// Soft image-based lighting so metallic surfaces pick up believable
// reflections; intensity is dialed down per material after each build.
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

// Post-processing: bloom makes the dark theme's emissive "glow" real. The
// light theme turns it off — bloom on a white ground just greys it out.
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(stageSize().w, stageSize().h),
  0.5,   // strength
  0.55,  // radius
  0.6,   // luminance threshold
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 5, 0);
// Zoom-out cap: past this the diagram is a speck anyway, and it keeps the
// camera well inside the background star shell.
controls.maxDistance = 300;

// Lights (intensities are per theme — see applyThemeEnvironment)
const ambLight = new THREE.AmbientLight(0x445588, 0.45);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(20, 50, 40);
scene.add(dirLight);
const rim = new THREE.PointLight(0xb58bff, 0.6, 200);
rim.position.set(-30, 20, -30);
scene.add(rim);
// Light theme only: sky/ground fill for shading, and the key light casts
// soft shadows onto an otherwise invisible floor — paper's stand-in for the
// dark theme's bloom as the source of depth.
const hemiLight = new THREE.HemisphereLight(0xffffff, 0xd9d4c8, 0);
scene.add(hemiLight);
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
dirLight.shadow.mapSize.set(4096, 4096);
Object.assign(dirLight.shadow.camera, { left: -110, right: 110, top: 70, bottom: -70, near: 1, far: 260 });
dirLight.shadow.bias = -0.0004;
dirLight.shadow.normalBias = 0.02;
dirLight.shadow.radius = 6;
const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.ShadowMaterial({ opacity: 0.11 }),
);
shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.position.y = -10.02;
shadowFloor.receiveShadow = true;
scene.add(shadowFloor);

// Floor grid for spatial reference — rebuilt per theme, translucent so it
// recedes.
let grid = null;

// Background stars (dark scenes): faint points scattered through a volume
// much larger than the diagram. They carry no meaning — when the camera
// orbits, near and far points slide at different rates, and that parallax
// is what makes the 3D layout easier to read. Seeded, so every load (and
// every screenshot) places them identically.
let showStars = true;
const starfield = (() => {
  let seed = 20260924;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const N = 420;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    // A thick shell 380–760 units out: beyond the camera's zoom-out cap
    // (controls.maxDistance), so the camera can never reach a star.
    const r = 380 + rnd() * 380;
    const th = rnd() * Math.PI * 2;
    const ph = Math.acos(2 * rnd() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = Math.abs(r * Math.cos(ph)) * 0.6 - 20; // mostly above the floor
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    c.setHSL(0.58 + rnd() * 0.12, 0.35, 0.55 + rnd() * 0.3);
    const k = 0.25 + rnd() * 0.45; // dim: stays under the bloom threshold
    col[i * 3] = c.r * k; col[i * 3 + 1] = c.g * k; col[i * 3 + 2] = c.b * k;
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geom.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const tex = (() => {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 32;
    const x = cv.getContext("2d");
    const g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.4, "rgba(255,255,255,0.35)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g;
    x.fillRect(0, 0, 32, 32);
    return new THREE.CanvasTexture(cv);
  })();
  const pts = new THREE.Points(geom, new THREE.PointsMaterial({
    // Fixed screen size (px): no star can balloon, and depth still reads
    // through parallax as the camera orbits.
    size: 3, map: tex, vertexColors: true, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: false, fog: false,
  }));
  pts.frustumCulled = false;
  scene.add(pts);
  return pts;
})();

function applyThemeEnvironment() {
  const BD = BACKDROPS[THEME_PARTS[themeName].backdrop];
  if (TH.dark) {
    const bgCanvas = document.createElement("canvas");
    bgCanvas.width = 2; bgCanvas.height = 512;
    const bctx = bgCanvas.getContext("2d");
    const grad = bctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, BD.stops[0]);
    grad.addColorStop(0.55, BD.stops[1]);
    grad.addColorStop(1, BD.stops[2]);
    bctx.fillStyle = grad;
    bctx.fillRect(0, 0, 2, 512);
    const bgTex = new THREE.CanvasTexture(bgCanvas);
    bgTex.colorSpace = THREE.SRGBColorSpace;
    scene.background = bgTex;
  } else {
    // Faint cool-to-warm fall-off: white at the top, a breath of grey at
    // the horizon, so the far stages recede into the page.
    const bgCanvas = document.createElement("canvas");
    bgCanvas.width = 2; bgCanvas.height = 512;
    const bctx = bgCanvas.getContext("2d");
    const grad = bctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.6, "#fcfcfb");
    grad.addColorStop(1, "#f4f3f0");
    bctx.fillStyle = grad;
    bctx.fillRect(0, 0, 2, 512);
    const bgTex = new THREE.CanvasTexture(bgCanvas);
    bgTex.colorSpace = THREE.SRGBColorSpace;
    scene.background = bgTex;
  }
  scene.fog = TH.dark ? new THREE.Fog(BD.fog, 220, 900) : new THREE.Fog(0xf8f7f5, 200, 700);
  starfield.visible = TH.dark && showStars;
  renderer.toneMapping = TH.dark ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = TH.dark ? 1.1 : 1.0;
  bloomPass.enabled = TH.dark;
  ambLight.color.set(TH.dark ? 0x445588 : 0xffffff);
  ambLight.intensity = TH.dark ? 0.45 : 0.3;
  hemiLight.intensity = TH.dark ? 0 : 0.75;
  dirLight.intensity = TH.dark ? 0.9 : 1.25;
  dirLight.position.set(TH.dark ? 20 : 40, TH.dark ? 50 : 100, TH.dark ? 40 : 60);
  rim.intensity = TH.dark ? 0.6 : 0;
  renderer.shadowMap.enabled = !TH.dark;
  dirLight.castShadow = !TH.dark;
  shadowFloor.visible = !TH.dark;
  renderer.shadowMap.needsUpdate = true;
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  const gridCols = TH.dark ? BD.grid : TH.grid;
  grid = new THREE.GridHelper(220, 44, gridCols[0], gridCols[1]);
  grid.position.y = -10;
  grid.material.transparent = true;
  grid.material.opacity = TH.dark ? 0.45 : 0.55;
  scene.add(grid);
}
applyThemeEnvironment();

// ============================================================
// Helpers
// ============================================================
// Sprite labels fade out with camera distance (fine detail shouldn't smear
// the overview) — registry is consulted every few frames in the render loop.
const labelRegistry = [];
function makeLabel(text, color = "#e6ecff", scale = 1) {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const SS = 2; // supersample so text stays crisp on hidpi screens
  const px = 64 * scale * SS;
  ctx.font = `600 ${px}px ui-sans-serif, system-ui, -apple-system`;
  const w = ctx.measureText(text).width + 32 * SS;
  canvas.width = w;
  canvas.height = px + 24 * SS;
  ctx.font = `600 ${px}px ui-sans-serif, system-ui, -apple-system`;
  ctx.fillStyle = inkColor(color);
  ctx.textBaseline = "middle";
  ctx.fillText(text, 16 * SS, canvas.height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  // Light theme: tag the canvas as sRGB so the ink displays as painted (the
  // dark theme's pastel labels were tuned untagged — leave them be).
  if (!TH.dark) tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  const aspect = canvas.width / canvas.height;
  const h = 1.4 * scale;
  sprite.scale.set(h * aspect, h, 1);
  // Smaller labels are finer detail → they disappear sooner as you zoom out.
  const near = scale <= 0.45 ? 48 : scale <= 0.6 ? 75 : 130;
  labelRegistry.push({ sprite, mat, near });
  return sprite;
}

function updateLabelFade() {
  for (const L of labelRegistry) {
    const d = camera.position.distanceTo(L.sprite.position);
    const t = clamp((L.near * 1.35 - d) / (L.near * 0.55), 0, 1);
    const dim = L.sprite.userData.dimFactor ?? 1;
    L.mat.opacity = t * dim;
    L.sprite.visible = t * dim > 0.03;
  }
}

// Stage labels are painted flat on the ground, reading along Z (perpendicular
// to the +X data flow) so they never overlap each other or face the camera.
// Off by default (the caption names the stage); the options menu shows them.
let showFloorLabels = false;
const floorLabels = [];
function makeStageLabel(text, color = "#7cc4ff") {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = "bold 56px ui-sans-serif, system-ui";
  const w = ctx.measureText(text).width + 60;
  canvas.width = w; canvas.height = 80;
  // faint backing strip so text stays legible against the floor grid
  ctx.fillStyle = TH.labelStrip;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(4, 10, w - 8, 60, 12); ctx.fill(); }
  ctx.font = "bold 56px ui-sans-serif, system-ui";
  ctx.fillStyle = inkColor(color);
  ctx.textBaseline = "middle";
  ctx.fillText(text, 30, 42);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const ph = 1.9, pw = (w / 80) * ph;
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mat);
  mesh.rotateX(-Math.PI / 2); // lay flat on the ground
  mesh.rotateZ(Math.PI / 2);  // turn text to run along Z, across the flow
  mesh.visible = showFloorLabels;
  floorLabels.push(mesh);
  return mesh;
}

// ============================================================
// Card visual language — copied from the product app's design system
// (app/web/lib/ds/PlayingCard.tsx + .module.css), not imported: paper
// face, serif corner rank with the small suit beneath, a big center
// pip, hatched green back, 1.45 aspect. On top of the app look each
// face adds a point badge (top right) and its 16-d embedding-table row
// painted as a color barcode along the bottom — the card and its
// vector in one object. Trump wears a gold rim.
// ============================================================
const CARD_STYLE = {
  paper: "#faf7ee",
  edge: "#d5d2c4",
  black: "#0e0d0a",
  red: "#b3331e",
  back: "#1f3b2f",
  backEdge: "#152920",
  gold: "#d4af37",
  serif: 'Georgia, "Times New Roman", serif',
};
const SUIT_SYMBOLS = { C: "♣", S: "♠", H: "♥", D: "♦" };
const CARD_POINT_VALUES = { A: 11, "10": 10, K: 4, Q: 3, J: 2 };
function parseCardCode(code) {
  return code.startsWith("10")
    ? { rank: "10", suit: code.slice(2) }
    : { rank: code[0], suit: code[1] };
}
function cardPoints(code) {
  return CARD_POINT_VALUES[parseCardCode(code).rank] || 0;
}

// The informed-init dim groups of the 34×16 embedding table. The barcode
// leaves a wider gap between groups; group boundaries sit before these dims.
const EMB_GROUP_BREAKS = new Set([4, 8, 9, 10]);
function embRowFor(code) {
  const cid = code === "UNDER" ? 33 : deckIds[code];
  return cid === undefined ? null : curEmbedding().table[cid];
}
// Cell color for one embedding value — the same diverging map stage 2 uses.
function embCellCss(v) {
  const emb = curEmbedding();
  const norm = (v - emb.min) / Math.max(1e-6, emb.max - emb.min);
  return "#" + new THREE.Color().setHSL(0.6 - norm * 0.55, 0.9, 0.25 + norm * 0.45).getHexString();
}
// Inline-HTML rendering of a card's embedding row for the info panel.
function embRowHtml(code) {
  const row = embRowFor(code);
  if (!row) return "";
  const cells = row.map((v, d) =>
    `<span title="d${d} = ${v.toFixed(3)}" style="flex:1;height:14px;border-radius:2px;background:${embCellCss(v)};${EMB_GROUP_BREAKS.has(d) ? "margin-left:5px" : ""}"></span>`
  ).join("");
  return `<div style="display:flex;gap:2px;margin:8px 0 2px">${cells}</div>
    <div style="display:flex;font-size:9px;color:var(--muted);letter-spacing:0.3px">
      <span style="flex:4;text-align:center">suit</span><span style="flex:4;text-align:center">rank</span><span style="flex:1;text-align:center">pt</span><span style="flex:1;text-align:center">u</span><span style="flex:6;text-align:center">learned</span>
    </div>`;
}

// Inline card chip for HTML panels — the MiniCardMark idea from the app's
// design system: paper chip, serif rank + suit glyph, red/black ink, gold
// edge on trump.
function cardChipHtml(code) {
  if (code === "UNDER") {
    return `<span style="display:inline-block;background:#141a2e;color:#8e9bd1;border:1px dashed #4a5490;border-radius:3px;padding:0 4px;font-size:11px;font-style:italic;font-family:Georgia,serif;line-height:1.5">under</span>`;
  }
  const { rank, suit } = parseCardCode(code);
  const sym = SUIT_SYMBOLS[suit] || "";
  const red = suit === "H" || suit === "D";
  const isTrump = trumpCardCodes.includes(code);
  return `<span style="display:inline-block;background:#f5f2e9;color:${red ? "#b3331e" : "#0e0d0a"};border:1px solid ${isTrump ? "#d4af37" : "#c9c4b4"};${isTrump ? "box-shadow:0 0 3px rgba(212,175,55,0.7);" : ""}border-radius:3px;padding:0 4px;font-size:11px;font-weight:600;font-family:Georgia,serif;line-height:1.5">${rank}${sym}</span>`;
}
function cardListHtml(codes) {
  return codes.map(cardChipHtml).join(" ");
}
// Action name with its card code rendered as a chip ("PLAY QC" etc).
function actionHtml(name) {
  const m = name.match(/^(PLAY|BURY|UNDER|CALL)\s+(\S+)(.*)$/);
  if (!m || (deckIds[m[2]] === undefined && m[2] !== "UNDER")) return `<b>${name}</b>`;
  return `<b>${m[1]}</b> ${cardChipHtml(m[2])}${m[3] || ""}`;
}

// Human-readable kv of the 10 header scalars (raw values from the dump).
// Relative-seat fields are 1-based (1 = me, k = k−1 seats to the left; 0 = —).
function relSeatStr(v) {
  return v === 0 ? "—" : v === 1 ? "me" : `+${v - 1}`;
}
function headerKv() {
  const h = S.sample.header;
  if (!h) return undefined;
  return {
    "partner_mode": h.partner_mode ? "1 · called ace" : "0 · JD partner",
    "is_leaster": String(h.is_leaster),
    "play_started": String(h.play_started),
    "current_trick": String(h.current_trick),
    "alone_called": String(h.alone_called),
    "called_under": String(h.called_under),
    "picker_rel": relSeatStr(h.picker_rel),
    "partner_rel": relSeatStr(h.partner_rel),
    "leader_rel": relSeatStr(h.leader_rel),
    "picker_position": h.picker_position ? `seat ${h.picker_position}` : "—",
  };
}

function rrPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const CARD_TEX_W = 256, CARD_TEX_H = 372;
// Cache per (mode, kind, code): many meshes share one texture. Cleared on
// scene dispose (disposeScene disposes the textures out from under it).
const cardTexCache = new Map();
function cardTexture(kind, code) {
  const key = `${NETWORK_MODE}|${kind}|${code}`;
  let tex = cardTexCache.get(key);
  if (tex) return tex;
  const canvas = document.createElement("canvas");
  canvas.width = CARD_TEX_W;
  canvas.height = CARD_TEX_H;
  const ctx = canvas.getContext("2d");
  if (kind === "back") paintCardBack(ctx);
  else if (kind === "under") paintCardUnder(ctx);
  else paintCardFace(ctx, code, kind === "face-vec");
  tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  cardTexCache.set(key, tex);
  return tex;
}

function paintCardFace(ctx, code, withVec) {
  const W = CARD_TEX_W, H = CARD_TEX_H;
  const { rank, suit } = parseCardCode(code);
  const sym = SUIT_SYMBOLS[suit] || "";
  const isTrump = trumpCardCodes.includes(code);
  const ink = suit === "H" || suit === "D" ? CARD_STYLE.red : CARD_STYLE.black;

  rrPath(ctx, 2, 2, W - 4, H - 4, 14);
  ctx.fillStyle = CARD_STYLE.paper;
  ctx.fill();
  ctx.lineWidth = isTrump ? 6 : 3;
  ctx.strokeStyle = isTrump ? CARD_STYLE.gold : CARD_STYLE.edge;
  ctx.stroke();
  if (isTrump) {
    rrPath(ctx, 9, 9, W - 18, H - 18, 9);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(212,175,55,0.45)";
    ctx.stroke();
  }

  // Corner block: rank with the small suit centered beneath (the app's
  // layout). The mirrored bottom-right corner is dropped when the barcode
  // needs the bottom of the face.
  const drawCorner = () => {
    ctx.fillStyle = ink;
    ctx.textBaseline = "alphabetic";
    ctx.font = `500 46px ${CARD_STYLE.serif}`;
    const rankW = ctx.measureText(rank).width;
    ctx.font = `36px ${CARD_STYLE.serif}`;
    const suitW = ctx.measureText(sym).width;
    const cx = 16 + Math.max(rankW, suitW) / 2;
    ctx.textAlign = "center";
    ctx.font = `500 46px ${CARD_STYLE.serif}`;
    ctx.fillText(rank, cx, 56);
    ctx.font = `36px ${CARD_STYLE.serif}`;
    ctx.fillText(sym, cx, 92);
  };
  drawCorner();
  if (!withVec) {
    ctx.save();
    ctx.translate(W, H);
    ctx.rotate(Math.PI);
    drawCorner();
    ctx.restore();
  }

  // Center pip, optically nudged per suit like the app's CSS.
  const nudge = suit === "H" ? 4 : suit === "D" ? 6 : 15;
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = ink;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `128px ${CARD_STYLE.serif}`;
  ctx.fillText(sym, W / 2, H / 2 - nudge);
  ctx.globalAlpha = 1;

  // Point badge (a viz addition): the card's point value, gold on trump.
  const pts = cardPoints(code);
  const bx = W - 40, by = 40, br = 24;
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.fillStyle = isTrump ? "rgba(212,175,55,0.16)" : "rgba(14,13,10,0.045)";
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = isTrump ? CARD_STYLE.gold : "#c9c4b4";
  ctx.stroke();
  ctx.fillStyle = pts > 0 ? CARD_STYLE.black : "#a09b8c";
  ctx.font = `600 26px ${CARD_STYLE.serif}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(pts), bx, by + 1);

  // Embedding barcode: this card's 16-d row from the live table, in the
  // same diverging colors as stage 2; wider gaps split the informed-init
  // dim groups (suit | rank | pts | under | learned).
  const row = withVec ? embRowFor(code) : null;
  if (row) {
    const x0 = 18, x1 = W - 18, y0 = H - 58, chh = 30;
    ctx.strokeStyle = CARD_STYLE.edge;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, y0 - 9);
    ctx.lineTo(x1, y0 - 9);
    ctx.stroke();
    const gap = 2, extraGap = 5;
    const cw = (x1 - x0 - 15 * gap - 4 * extraGap) / 16;
    let x = x0;
    for (let d = 0; d < 16; d++) {
      if (d > 0) x += gap + (EMB_GROUP_BREAKS.has(d) ? extraGap : 0);
      ctx.fillStyle = embCellCss(row[d]);
      rrPath(ctx, x, y0, cw, chh, 2);
      ctx.fill();
      x += cw;
    }
    ctx.fillStyle = "#a09b8c";
    ctx.font = "500 13px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("16-d embedding row", W / 2, H - 10);
  }
}

function paintCardBack(ctx) {
  const W = CARD_TEX_W, H = CARD_TEX_H;
  rrPath(ctx, 2, 2, W - 4, H - 4, 14);
  const grad = ctx.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, H * 0.62);
  grad.addColorStop(0, CARD_STYLE.back);
  grad.addColorStop(1, "#142a21");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = CARD_STYLE.backEdge;
  ctx.stroke();
  ctx.save();
  rrPath(ctx, 2, 2, W - 4, H - 4, 14);
  ctx.clip();
  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 4;
  for (let d = -H; d < W + H; d += 18) {
    ctx.beginPath();
    ctx.moveTo(d, -4);
    ctx.lineTo(d + H, H + 4);
    ctx.stroke();
  }
  ctx.restore();
  rrPath(ctx, W * 0.08, H * 0.08, W * 0.84, H * 0.84, 14);
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(250,247,238,0.35)";
  ctx.stroke();
}

// The UNDER placeholder — the app's inset card with an italic label.
function paintCardUnder(ctx) {
  const W = CARD_TEX_W, H = CARD_TEX_H;
  rrPath(ctx, 2, 2, W - 4, H - 4, 14);
  ctx.fillStyle = "#141a2e";
  ctx.fill();
  ctx.setLineDash([12, 9]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#4a5490";
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#8e9bd1";
  ctx.font = `italic 46px ${CARD_STYLE.serif}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("under", W / 2, H / 2);
}

// A physical playing card: thin rounded body (gold-edged for trump),
// app-styled face on the front, hatched back on the rear. `w` is the card
// width; height follows the app's 1.45 aspect.
function makeCardMesh(code, w, { faceDown = false, withVec = true } = {}) {
  const h = w * 1.45;
  const d = Math.max(0.1, w * 0.032);
  const grp = new THREE.Group();
  const isUnder = code === "UNDER";
  const isTrump = !faceDown && !isUnder && trumpCardCodes.includes(code);
  const bodyColor = faceDown ? 0x152920 : isTrump ? 0xd4af37 : 0xcfccc0;
  const body = new THREE.Mesh(
    new RoundedBoxGeometry(w, h, d, 2, Math.min(0.14, w * 0.045)),
    new THREE.MeshStandardMaterial({
      color: bodyColor, emissive: bodyColor,
      emissiveIntensity: isTrump ? 0.18 : 0.04,
      metalness: 0.2, roughness: 0.55,
    }),
  );
  body.material.userData.keepColor = true;
  grp.add(body);
  const backTex = cardTexture("back", "__");
  const faceTex = faceDown ? backTex
    : isUnder ? cardTexture("under", "UNDER")
    : cardTexture(withVec ? "face-vec" : "face", code);
  const mkSide = (tex, zOff, flip) => {
    // Unlit, and multiplied down so the paper sits just under the bloom
    // pass's luminance threshold — lit white paper blooms into a blob.
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w * 0.995, h * 0.995),
      new THREE.MeshBasicMaterial({
        map: tex, transparent: true, color: TH.dark ? 0xc8c5bb : 0xffffff,
        // Pulled toward the camera in depth so the face never fights the body.
        polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
      }),
    );
    // Draw after the body: once stage dimming makes both transparent, the
    // distance sort would otherwise flip face and body frame to frame.
    m.renderOrder = 1;
    m.position.z = zOff;
    if (flip) m.rotation.y = Math.PI;
    grp.add(m);
    return m;
  };
  const face = mkSide(faceTex, d / 2 + 0.012, false);
  const back = mkSide(backTex, -d / 2 - 0.012, true);
  grp.userData.pickMeshes = [body, face, back];
  return grp;
}
// A card is three meshes; hovering any of them should hit the same info.
function registerCardPickable(cardGrp, info) {
  for (const m of cardGrp.userData.pickMeshes) registerPickable(m, info);
}

// 256-d memory vector as a 2×128 heat strip (signed: warm +, cool −).
function memoryStripTexture(vec) {
  const c = document.createElement("canvas");
  c.width = 128;
  c.height = 16;
  const ctx = c.getContext("2d");
  ctx.fillStyle = TH.memBg;
  ctx.fillRect(0, 0, 128, 16);
  let amax = 0;
  for (const v of vec) amax = Math.max(amax, Math.abs(v));
  if (amax > 1e-9) {
    const col = new THREE.Color();
    for (let i = 0; i < 256; i++) {
      const t = clamp(vec[i] / amax, -1, 1);
      col.setHSL(t >= 0 ? 0.085 : 0.62, 0.85,
        TH.dark ? 0.12 + Math.abs(t) * 0.45 : 0.94 - Math.abs(t) * 0.5);
      ctx.fillStyle = "#" + col.getHexString();
      ctx.fillRect(i % 128, i < 128 ? 0 : 8, 1, 8);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;
  return tex;
}

function vecMag(arr) {
  let s = 0;
  for (const v of arr) s += v * v;
  return Math.sqrt(s);
}
function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function softmax(logits) {
  const m = Math.max(...logits);
  const ex = logits.map(v => Math.exp(v - m));
  const s = ex.reduce((a, b) => a + b, 0);
  return ex.map(v => v / s);
}

// ---- Mode accessors: one place absorbs the policy/oracle schema split ----
function curDims() { return NETWORK_MODE === 1 ? DATA.oracle.dims : DATA.dims; }
function curEmbedding() {
  return NETWORK_MODE === 1 ? DATA.oracle.card_embedding : DATA.card_embedding;
}
function curMemory() { return NETWORK_MODE === 1 ? SO.memory : S.memory; }
function curReadout() {
  return NETWORK_MODE === 1 ? SO.encoder_readout : S.encoder_readout;
}
function curLayers() {
  return NETWORK_MODE === 1 ? SO.transformer.layers : S.transformer.layers;
}
function tokenMask(i) {
  return NETWORK_MODE === 1
    ? !!SO.tokens_pre.mask[i]
    : !!S.tokens_pre_attn.mask[i];
}
function tokenPreNorm(i) {
  if (NETWORK_MODE === 1) return SO.tokens_pre.norms[i];
  const p = S.tokens_pre_attn;
  const flat = [p.context, p.memory, ...p.hand, ...p.trick];
  return vecMag(flat[i]);
}
// Directed attention triples {h, i, j, w} of layer l — dense policy maps
// and the oracle's sparse top-K serialization meet here.
function layerTriples(l) {
  if (NETWORK_MODE === 1) {
    return SO.transformer.layers[l].attn_topk.map(
      ([h, i, j, w]) => ({ h, i, j, w }));
  }
  const L = S.transformer.layers[l];
  const out = [];
  for (let h = 0; h < N_HEADS; h++) {
    for (let i = 0; i < N_TOK; i++) {
      if (!tokenMask(i)) continue;
      for (let j = 0; j < N_TOK; j++) {
        if (j === i || !tokenMask(j)) continue;
        out.push({ h, i, j, w: L.attn[h][i][j] });
      }
    }
  }
  return out;
}

// Which actual card (if any) a token carries. Blind/bury and opponent-hand
// tokens exist only in the oracle's layout (the policy has neither).
function tokenCardCode(i) {
  const info = TOKEN_INFO[i];
  if (info.type === "hand") {
    const code = idToCode[handCardIds[info.idx]];
    return code && code !== "PAD" ? code : null;
  }
  if (info.type === "trick") {
    const code = S.sample.trick_card_codes[info.idx];
    return code && code !== "PAD" ? code : null;
  }
  if (info.type === "blind") return SO ? SO.sample.blind_cards[info.idx] || null : null;
  if (info.type === "bury") return SO ? SO.sample.bury_cards[info.idx] || null : null;
  if (NETWORK_MODE === 1 && SO && info.type === "opp") {
    const cid = SO.sample.opp_hand_ids[info.seat][info.idx];
    const code = idToCode[cid];
    return cid && code && code !== "PAD" ? code : null;
  }
  return null;
}

// Which policy head actually drives this scenario's decision.
function liveHead() {
  const kind = S.sample.kind;
  if (kind === "pick") return "pick";
  if (kind === "call") return "call";
  return "pointer"; // bury / lead / follow all score hand slots
}

// Rebuildable scene root + registries

let sceneRoot = null;
let stageGroups = {};
let PICKABLES = [];
let connLines = [];
let allChords = []; // every attention chord (tunnel + readouts), for styling
let inputInfo, embedInfo, tokensInfo, xfInfo, memInfo, readoutInfo,

function group(name) {
  if (!stageGroups[name]) {
    stageGroups[name] = new THREE.Group();
    stageGroups[name].name = name;
    sceneRoot.add(stageGroups[name]);
  }
  return stageGroups[name];
}

function registerPickable(mesh, info) {
  mesh.userData.pickInfo = info;
  PICKABLES.push(mesh);
}

function registerConn(obj, baseOpacity) {
  connLines.push({ obj, base: baseOpacity });
  return obj;
}

// Fat lines (Line2): WebGL ignores LineBasicMaterial.linewidth, so classic
// lines render as flickery 1px hairlines. These rasterize at a real width.
function makeFatLine(points, color, opacity, linewidth = 1.7) {
  const positions = [];
  for (const p of points) positions.push(p.x, p.y, p.z);
  const geom = new LineGeometry();
  geom.setPositions(positions);
  const mat = new LineMaterial({
    color, transparent: true, opacity,
    // Paper strokes get a floor width: the thin rails vanish on white.
    linewidth: TH.dark ? linewidth : Math.max(1.8, linewidth * 1.3),
    blending: flowBlending(), depthWrite: false,
  });
  mat.resolution.set(stageSize().w, stageSize().h);
  const line = new Line2(geom, mat);
  line.computeLineDistances();
  return line;
}
function makeGlowLine(p0, p1, color, opacity = 0.4) {
  const line = registerConn(makeFatLine([p0, p1], color, opacity), opacity);
  // Flow particles ride this edge (see buildFlowSystem).
  line.userData.flowCurve = new THREE.LineCurve3(p0.clone(), p1.clone());
  line.userData.flowColor = color;
  line.userData.flowIntensity = opacity;
  return line;
}

function disposeScene() {
  if (!sceneRoot) return;
  sceneRoot.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      for (const m of mats) {
        if (m.map) m.map.dispose();
        m.dispose();
      }
    }
  });
  scene.remove(sceneRoot);
  cardTexCache.clear(); // the traverse above disposed the cached textures
  sceneRoot = null;
  stageGroups = {};
  PICKABLES = [];
  connLines = [];
  allChords = [];
  labelRegistry.length = 0;
  floorLabels.length = 0;
  flowState = null;
  hovered = null;
  selectedQuery = null;
}

// Per-head visibility, driven by the H1–H4 chips in the HUD.
const headOn = new Array(N_HEADS).fill(true);
// Shared-readout gem selection: clicking a gem reveals its FULL per-head
// attention fan (and hides its default top-3 chords); null = none selected.
let selectedQuery = null;
function selectQuery(q) {
  selectedQuery = selectedQuery === q ? null : q;
  styleChords();
}
function chordRadius(norm) {
  return 0.035 + norm * 0.18;
}
function chordBaseOpacity(norm) {
  return TH.dark ? 0.18 + norm * 0.5 : 0.3 + norm * 0.6;
}
function chordVisible(c) {
  // Readout gem fans: a gem's full per-head fan shows only while selected;
  // its default top-3 (head-averaged) chords hide while the fan is up.
  if (c.qSel !== undefined && c.qSel !== selectedQuery) return false;
  if (c.qTop !== undefined && c.qTop === selectedQuery) return false;
  if (c.head !== undefined && !headOn[c.head]) return false;
  return true;
}
function chordGeometry(curve, norm) {
  return new THREE.TubeGeometry(curve, 18, chordRadius(norm), 6, false);
}
// Every chord keeps its own hue (head color / query color); strength shows
// as brightness toward the hot pulse tone plus thickness.
function chordColor(c) {
  const t = c.norm;
  if (!TH.dark) {
    // Paper: ink throughout, strong links a shade deeper; weight reads
    // mostly through thickness and opacity.
    return paperColor(c.baseColor).multiplyScalar(1 - t * 0.2);
  }
  const cold = new THREE.Color(c.baseColor).multiplyScalar(0.42);
  const hot = new THREE.Color(c.baseColor).lerp(new THREE.Color(C.pulse), 0.55);
  return cold.lerp(hot, t);
}
function styleChords() {
  for (const c of allChords) {
    c.mesh.visible = chordVisible(c);
    c.mesh.geometry.dispose();
    c.mesh.geometry = chordGeometry(c.curve, c.norm);
    c.baseOpacity = chordBaseOpacity(c.norm);
    c.mesh.material.color.copy(chordColor(c));
    c.mesh.material.opacity = c.baseOpacity;
  }
}
// Shared factory: a curved additive tube whose thickness/brightness encode an
// attention weight. `group` ties it into stage dimming; `head` into toggles.
function addChord(g, curve, norm, baseColor, groupName, head) {
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: chordBaseOpacity(norm),
    blending: flowBlending(), depthWrite: false,
  });
  mat.userData.themed = true; // styleChords owns its color
  const mesh = new THREE.Mesh(chordGeometry(curve, norm), mat);
  mesh.userData.chord = true;
  g.add(mesh);
  const c = { mesh, curve, norm, baseColor, group: groupName, head,
    baseOpacity: chordBaseOpacity(norm) };
  mat.color.copy(chordColor(c));
  allChords.push(c);
  return c;
}
function styleConn() {
  // Write into baseOpacity: applyStageDim() owns the final material opacity.
  // Strokes on white need more ink than additive strokes on black, and the
  // faint ones (rails, entry lines, readout→hub) most of all: lift the low
  // end instead of scaling, so 0.16 → ~0.52 while strong edges cap at 0.9.
  const ink = (b) => (TH.dark ? Math.min(0.95, b) : Math.min(0.9, 0.3 + b * 1.4));
  for (const c of connLines) {
    c.obj.material.userData.baseOpacity = ink(c.base);
    c.obj.material.opacity = c.obj.material.userData.baseOpacity;
  }

// ============================================================
// STAGE 1: OBSERVATION (hand fan + trick cards + header + memory)
// ============================================================
function buildInputCards() {
  const g = group("input");
  const handLabel = makeStageLabel("1 · OBSERVATION", "#b58bff");
  handLabel.position.set(XS.input, -9.7, 0);
  g.add(handLabel);

  const TABLE_Y = -6.2; // height the played cards lie at

  // --- the hand: an arced fan of app-styled card faces -------------
  const n = handCardCodes.length;
  const FAN_TOP = 6.4;   // y of the center card
  const FAN_R = 15.5;    // arc radius (pivot far below, like a held hand)
  const FAN_STEP = 0.155;
  const cardW = 3.4;
  const cardObjs = [];
  const handAnchors = [];
  const chosenMatch = S.sample.chosen_action.match(/^(?:PLAY|BURY|UNDER)\s+(\S+)$/);
  const chosenCard = chosenMatch ? chosenMatch[1] : null;
  let chosenUsed = false;
  for (let i = 0; i < n; i++) {
    const code = handCardCodes[i];
    const isTrump = trumpCardCodes.includes(code);
    const theta = (i - (n - 1) / 2) * FAN_STEP;
    let isChosen = false;
    if (!chosenUsed && code === chosenCard) { isChosen = true; chosenUsed = true; }
    const card = makeCardMesh(code, cardW);
    // Fan arc: cards droop toward the edges, and the spread axis is curled
    // toward the +x/+z stage camera (FAN_CURL) so each successive card sits
    // nearer the camera — later cards overlap earlier ones the way a held
    // hand does, keeping every top-left rank corner visible.
    const FAN_CURL = 0.63;
    const u = Math.sin(theta) * FAN_R;
    card.position.set(
      XS.input + Math.sin(FAN_CURL) * u,
      FAN_TOP + (Math.cos(theta) - 1) * FAN_R + (isChosen ? 0.7 : 0),
      -Math.cos(FAN_CURL) * u,
    );
    // Euler XYZ applies the z-roll in card-local space first, then the yaw
    // that faces the stage camera — a fanned card, not a sheared one.
    card.rotation.set(0, 0.45, -theta);
    card.userData.baseY = card.position.y; // idle bob anchors here
    g.add(card);
    cardObjs.push(card);
    handAnchors.push(card.position.clone().add(new THREE.Vector3(1.8, 0, 0)));

    if (isChosen) {
      const cl = makeLabel(`▶ ${S.sample.chosen_action}`, "#80ed99", 0.42);
      cl.position.copy(card.position).add(new THREE.Vector3(0.4, cardW * 0.725 + 1.0, 0));
      g.add(cl);
    }
    // Cards the picker took from the blind — seen once, here in the hand;
    // after the bury only the memory remembers where they came from.
    if ((S.sample.known_blind_codes || []).includes(code)) {
      const fb = makeLabel("from blind", "#b9a8e8", 0.34);
      fb.position.copy(card.position).add(new THREE.Vector3(0.3, -(cardW * 0.725) - 0.6, 0));
      g.add(fb);
    }
    registerCardPickable(card, {
      title: `${code}${isTrump ? " · trump" : ""} · ${cardPoints(code)} pts`,
      badge: "input",
      kv: {
        "card id": String(handCardIds[i]),
        "points": String(cardPoints(code)),
        "trump": isTrump ? "yes (gold rim)" : "no",
        ...(isChosen ? { "chosen": S.sample.chosen_action } : {}),
      },
      body: `<p>${isTrump ? "<b>Trump.</b> " : ""}Card id ${handCardIds[i]} (DECK_IDS) — looked up as one row of the 34×${curDims().d_card} embedding table (the Tokens chapter). The barcode on the face <i>is</i> that row, in the table's colors:</p>` + embRowHtml(code)
        + `<p class="meta" style="margin-top:6px">dims 0–3 suit · 4–7 rank · 8 points/11 · 9 UNDER · 10–15 learned</p>`,
    });
  }

  // Who is holding this hand + what it amounts to.
  const role = S.sample.is_picker ? "picker" : S.sample.is_partner ? "partner" : "defender";
  const seatLab = makeLabel(
    `seat ${S.sample.seat} · ${role} · ${S.sample.phase.toLowerCase()}`, "#cdd9ff", 0.6);
  seatLab.position.set(XS.input, FAN_TOP + 4.7, 0);
  g.add(seatLab);
  const trumpCount = handCardCodes.filter(c => trumpCardCodes.includes(c)).length;
  const heldPts = handCardCodes.reduce((a, c) => a + cardPoints(c), 0);
  const FAIL_SUITS = ["C", "S", "H"];
  const failHeld = FAIL_SUITS.filter(s =>
    handCardCodes.some(c => !trumpCardCodes.includes(c) && parseCardCode(c).suit === s));
  const voids = FAIL_SUITS.filter(s => !failHeld.includes(s));
  const sumLab = makeLabel(
    `${trumpCount} trump · ${heldPts} pts held · fail ${failHeld.map(s => SUIT_SYMBOLS[s]).join(" ") || "—"}${voids.length ? ` · void ${voids.map(s => SUIT_SYMBOLS[s]).join(" ")}` : ""}`,
    "#8e9bd1", 0.48);
  sumLab.position.set(XS.input, FAN_TOP + 3.6, 0);
  g.add(sumLab);

  // --- cards already played this trick ------------------------------
  const trickCodes = S.sample.trick_card_codes
    .map((code, seatOff) => ({ code, seatOff }))
    .filter(t => t.code !== "PAD");
  const trickObjs = [];
  const trickAnchors = [];
  if (trickCodes.length) {
    const tLab = makeLabel("on the table", "#b58bff", 0.5);
    tLab.position.set(XS.input, TABLE_Y + 4.8, 8.5);
    g.add(tLab);
    const tip = S.sample.trick_is_picker || [];
    const tipk = S.sample.trick_is_partner_known || [];
    for (let i = 0; i < trickCodes.length; i++) {
      const { code, seatOff } = trickCodes[i];
      const card = makeCardMesh(code, 2.5);
      card.position.set(XS.input + i * 0.05, TABLE_Y + 1.15, 3.4 + i * 2.9);
      card.rotation.set(-Math.PI / 2 + 0.62, 0.4, 0); // leaning back, face up
      g.add(card);
      trickObjs.push(card);
      trickAnchors.push({
        code,
        anchor: card.position.clone().add(new THREE.Vector3(1.6, 0.5, 0)),
      });
      // Trick slots are relative-seat indexed: 0 = the acting seat, +k = k
      // seats to the left. Flag the picker / revealed partner right here.
      const who = seatOff === 0 ? "me" : `+${seatOff}`;
      const roleTag = tip[seatOff] ? " · picker" : tipk[seatOff] ? " · partner ★" : "";
      const sl = makeLabel(`${who}${roleTag}`,
        tipk[seatOff] ? "#ffe1a3" : "#b9c6f2", 0.38);
      sl.position.set(XS.input, TABLE_Y + 3.5, 3.4 + i * 2.9);
      g.add(sl);
      registerCardPickable(card, {
        title: `${code} (on table)`,
        badge: "input",
        kv: {
          "played by": `seat ${who}${roleTag.replace(" · ", " — ")}`,
          "points": String(cardPoints(code)),
          "trump": trumpCardCodes.includes(code) ? "yes" : "no",
        },
        body: `<p>Played earlier this trick by ${seatOff === 0 ? "this seat" : `the seat ${seatOff} to the left`}${tip[seatOff] ? " — <b>the picker</b>" : tipk[seatOff] ? " — <b>the revealed partner</b>" : ""}. Feeds trick token ${seatOff} (with is-picker / is-known-partner flags) so the network can reason about what it must beat.</p>` + embRowHtml(code),
      });
    }
  }

  // --- header + memory chips, behind the cards -----------------------
  const chipY = -1.2, chipZ = -10.5;
  const headerChip = new THREE.Mesh(
    new RoundedBoxGeometry(3.6, 1.4, 0.3, 3, 0.14),
    new THREE.MeshStandardMaterial({
      color: 0x9d7bff, emissive: 0x9d7bff, emissiveIntensity: 0.2, roughness: 0.4,
    }),
  );
  headerChip.position.set(XS.input, chipY, chipZ);
  headerChip.rotation.y = 0.45;
  g.add(headerChip);
  const headerLab = makeLabel("header (10)", "#e6ddff", 0.6);
  headerLab.position.set(XS.input + 3, chipY, chipZ + 0.5);
  g.add(headerLab);
  registerPickable(headerChip, {
    title: "Header scalars (10)",
    badge: "input",
    kv: headerKv(),
    body: `<p>The game-phase context for this decision, normalized and fused (with the called-card embedding) into the context token. Relative seats count leftward from this seat.</p>`,
  });
  const headerAnchor = new THREE.Vector3(XS.input + 2, chipY, chipZ);

  const memMag = vecMag(S.memory.memory_in);
  const memChip = new THREE.Group();
  const memBody = new THREE.Mesh(
    new RoundedBoxGeometry(3.6, 1.4, 0.3, 3, 0.14),
    new THREE.MeshStandardMaterial({
      color: 0xf4a261, emissive: 0xf4a261,
      emissiveIntensity: 0.12 + clamp(memMag / 10, 0, 1) * 0.35, roughness: 0.4,
    }),
  );
  const stripTex = memoryStripTexture(S.memory.memory_in);
  const memStrip = new THREE.Mesh(
    new THREE.PlaneGeometry(3.3, 1.1),
    new THREE.MeshStandardMaterial({
      map: stripTex, emissive: 0xffffff, emissiveMap: stripTex,
      emissiveIntensity: 0.55, metalness: 0, roughness: 0.6,
    }),
  );
  memStrip.position.z = 0.17;
  memChip.add(memBody, memStrip);
  memChip.position.set(XS.input, chipY - 2.2, chipZ);
  memChip.rotation.y = 0.45;
  g.add(memChip);
  const memLab = makeLabel(`memory hₜ₋₁ (256) · ‖${memMag.toFixed(1)}‖`, "#ffd99c", 0.6);
  memLab.position.set(XS.input + 3, chipY - 2.2, chipZ + 0.5);
  g.add(memLab);
  const memInfoPick = {
    title: "Prior memory hₜ₋₁",
    badge: "input",
    kv: { "‖memory_in‖": memMag.toFixed(2) },
    body: (memMag < 1e-6
      ? `<p>256-d recurrent state from this player's previous decision. Zeros here — this is the seat's first decision of the hand (the strip is dark). Carried via a GRU cell — see the Memory chapter.</p>`
      : `<p>256-d recurrent state carried from this seat's previous decisions — it has already seen the earlier phases of this hand. Updated by the GRU cell in the Memory chapter.</p>`)
      + `<p>The strip paints all 256 dims (two rows of 128): warm = positive, cool = negative, dark = near zero.</p>`,
  };
  registerPickable(memBody, memInfoPick);
  registerPickable(memStrip, memInfoPick);
  const memAnchor = new THREE.Vector3(XS.input + 2, chipY - 2.2, chipZ);

  // --- the bury, remembered: once the picker has buried, the two cards
  // are in no observation (the recall contract) — only the memory can
  // carry them. Drawn as ghosts beside the memory chip, not as inputs.
  const buryCodes = S.sample.known_bury_codes || [];
  if (buryCodes.length) {
    const buLab = makeLabel("your bury · memory only", "#ffd99c", 0.4);
    buLab.position.set(XS.input, chipY - 4.1, chipZ + 0.2);
    g.add(buLab);
    for (let i = 0; i < buryCodes.length; i++) {
      const bc = makeCardMesh(buryCodes[i], 1.5, { withVec: false });
      bc.position.set(XS.input, chipY - 6.0, chipZ - 0.9 + i * 1.9);
      bc.rotation.y = 0.45;
      bc.traverse(o => {
        if (o.material) { o.material.transparent = true; o.material.opacity = 0.45; }
      });
      g.add(bc);
      registerCardPickable(bc, {
        title: `${buryCodes[i]} · buried (remembered)`,
        badge: "input",
        kv: { "points": String(cardPoints(buryCodes[i])), "in observation": "no" },
        body: `<p>Buried by this seat — ${cardPoints(buryCodes[i])} points banked for the picker team. A human picker remembers the bury; so must the network. It is <b>not</b> in the observation and has no token — if it reaches this decision at all, it arrives through the memory hₜ₋₁.</p>`,
      });
    }
  }

  return { cardObjs, trickObjs, handAnchors, trickAnchors, headerAnchor, memAnchor };
}

// ============================================================
// STAGE 2: CARD EMBEDDING TABLE (34 × 16) — instanced
// ============================================================
function buildEmbeddingTable() {
  const g = group("embed");
  const lab = makeStageLabel(
    NETWORK_MODE === 1
      ? "2 · ORACLE CARD EMBEDDINGS · own (34 × 16)"
      : "2 · CARD EMBEDDINGS · (34 × 16)",
    NETWORK_MODE === 1 ? "#c9b8ff" : "#4cc9f0");
  lab.position.set(XSA.embed, -9.7, 0);
  g.add(lab);

  const ROWS = 34, COLS = 16;
  const cellW = 0.32, cellH = 0.42, gap = 0.04;
  const totalW = COLS * (cellW + gap);
  const totalH = ROWS * (cellH + gap);

  // Rows referenced by this scenario: hand + cards on the table + called
  // card (the observation — nothing the seat merely remembers).
  const usedIds = new Set(handCardIds.filter(id => id !== 0));
  for (const code of S.sample.trick_card_codes) {
    if (code !== "PAD") usedIds.add(code === "UNDER" ? 33 : deckIds[code]);
  }
  if (S.sample.called_card && deckIds[S.sample.called_card]) {
    usedIds.add(deckIds[S.sample.called_card]);
  }
  if (NETWORK_MODE === 1 && SO) {
    // The oracle also embeds every hidden card it sees.
    for (const row of SO.sample.opp_hand_ids) {
      for (const cid of row) if (cid) usedIds.add(cid);
    }
    for (const code of [...SO.sample.blind_cards, ...SO.sample.bury_cards]) {
      if (deckIds[code]) usedIds.add(deckIds[code]);
    }
    if (SO.sample.under_card && deckIds[SO.sample.under_card]) {
      usedIds.add(deckIds[SO.sample.under_card]);
    }
  }

  const geom = new THREE.BoxGeometry(cellW, cellH, 0.25);
  const inst = new THREE.InstancedMesh(geom, new THREE.MeshStandardMaterial({
    metalness: 0.2, roughness: 0.55, vertexColors: false,
  }), ROWS * COLS);
  inst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(ROWS * COLS * 3), 3);

  const tempColor = new THREE.Color();
  const dummy = new THREE.Object3D();

  const emb = curEmbedding();
  const embMin = emb.min;
  const embMax = emb.max;
  const embRange = Math.max(1e-6, embMax - embMin);
  const table = emb.table;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c;
      const xLocal = (c - COLS / 2) * (cellW + gap) + cellW / 2;
      const yLocal = (ROWS / 2 - r) * (cellH + gap) - cellH / 2;
      dummy.position.set(XSA.embed, yLocal, xLocal); // table standing in YZ plane
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);

      tempColor.setHex(C.dim);
      if (usedIds.has(r)) {
        const v = table[r][c];
        const norm = (v - embMin) / embRange; // 0..1
        // diverging-ish: cool blue for low, white-ish mid, warm for high
        tempColor.setHSL(0.6 - norm * 0.55, 0.9, 0.25 + norm * 0.45);
      }
      inst.setColorAt(i, tempColor);
    }
  }
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

  g.add(inst);

  // Row labels (only used rows) — suit-colored, gold for trump rows.
  const usedRowYs = {};
  for (const r of usedIds) {
    const yLocal = (ROWS / 2 - r) * (cellH + gap) - cellH / 2;
    const code = idToCode[r] || `id ${r}`;
    const sym = SUIT_SYMBOLS[parseCardCode(code).suit] || "";
    const isTrumpRow = trumpCardCodes.includes(code);
    const labColor = isTrumpRow ? "#ffe89c"
      : sym === "♥" || sym === "♦" ? "#ff9d9d" : "#cdd9ff";
    const rowLab = makeLabel(`${code}${sym ? " " + sym : ""} · row ${r}`, labColor, 0.5);
    rowLab.position.set(XSA.embed, yLocal, totalW / 2 + 1.4);
    g.add(rowLab);
    usedRowYs[r] = yLocal;
  }

  // Informed-init dim groups as column headers along the top edge.
  const colZ = (c) => (c - COLS / 2) * (cellW + gap) + cellW / 2;
  for (const grp of [
    ["suit", 0, 3], ["rank", 4, 7], ["pts", 8, 8], ["und", 9, 9], ["learned", 10, 15],
  ]) {
    const gl = makeLabel(grp[0], "#8e9bd1", 0.34);
    gl.position.set(XSA.embed, totalH / 2 + 0.9, (colZ(grp[1]) + colZ(grp[2])) / 2);
    g.add(gl);
  }

  // Connections: each input card → its row.
  if (NETWORK_MODE === 0) {
    for (let i = 0; i < handCardCodes.length; i++) {
      const cid = handCardIds[i];
      if (!(cid in usedRowYs)) continue;
      const end = new THREE.Vector3(XSA.embed - 0.1, usedRowYs[cid], 0);
      g.add(makeGlowLine(inputInfo.handAnchors[i].clone(), end, C.input, 0.3));
    }
    // ... and each on-table card → its row
    for (const t of inputInfo.trickAnchors) {
      const cid = t.code === "UNDER" ? 33 : deckIds[t.code];
      if (cid in usedRowYs) {
        const end = new THREE.Vector3(XSA.embed - 0.1, usedRowYs[cid], 0);
        g.add(makeGlowLine(t.anchor.clone(), end, C.input, 0.22));
      }
    }
  } else {
    // Oracle: one line per revealed fan (own + 4 opponents) into the table.
    for (const a of (inputInfo.fanAnchors || [])) {
      g.add(makeGlowLine(
        a.clone(),
        new THREE.Vector3(XSA.embed - 0.1, 0, 0),
        ORACLE_VIOLET, 0.25));
    }
  }

  // Click-target for the whole table
  const tableProxy = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, totalH + 0.5, totalW + 0.5),
    new THREE.MeshBasicMaterial({ visible: false }),
  );
  tableProxy.position.set(XSA.embed, 0, 0);
  g.add(tableProxy);
  registerPickable(tableProxy, {
    title: "nn.Embedding(34, 16)",
    badge: "enc",
    body: NETWORK_MODE === 1
      ? `<p>The ORACLE'S OWN card embedding table — zero parameters are shared with the policy stack (the isolation guarantee: privileged gradients can never shape the actor). Same 34×16 layout and informed init as the policy's table.</p>
        <p>The highlighted rows are every card the oracle sees this scenario — including all four hidden hands and the true blind/bury.</p>`
      : `<p>The card embedding table. 34 rows (PAD, 32 real cards, UNDER token) × 16 dims. Dims 0–3 = suit one-hot · 4–7 = per-suit rank · 8 = points/11 · 9 = UNDER flag · 10–15 = free to learn.</p>
      <p>The highlighted rows are the cards this scenario touches (hand, table, called card). The same table is reused by the actor's two-tower CALL scorer, so any update here propagates everywhere.</p>`,
  });

  return { usedRowYs, totalW, totalH };
}

// ============================================================
// STAGE 3: TOKEN BANK (15 tokens, 64-d each)
// ============================================================
function buildTokens() {
  const g = group("tokens");
  const lab = makeStageLabel(
    `3 · TOKENIZE · (${N_TOK} × ${curDims().d_token})`,
    NETWORK_MODE === 1 ? "#c9b8ff" : "#4cc9f0");
  lab.position.set(XSA.tokensPre, -9.7, 0);
  g.add(lab);

  const tokenObjs = [];

  // One chip per token — shared between the policy column and the oracle
  // column + opp grid layouts.
  const addChip = (i, pos, labelDX, labelScale) => {
    const info = TOKEN_INFO[i];
    const active = tokenMask(i);
    const mag = tokenPreNorm(i);
    const dims = NETWORK_MODE === 1 ? [3.0, 0.5, 0.5] : [4.5, 0.6, 0.6];
    // PAD slots collapse to small ghost chips: present, but not clutter.
    const tokGeom = active
      ? new THREE.BoxGeometry(dims[0], dims[1], dims[2])
      : new THREE.BoxGeometry(1.4, 0.26, 0.26);
    const color = active ? tokenColor(i) : C.dim;
    const intensity = active ? 0.35 : 0.05;
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: intensity,
      metalness: 0.3, roughness: 0.4,
      transparent: !active, opacity: active ? 1 : 0.18,
    });
    const tok = new THREE.Mesh(tokGeom, mat);
    tok.position.copy(pos);
    g.add(tok);
    tokenObjs.push({
      mesh: tok, y: pos.y, pos: pos.clone(), info, active, magnitude: mag,
    });

    let labText = info.type;
    const code = tokenCardCode(i);
    if (info.type === "hand") labText = `hand[${info.idx}] ${code || "PAD"}`;
    else if (info.type === "trick") labText = `trick[${info.idx}]${code ? " " + code : ""}`;
    else if (info.type === "blind") labText = `blind[${info.idx}]${code ? " " + code : ""}`;
    else if (info.type === "bury") labText = `bury[${info.idx}]${code ? " " + code : ""}`;
    else if (info.type === "opp") labText = code || "PAD";
    if (active) {
      const tlab = makeLabel(labText, code ? "#e6dcff" : "#cfe9ff", labelScale);
      tlab.position.copy(pos).add(new THREE.Vector3(labelDX, 0, 0));
      g.add(tlab);
      // Card-bearing tokens carry a mini face of their card.
      if (code) {
        const mini = makeCardMesh(code, NETWORK_MODE === 1 ? 0.56 : 0.72, { withVec: false });
        mini.position.copy(pos).add(new THREE.Vector3(NETWORK_MODE === 1 ? -2.3 : -3.4, 0, 0));
        mini.rotation.y = 0.45;
        g.add(mini);
      }
    }

    const isPartnerTok =
      NETWORK_MODE === 1 && info.type === "opp" && SO
      && SO.sample.secret_partner_rel >= 2
      && info.seat === SO.sample.secret_partner_rel - 2;
    registerPickable(tok, {
      title: `Token ${i}: ${labText}`,
      badge: "enc",
      kv: { "type": info.type, "active": active ? "yes" : "PAD", "‖vec‖": mag.toFixed(2) },
      body: info.type === "opp"
        ? `<p>A HIDDEN card in relative seat +${info.seat + 1}'s hand${isPartnerTok ? " — <b>the secret partner's seat</b> (gold)" : ""}. The oracle sees it; the acting player never does. Built from card ⊕ seat ⊕ role embeddings → MLP.</p>`
        : `<p>One of ${N_TOK} entity tokens. Built by the type-specific MLP, then has the <code>card_type</code> embedding added in (so attention can tell context vs memory vs hand-card etc.).</p>
        <p>Rides its residual rail through ${N_LAYERS} transformer layers next.</p>`,
    });
  };

  if (NETWORK_MODE === 0) {
    // Column geometry: the rows must fit between the floor grid (y = −10,
    // where the stage label lies) and a reasonable top, centered at +2.
    const spacingY = 1.15;
    const topY = 2 + ((N_TOK - 1) * spacingY) / 2;
    for (let i = 0; i < N_TOK; i++) {
      addChip(i, new THREE.Vector3(XSA.tokensPre, topY - i * spacingY, 0), 3.5, 0.45);
    }
  } else {
    // Oracle: its 19 base tokens (the policy's 15 + true blind/bury) in a
    // column, plus the 32 opponent-hand tokens as a 4-column grid (one
    // column per hidden seat) beside it.
    const spacingY = 1.05;
    const topY = 2 + ((19 - 1) * spacingY) / 2;
    for (let i = 0; i < 19; i++) {
      addChip(i, new THREE.Vector3(XSA.tokensPre, topY - i * spacingY, -8), 3.0, 0.4);
    }
    const gSpacing = 1.3;
    const gTop = 2 + ((8 - 1) * gSpacing) / 2;
    for (let s = 0; s < 4; s++) {
      const z = -2 + s * 3.4;
      const isPartnerSeat = SO && SO.sample.secret_partner_rel >= 2
        && s === SO.sample.secret_partner_rel - 2;
      const head = makeLabel(
        `seat +${s + 1}${isPartnerSeat ? " ★ partner" : ""}`,
        isPartnerSeat ? "#ffe1a3" : "#d9ccff", 0.42);
      head.position.set(XSA.tokensPre, gTop + 1.5, z);
      g.add(head);
      for (let k = 0; k < 8; k++) {
        const i = 19 + s * 8 + k;
        addChip(i, new THREE.Vector3(XSA.tokensPre, gTop - k * gSpacing, z), 2.0, 0.34);
      }
    }
  }

  // context ← header chip
  const ctxEnd = tokenObjs[0].pos.clone().add(new THREE.Vector3(-2.3, 0, 0));
  g.add(makeGlowLine(inputInfo.headerAnchor.clone(), ctxEnd, C.share, 0.4));
  // memory chip → token 1
  const memEnd = tokenObjs[1].pos.clone().add(new THREE.Vector3(-2.3, 0, 0));
  g.add(makeGlowLine(inputInfo.memAnchor.clone(), memEnd, C.share, 0.4));

  // Card-bearing tokens ← their embedding rows (hand + trick in policy;
  // plus true blind/bury and all opp cards in oracle mode, where
  // tokenCardCode reveals them).
  for (let i = 0; i < N_TOK; i++) {
    const code = tokenCardCode(i);
    if (!code) continue;
    const cid = code === "UNDER" ? 33 : deckIds[code];
    const rowY = embedInfo.usedRowYs[cid];
    if (rowY === undefined) continue;
    const start = new THREE.Vector3(XSA.embed + 0.3, rowY, 0);
    const end = tokenObjs[i].pos.clone().add(new THREE.Vector3(-2.3, 0, 0));
    g.add(makeGlowLine(start, end, C.enc, NETWORK_MODE === 1 ? 0.16 : 0.32));
  }

  return { tokenObjs };
}

// ============================================================
// STAGE 4: TRANSFORMER TUNNEL — one ring per reasoning layer,
// per-head attention chords inside each ring, FFN lens after it,
// straight residual-stream rails carrying each token through.
// ============================================================
function ringPoint(l, i) {
  const theta = (i / N_TOK) * Math.PI * 2 - Math.PI / 2;
  return new THREE.Vector3(
    xfX(l),
    Math.sin(theta) * RING_R + RING_CY,
    Math.cos(theta) * RING_R,
  );
}
function tokName(i) {
  const code = tokenCardCode(i);
  if (code) return code;
  const info = TOKEN_INFO[i];
  return info.type === "hand" || info.type === "trick"
    ? `${info.type}[${info.idx}]` : info.type;
}

function buildTransformerTunnel() {
  const g = group("xf"); // rails + entry lines + shared labels
  const lab = makeStageLabel(
    `4 · TRANSFORMER · ${N_LAYERS} layers × ${N_HEADS} heads · ${N_TOK} tokens`,
    NETWORK_MODE === 1 ? "#c9b8ff" : "#4cc9f0");
  lab.position.set(xfX(0) + XSA.xfSpacing, -9.7, 0);
  g.add(lab);

  const layers = curLayers();
  const ringPosByLayer = [];
  for (let l = 0; l < N_LAYERS; l++) {
    ringPosByLayer.push(Array.from({ length: N_TOK }, (_, i) => ringPoint(l, i)));
  }
  const layerObjs = [];

  for (let l = 0; l < N_LAYERS; l++) {
    const gl = group(`xf${l}`);
    const L = layers[l];
    const pos = ringPosByLayer[l];
    const center = new THREE.Vector3(xfX(l), RING_CY, 0);

    // Translucent layer disc — the residual/LayerNorm boundary of this layer.
    const disc = new THREE.Mesh(
      new THREE.TorusGeometry(RING_R + 1.2, 0.14, 10, 72),
      new THREE.MeshStandardMaterial({
        color: C.enc, emissive: C.enc, emissiveIntensity: 0.28,
        metalness: 0.5, roughness: 0.3,
        transparent: true, opacity: 0.5,
      }),
    );
    disc.position.copy(center);
    disc.rotateY(Math.PI / 2);
    gl.add(disc);
    const dLab = makeLabel(`layer ${l + 1}`, "#9fd8ff", 0.6);
    dLab.position.set(xfX(l), RING_CY + RING_R + 2.6, 0);
    gl.add(dLab);
    registerPickable(disc, {
      title: `Transformer layer ${l + 1} / ${N_LAYERS}`,
      badge: "enc",
      kv: { "attention": `${N_HEADS} heads · ${DATA.dims.d_token}d`, "FFN": `${DATA.dims.d_token}→${DATA.dims.d_token * 2}→${DATA.dims.d_token} · SiLU`, "norms": "post-LN ×2 (after attn, after FFN)" },
      body: `<p>One reasoning layer: multi-head self-attention over the ${N_TOK} tokens (chords, colored by head), residual + LayerNorm, then the position-wise FFN (the lens behind the ring), residual + LayerNorm.</p>
        <p>The ring itself marks the residual boundary — every token passes straight through on its rail and is only <i>updated</i>, never replaced.</p>`,
    });

    // Token nodes — radius tracks this layer's post-FFN token norm, so the
    // representation visibly evolves ring to ring.
    const normsFfn = L.token_norms_ffn;
    const maxNorm = Math.max(...normsFfn.filter((_, i) => tokenMask(i)));
    const nodeObjs = [];
    for (let i = 0; i < N_TOK; i++) {
      const info = TOKEN_INFO[i];
      const active = tokenMask(i);
      const mag = normsFfn[i];
      const rBase = NETWORK_MODE === 1 ? 0.28 : 0.42;
